    if (!window.Boot || !Boot.CFG.talk) return;
    if (p < 0 || p >= g.N) return;
    var ch = charOfSeat(p);
    if (!ch) return;
    var t = Talk.say(ch, key, {
      seat: p, suit: ctx && ctx.suit, lvl: g.lvl || 2, mine: (p === ME),
      joke: !!(ctx && ctx.joke),
      tags: ctx && ctx.tags,
      sex: sexOfSeat(p),
      tsex: (ctx && ctx.to != null) ? sexOfSeat(ctx.to) : ''
    }, force);
    if (!t) return;
    // Ник: «шутки не успеваю читать». Длинная байка теперь висит секунд
    // пятнадцать, короткая — около пяти; потолок, чтоб не залипала навсегда
    bubble(p, t, 'talk', Math.min(17000, 4200 + t.length * 95), true);
  }
  function anyBot(except) {
    var l = [];
    for (var p = 0; p < g.N; p++)
      if (p !== ME && p !== except && charOfSeat(p)) l.push(p);
    return l.length ? l[Math.floor(Math.random() * l.length)] : -1;
  }

  function chat(e) {
    if (!window.Boot || !Boot.CFG.talk) return;
    var p, i;
    switch (e.e) {
      case 'deal':
        if (g.handNo === 1) for (p = 0; p < g.N; p++) talk(p, 'greet');
        else talk(g.dealer, 'dealing');
        break;
      case 'bid': talk(e.p, 'bidPass'); break;
      case 'trump':
        talk(e.p, e.forced ? 'obyaz' : (e.round === 2 ? 'bid2' : 'bidTake'), { suit: e.suit });
        break;
      case 'swap7': talk(e.p, 'swap7'); break;
      case 'combo':
        if (e.tie) talk(e.p, 'comboTie', null, true);
        else if (e.declare) talk(e.p, e.kind === 'P' ? 'comboP' : 'comboT');
        else if (e.yield) talk(e.p, 'comboYield');
        else if (e.dead) talk(e.p, 'comboDead');
        break;
      case 'combo-ask': talk(e.p, 'comboAsk'); break;
      case 'bella': talk(e.p, 'bella', null, true); break;
      case 'card':
        /* Метки идут вместе с ходом: реплика, называющая карту, ляжет
           только на неё. Мусор — козырный валет, манэлла — козырная
           девятка; сказанные не на ту карту, они режут ухо сразу. */
        var tg = Talk.cardTags ? Talk.cardTags(e.c, g.trump) : null;
        if (e.first && e.c.s === g.trump) talk(e.p, 'leadTrump', { tags: tg });
        else if (e.val >= 10) talk(e.p, 'playBig', { tags: tg });
        else if (e.forced) talk(e.p, 'playForced', { tags: tg });
        else if (e.val === 0) talk(e.p, 'playSmall', { tags: tg });
        break;
      case 'trick':
        var worst = -1, wv = 0;
        e.plays.forEach(function (pl) {
          if (pl.p === e.w) return;
          var v = K.val(pl.c, g.trump);
          if (v > wv) { wv = v; worst = pl.p; }
        });
        var lead = e.plays[0].c.s, wc = null;
        e.plays.forEach(function (pl) { if (pl.p === e.w) wc = pl.c; });
        var ruffed = wc && wc.s === g.trump && lead !== g.trump;
        var lastOne = g.hands && g.hands[e.w] && !g.hands[e.w].length;
        // напару жирную карту в чужую взятку кладут не от хорошей жизни,
        // и напарник это видит: тут извиняются, а не комментируют
        var fed = (worst >= 0 && wv >= 10 && g.o.pairs && g.sideOf &&
          g.sideOf(worst) !== g.sideOf(e.w));
        if (ruffed && e.v >= 6) talk(e.w, 'ruff');
        else if (lastOne) talk(e.w, 'posled');
        else if (e.v >= 15) {
          talk(e.w, 'winBig');
          if (worst >= 0) talk(worst, fed && Math.random() < 0.5 ? 'mateSorry' : 'loseBig');
          if (e.w === ME) talk(anyBot(), 'respect');
        } else if (e.v <= 2) talk(e.w, 'winSmall');
        else if (fed) talk(worst, 'mateSorry');
        // напару: тот, за кого взял напарник, говорит спасибо
        if (g.o.pairs && e.v >= 10) {
          var mate = (e.w + 2) % 4;
          if (mate !== e.w) talk(mate, 'mateThanks', { to: e.w });
        }
        if (e.w !== ME && worst === ME && wv >= 10) talk(e.w, 'taunt');
        // между взятками за столом травят байки — иначе тихо, как в читальне
        if (Math.random() < 0.24) wait(1500, function () {
          talk(anyBot(e.w), Math.random() < 0.55 ? 'anekdot' : 'idle', { joke: true });
        });
        break;
      case 'redeal': talk(anyBot(), 'redeal'); break;
      case 'hand-end':
        if (Math.random() < 0.55) wait(2600, function () { talk(anyBot(), 'anekdot', null, true); });
        if (e.res.hang) { talk(anyBot(), 'visyak', null, true); break; }
        for (i = 0; i < g.N; i++) if (e.res.det[i] && e.res.det[i].lyzhi) {
          if (i === ME) talk(anyBot(), 'lyzhiOpp', null, true);
          else talk(i, 'lyzhiSelf', null, true);
        }
        if (e.res.beit) {
          // напару бейт — это не только своя беда: слово брали за двоих
          talk(g.declarer, g.o.pairs && Math.random() < 0.45 ? 'mateSorry' : 'beitSelf', null, true);
          talk(anyBot(g.declarer), 'beitOpp');
        } else {
          var best = 0, bv = -1e9;
          for (i = 0; i < g.N; i++) if (e.res.final[Math.min(i, e.res.final.length - 1)] > bv) { bv = e.res.final[Math.min(i, e.res.final.length - 1)]; best = i; }
          talk(best, 'handWin');
          talk(anyBot(best), 'handLose');
        }
        break;
    }
  }

  /* ---------- центр ---------- */
  // размер центра считаем от карты, иначе на планшете взятки налезали друг на друга
  function sizeTrick() {
    var t = $('#trick'), tb = $('#table');
    var cw = cardW(), ch = cw * 1.49;
    var wide = g.N === 4 ? 3.15 : (g.N === 3 ? 3.05 : 1.15);
    var tall = g.N === 2 ? 2.05 : 2.15;
    var W = Math.min(tb.clientWidth * 0.94, cw * wide);
    var H = Math.min(tb.clientHeight * 0.52, ch * tall);
    t.style.width = Math.round(W) + 'px';
    t.style.height = Math.round(H) + 'px';
    var d = $('#drop');
    d.style.width = Math.round(Math.min(tb.clientWidth * 0.96, W + 40)) + 'px';
    d.style.height = Math.round(H + 20) + 'px';
    return [W, H];
  }

  function slotPos(p) {
    var off = (p - ME + g.N) % g.N;
    var sz = sizeTrick(), W = sz[0], H = sz[1];
    var cw = cardW(), ch = cw * 512 / 344;
    var cx = W / 2 - cw / 2, cy = H / 2 - ch / 2;
    if (off === 0) return [cx, H - ch];
    if (g.N === 2) return [cx, 0];
    if (g.N === 3) return off === 1 ? [0, 0] : [W - cw, 0];
    if (off === 1) return [0, cy];
    if (off === 2) return [cx, 0];
    return [W - cw, cy];
  }

  /* Карты на столе. Обычно это `g.cur` — текущая незаконченная взятка.

     Но в момент, когда взятка ЗАКРЫЛАСЬ, движок уже переложил её в
     `tricks` и очистил `cur`, а стол в это время только доигрывает полёт
     последней карты. Рисовать тут `cur` — значит стереть третью карту, не
     показав её: получалось, что последняя карта до стола вообще не
     доходила, а пауза держала ПУСТОЙ стол.

     Ник: «после сыгранной последней карты просто взятка испаряется».
     Поэтому пока взятка показывается, стол рисует её из `shown`. */
  var shown = null;
  function drawTrick() {
    var t = $('#trick'); t.innerHTML = '';
    (shown || g.cur || []).forEach(function (pl) {
      var pos = slotPos(pl.p);
      var c = el('div', 'card');
      c.innerHTML = ART.faceHTML(pl.c);
      c.style.cssText = 'position:absolute;left:' + pos[0] + 'px;top:' + pos[1] + 'px;width:' + cardW() + 'px';
      t.appendChild(c);
    });
  }

  function drawDeck() {
    var d = $('#deckzone'); d.innerHTML = '';
    if (dealing) {                                  // карты ещё сдают, козырь не открыт
      var st = el('div', 'stock');
      st.innerHTML = '<div class="card cd"></div><div class="card cu back"></div>';
      d.appendChild(st);
      return;
    }
    if (g.upCard) {
      // как за столом: открытый козырь лежит поверх колоды, из-под него торчит рубашка
      var m = el('div', 'stock');
      m.innerHTML = '<div class="card cd"></div><div class="card cu">' + ART.faceHTML(g.upCard) + '</div>' +
        '<span class="lb">' + (g.trump ? 'козырь' : 'на торг') + '</span>';
      d.appendChild(m);
    }
    if (g.freza) {
      var f = el('div', 'mini');
      f.innerHTML = '<div class="card" style="width:100%">' + ART.faceHTML(g.freza) + '</div><span class="lb">фреза</span>';
      d.appendChild(f);
    }
  }

  /* ---------- табло ---------- */
  function drawInfo() {
    var b = $('#info'); if (!b) return;
    var t = g.trump, i;
    var suit = t
      ? '<span class="suit">' + ART.pipSVG(t, 26) + '</span>'
      : '<span class="suit none">?</span>';
    var h = '<div class="tr">' + suit + '<span><b>' +
      (t ? K.SUIT_NAME[t] : 'козырь не взят') + '</b><span>' +
      (g.declarer >= 0 ? 'играет ' + g.names[g.declarer] : 'идёт торг') + '</span></span></div>';

    var narrow = matchMedia('(max-width:900px)').matches;

    // что объявлено
    var comb = '<b class="dim">—</b>';
    if (g.comboWinner >= 0) comb = '<b>' + g.names[g.comboWinner] + ' +' + g.comboPts + '</b>';
    else if (g.cTie) comb = '<b>спор: ' + g.names[g.cTie[0]] + ' и ' + g.names[g.cTie[1]] + '</b>';
    else if (g.cLeader >= 0) {
      var kd = (g.combos && g.combos[g.cLeader] && g.combos[g.cLeader][0])
        ? g.combos[g.cLeader][0].kind : g.cLeadKind;
      if (kd) comb = '<b>' + g.names[g.cLeader] + ': ' + g.kindWord({ kind: kd }) + '</b>';
    }
    if (!narrow || comb.indexOf('dim') < 0) h += '<div class="grp"><span>комбинации</span>' + comb + '</div>';

    var bel = '<b class="dim">—</b>';
    if (g.bella && g.bella.announced)
      bel = '<b>' + g.names[g.bella.taker >= 0 ? g.bella.taker : g.bella.holder] + ' +' + K.BELLA + '</b>';
    if (!narrow || bel.indexOf('dim') < 0) h += '<div class="grp"><span>белла</span>' + bel + '</div>';

    // очки: сколько уже во взятках и сколько ещё ходит по рукам
    var taken = 0;
    for (i = 0; i < g.N; i++) taken += (g.pts ? g.pts[i] : 0);
    var seen = taken;
    if (g.upCard) seen += K.val(g.upCard, t);
    if (g.freza) seen += K.val(g.freza, t);
    var left = Math.max(0, 152 - seen);
    // втроём и в дуэли часть колоды в игру не попадает, поэтому «не разыграно»,
    // а не «на руках»: в это число входят и карты, которые никому не сдали
    h += '<div class="grp"><span>очки</span><b>' + taken + ' взято' +
      (narrow ? '' : ' · ' + left + (g.N === 4 ? ' на руках' : ' не разыграно')) + '</b></div>';

    h += '<div class="pts">';
    if (g.o.pairs) {
      // напару счёт общий: показываем две команды, а не четыре столбика
      var sd = g.sideList();
      for (i = 0; i < sd.length; i++) {
        var sp = 0, stk = 0;
        sd[i].forEach(function (p) { sp += (g.pts ? g.pts[p] : 0); stk += (g.taken ? g.taken[p] : 0); });
        h += '<i class="' + (sd[i].indexOf(ME) >= 0 ? 'me' : '') + '">' + g.sideName(i) + ' ' + sp +
          (stk ? ' <small>(' + stk + ')</small>' : '') + '</i>';
      }
    } else {
      for (i = 0; i < g.N; i++)
        h += '<i class="' + (i === ME ? 'me' : '') + '">' + g.names[i] + ' ' +
          (g.pts ? g.pts[i] : 0) + (g.taken && g.taken[i] ? ' <small>(' + g.taken[i] + ')</small>' : '') + '</i>';
    }
    h += '</div>';
    b.innerHTML = h;
    // табло может занять две строки — двигаем колоду и места под него
    document.documentElement.style.setProperty('--infoh', (b.offsetHeight || 46) + 'px');
  }

  /* ---------- рука ---------- */
  function cardW() {
    var n = Math.max(1, (g.hands && g.hands[ME].length) || 9);
    var t = $('#table'), w = t.clientWidth, h = t.clientHeight;
    var narrow = w < 620;
    var over = narrow ? 0.46 : 0.66;                    // какая доля карты видна
    var byW = (w - 16) / (1 + over * (n - 1));
    var byH = (h * (narrow ? 0.30 : 0.34)) / 1.49;      // рука не выше трети стола
    var v = Math.round(Math.min(byW, byH, narrow ? 96 : 122));
    v = Math.max(44, v);
    document.documentElement.style.setProperty('--ov', -(1 - over).toFixed(2));
    return v;
  }

  var selected = null;
  function drawHand() {
    var h = $('#hand'); h.innerHTML = '';
    document.documentElement.style.setProperty('--cw', cardW() + 'px');
    if (!g.hands || dealing) return;
    var legal = null;
    var myTurn = g.pending && g.pending.type === 'play' && g.pending.p === ME;
    if (myTurn) legal = g.pending.legal.map(K.id);
    g.hands[ME].forEach(function (c) {
      var d = el('div', 'card');
      d.innerHTML = ART.faceHTML(c);
      d.dataset.id = K.id(c);
      if (myTurn) d.classList.add(legal.indexOf(K.id(c)) >= 0 ? 'playable' : 'dead');
      if (selected === K.id(c)) d.classList.add('sel');
      h.appendChild(d);
    });
  }

  function hint(t) { $('#hint').textContent = t || ''; }

  /* ---------- сдача ---------- */
  var dealing = false;

  function deckPoint() {
    var dz = $('#deckzone').getBoundingClientRect();
    if (dz.width > 4) return { x: dz.left + dz.width / 2, y: dz.top + dz.height / 2 };
    var t = $('#table').getBoundingClientRect();
    return { x: t.left + t.width / 2, y: t.top + t.height * 0.42 };
  }
  function seatPoint(p) {
    if (p === ME) {
      var h = $('#handwrap').getBoundingClientRect();
      return { x: h.left + h.width / 2, y: h.bottom - 60 };
    }
    var s = seatEl(p);
    if (!s) return deckPoint();
    var r = s.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height * 0.75 };
  }

  function flyBack(from, p, w) {
    var to = seatPoint(p), h = w * 512 / 344;
    var f = el('div', 'card back');
    f.style.cssText = 'left:' + (from.x - w / 2) + 'px;top:' + (from.y - h / 2) + 'px;' +
      'width:' + w + 'px;height:' + h + 'px;transform:none';
    $('#fly').appendChild(f);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        f.style.transform = 'translate(' + (to.x - from.x) + 'px,' + (to.y - from.y) + 'px)' +
          ' rotate(' + (Math.random() * 24 - 12) + 'deg)';
      });
    });
    wait(360, function () { f.remove(); });
  }

  // сдаём как за столом: по две карты по кругу, начиная слева от сдающего
  function dealAnim(per, done) {
    var from = deckPoint(), w = Math.round(cardW() * 0.5);
    var step = 46, k = 0, i, r;
    for (r = 0; r < per; r++)
      for (i = 0; i < g.N; i++) {
        var p = (g.dealer + 1 + i) % g.N;
        (function (pp, d) { wait(d, function () { flyBack(from, pp, w); }); })(p, (k++) * step);
      }
    wait(k * step + 380, done);
  }

  /* ---------- полёт карты ---------- */
  function rectOf(e) { var r = e.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; }

  function flyCard(card, from, p, done) {
    var t = $('#trick').getBoundingClientRect();
    var pos = slotPos(p), cw = cardW();
    var to = { x: t.left + pos[0], y: t.top + pos[1], w: cw, h: cw * 512 / 344 };
    var f = el('div', 'card');
    f.innerHTML = ART.faceHTML(card);
    f.style.cssText = 'left:' + from.x + 'px;top:' + from.y + 'px;width:' + from.w + 'px;height:' + from.h + 'px;transform:none';
    $('#fly').appendChild(f);
    var dx = to.x - from.x, dy = to.y - from.y, sc = to.w / from.w;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        f.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + sc + ') rotate(' + (Math.random() * 6 - 3) + 'deg)';
      });
    });
    wait(360, function () { f.remove(); drawTrick(); if (done) done(); });
  }

  /* Взятку не стирают — её УНОСЯТ. Карты собираются в стопку и летят к
     тому, кто взял, слегка веером и с небольшим поворотом: так видно, кто
     забрал, даже если отвернулся на секунду. Раньше они просто гасли до
     прозрачности на месте, и это читалось как «исчезли», а не «ушли к
     нему». Ник: «сделай анимацию, как они уходят к игроку как взятка —
     как летят к нему». */
  function collectTrick(w, done) {
    var t = $('#trick'), cards = $$('#trick .card');
    var s = (w === ME) ? ($('#seatMe') || $('#hand')) : seatEl(w);
    var tr = s ? s.getBoundingClientRect()
      : { left: innerWidth / 2, top: innerHeight - 40, width: 40, height: 20 };
    var tx = tr.left + tr.width / 2, ty = tr.top + tr.height / 2;
    cards.forEach(function (c, i) {
      var r = c.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      /* Карты трогаются не разом: разница в полсотни миллисекунд
         превращает три одновременных полёта в одну собранную стопку. */
      c.style.zIndex = String(20 + i);
      c.style.transitionDelay = (i * 55) + 'ms';
      c.style.transition = 'transform ' + TRICK_FLY + 'ms cubic-bezier(.38,.02,.62,1),' +
        'opacity ' + TRICK_FLY + 'ms ease-in ' + (i * 55 + Math.round(TRICK_FLY * 0.55)) + 'ms';
      c.style.transform = 'translate(' + (tx - cx) + 'px,' + (ty - cy) + 'px)' +
        ' rotate(' + ((i - 1) * 7) + 'deg) scale(.28)';
      c.style.opacity = '.2';
    });
    wait(TRICK_FLY + cards.length * 55 + 40, function () {
      shown = null;                       // дальше стол снова рисует `cur`
      t.innerHTML = ''; if (done) done();
    });
  }

  /* ---------- события движка ---------- */
  function handleEvent(e, next) {
    brains.forEach(function (b) {
      if (!b) return;                       // за это место играет человек — мозгов нет
      if (e.e === 'trick') b.observeTrick(e.plays, e.plays[0].c.s);
      else if (e.e !== 'card') b.note(e);   // 'card' боту не нужен: текущую взятку он видит в g.cur
    });
    try { chat(e); } catch (err) { }
    switch (e.e) {
      case 'log':
        var p = el('p', e.c, e.t); $('#logpane').appendChild(p);
        $('#logpane').scrollTop = 1e6; return next();
      case 'deal':
        $('#logpane').appendChild(el('hr'));
        selected = null; comboReset();
        dealing = true; drawAll();
        return wait(120, function () {
          dealAnim(g.N === 4 ? 6 : 6, function () {
            dealing = false; drawAll(); wait(160, next);
          });
        });
      case 'bid':
        bubble(e.p, 'Пас', '', MARK); return wait(700, next);
      case 'trump':
        /* В первом круге берут открытую карту — «беру». Во втором называют
           масть — «играю черви». Это разные слова за столом, и путать их
           нельзя: во втором круге брать уже нечего. */
        bubble(e.p, e.round === 2
          ? (e.forced ? 'Обяз. Играю ' : 'Играю ') + K.SUIT_NAME[e.suit] + ' ' + K.SUIT_CH[e.suit]
          : 'Беру ' + K.SUIT_CH[e.suit], '', MARK);
        drawAll(); return wait(700, next);
      case 'prikup':
        return dealAnim(g.N === 4 ? 2 : 3, function () { drawAll(); wait(140, next); });
      case 'swap7': drawAll(); toast(g.W(e.p, 'меняет', 'меняете') + ' козырную семёрку'); return wait(600, next);
      case 'combo':
        /* Говорят не «есть», а что именно: «терц», «полтина», «два терца».
           И в классическом порядке за столом звучит весь обмен: «рост?» —
           «не идёт» — «твой». Раньше это было только в журнале. */
        var mark = 'Пас';
        if (e.tie) mark = 'Ровно!';
        else if (e.beat) mark = 'Не идёт';
        else if (e.yield) mark = 'Твой';
        else if (e.declare) mark = e.word
          ? e.word.charAt(0).toUpperCase() + e.word.slice(1) : 'Есть!';
        // разбор записываем весь, даже если пометку перекрыла реплика бота
        /* Запись хода торга — не трёп: она ведётся и при «Тишине».
           Ник: «реплики выключены не должно влиять на команды, оно влияет
           лишь на трёп». Поэтому comboNote и comboTalk живут здесь, в
           разборе события, а не в chat(), который умолкает вместе с ботами. */
        comboNote(e);
        if (e.live || e.declare || e.yield || e.beat || e.tie) comboTalk.push({ p: e.p, t: mark });
        // промолчал с ЖИВОЙ комбинацией — ход, который бот не делает никогда;
        // это тоже игра, а не трёп, и при «Тишине» должно засчитываться
        if (e.p === ME && !e.declare && !e.dead && g.combos && g.combos[ME] && g.combos[ME].length)
          gSpyHand = true;
        if (!bubbles[e.p]) bubble(e.p, mark, '', MARK);
        // спор кончился ровным — взятку со стола можно забирать
        if (e.tie && e.live) return wait(1100, function () { flushTrick(next); });
        return wait(e.live ? 900 : 560, next);
      case 'comboAsk2':
        // вопрос звучит над лежащей взяткой — её ещё не забрали;
        // спрашивает тот, кто заявил позже
        var q = e.what === 'trump' ? 'Козырный?' : 'Рост?';
        comboTalk.push({ p: e.p, t: q });
        talk(e.p, 'comboAsk', null, true);
        if (!bubbles[e.p]) bubble(e.p, q, '', MARK);
        return wait(1200, next);
      case 'comboSay2':
        // вынужденный ответ: «до дамы», «козырной», «простой»
        var ans = e.what === 'trump'
          ? (e.trump ? 'Козырной' : 'Простой')
          : 'До ' + K.RANK_FROM[K.RANKS[e.top]];
        comboTalk.push({ p: e.p, t: ans });
        bubble(e.p, ans, '', MARK);
        return wait(1200, next);
      case 'comboLive':
        // спор решён — старший подводит черту, и вот теперь взятку забирают
        comboTalk.push({ p: e.win, t: 'Пишется' });
        talk(e.win, 'comboBeat', null, true);
        if (!bubbles[e.win]) bubble(e.win, 'Пишется', '', MARK);
        return wait(1400, function () { flushTrick(next); });
      case 'combo-ask':
        if (!bubbles[e.p]) bubble(e.p, 'Рост?');
        return wait(520, next);
      case 'comboWin':
        showCombo(e);
        if (e.live) return dlgComboShow(e, next);
        return wait(1700, next);
      case 'bella': toast('Белла!'); return wait(650, next);
      case 'play-start': drawAll(); return next();
      case 'card':
        if (holdTrick) return flushTrick(function () { step(e, next); });   // страховка
        var from;
        if (e.p === ME) {
          var hc = $('#hand .card[data-id="' + K.id(e.c) + '"]');
          from = hc ? rectOf(hc) : { x: innerWidth / 2, y: innerHeight - 100, w: cardW(), h: cardW() * 1.49 };
          if (hc) hc.style.visibility = 'hidden';
        } else {
          var s = seatEl(e.p), r = s.getBoundingClientRect();
          from = { x: r.left + r.width / 2 - 18, y: r.top + 22, w: 36, h: 54 };
        }
        drawHandLater();
        return flyCard(e.c, from, e.p, function () { wait(120, next); });
      case 'trick':
        /* Закрытую взятку показываем целиком — со всеми картами. */
        shown = e.plays ? e.plays.slice() : null;
        drawTrick();
        drawSeats(); drawInfo();
        /* Первая взятка при одесском порядке со стола не убирается, пока не
           выяснили, чьё слово старше: «карты сыграли, но их ещё никто не
           забирает — все замерли». Разбор идёт над лежащими картами, и только
           после «пишется» взявший сгребает их к себе. */
        if (g.cLive && !g.cShown && g.tricks.length === 1 && g.cDecl && g.cDecl.length) {
          holdTrick = e;
          return wait(600, next);
        }
        return takeTrick(e, next);      // пауза внутри: TRICK_HOLD
      case 'hand-end':
        try {
          var side = g.sideOf ? g.sideOf(ME) : ME;
          var pat = { hands: 1, tricks: g.taken[ME] || 0 };
          if (g.declarer === ME) {
            pat.declared = 1;
            if (!e.res.beit) pat.declWon = 1;
          }
          if (g.comboWinner >= 0 && (g.sideOf ? g.sideOf(g.comboWinner) : g.comboWinner) === side &&
            e.res.det[ME] && (e.res.det[ME].combo || (g.o.pairs && e.res.det[g.comboWinner].combo))) {
            pat.combos = 1; pat.comboPts = g.comboPts || 0;
          }
          if (g.bella && g.bella.announced && g.bella.holder === ME) pat.bella = 1;
          // бейт «получен», если играли мы; «поставлен» — если очки с бейта достались нам
          if (e.res.beit) {
            var mine = (g.declarer === ME) || (g.o.pairs && g.declarer === (ME + 2) % 4);
            if (mine) pat.beitsGot = 1;
            else if (e.res.final[side] > e.res.sraw[side]) pat.beitsGave = 1;
          }
          if (e.res.det[ME] && e.res.det[ME].lyzhi) pat.lyzhi = 1;
          if (netLive()) {
            pat.nHands = 1;                       // раздачи с живыми людьми считаем отдельно
            goldHand(e.res, pat, side);
          }
          Boot.bumpStats(pat);
          Boot.setBest(e.res.final[side] || 0);
          achHand(e.res);
        } catch (err) { }
        showResult(e); return;      // дальше — по кнопке
      case 'klabor': toast('КЛАБОР!'); return wait(900, next);
      case 'redeal': toast('Пересдача'); return wait(700, next);
      default: return next();
    }
  }

  var handTimer = null;
  function drawHandLater() { clearTimeout(handTimer); handTimer = setTimeout(drawHand, 40); }

  var pumping = false, paused = false, needReady = false, overDone = false;
  var pausedUI = false, netHold = false;
  // достижения считаются за партию: на новом столе счётчики чистые
  function pump() {
    if (pumping) return;
    pumping = true; busy = true;
    step();
    function step() {
      if (evIdx >= g.ev.length) { pumping = false; busy = false; return ready(); }
      var e = g.ev[evIdx++];
      // итог раздачи — не событие, а остановка: дальше ход за кнопкой в окне,
      // поэтому очередь отпускаем здесь, иначе следующая раздача не проиграется
      if (e.e === 'hand-end') { pumping = false; busy = false; }
      handleEvent(e, step);
    }
  }

  /* ---------- кто ходит ----------

     Пауз теперь две, и они независимы: своя — когда поверх стола
     открыто окно, и сетевая — когда стол ждёт вылетевшего игрока.
     Раньше флаг был один, и закрытие любого окошка снимало ожидание
     игрока вместе с собой. */
  function repause() {
    var was = paused;
    paused = pausedUI || netHold;
    if (was && !paused && needReady) { needReady = false; ready(); }
  }
  function setPaused(v) { pausedUI = !!v; repause(); }
  function netHoldOn(v) { netHold = !!v; repause(); }
  function me() { return ME; }

  /* Отложенная первая взятка: пока идёт разбор старшинства, карты лежат
     на столе. holdTrick помнит, какую взятку мы ещё не собрали. */
  var holdTrick = null;
  /* Взятка не исчезает сразу: секунда на то, чтобы увидеть, чем её
     взяли. Без этой паузы карты просто мигают, и за столом непонятно,
     что произошло — особенно когда подрезали козырем. */
  var TRICK_HOLD = 1500;      // Ник просил полторы секунды — и тут, и в преферансе
  var TRICK_FLY = 460;        // сколько карты летят к тому, кто взял
  function takeTrick(e, done) {
    wait(TRICK_HOLD, function () {
    collectTrick(e.w, function () {
      var v = e.v + (g.hands[ME].length === 0 ? K.POSLED : 0);
      if (v) toast(g.W(e.w, 'берёт', 'берёте') + (e.v ? ' +' + e.v : ''));
      drawAll(); wait(180, done);
    });
    });
  }
  function flushTrick(done) {
    var e = holdTrick; holdTrick = null;
    if (!e) return done();
    /* Пока шёл разбор, стол могли перерисовать — вернём карты взятки. */
    shown = e.plays ? e.plays.slice() : shown;
    drawTrick();
    takeTrick(e, done);
  }

  function ready() {
    if (paused) { needReady = true; return; }
    if (g.isNet && g.pendHold !== undefined) { g.pending = g.pendHold; g.pendHold = undefined; }
    drawSeats(); drawScore();
    if (window.Boot && !g.isNet) Boot.saveSolo();
    if (g.over) { if (overDone) return; overDone = true; return showOver(); }
    var p = g.pending;
    if (!p) return;
    if (p.type === 'next') return;                 // ждём кнопку в итогах
    if (p.p === ME) return askHuman(p);
    hint('Ход: ' + g.names[p.p]);
    drawHand();
    if (!brains[p.p]) return;                      // за это место играет живой человек — ждём его
    wait(p.type === 'play' ? 520 : 400, function () {
      if (paused) { needReady = true; return; }
      if (!g.pending || g.pending !== p) return;      // партию перезапустили — старый ход не применяем
      /* Пока бот «думал» эти полсекунды, человек мог вернуться за стол.
         Тогда ход за него делать уже нельзя — место снова живое. */
      if (!brains[p.p]) return;
      var b = brains[p.p], a;
      if (p.type === 'bid') a = b.bid(p);
      else if (p.type === 'combo') a = b.combo(p);
      else if (p.type === 'swap7') a = b.swap7(p);
      else a = b.play(p);
      g.apply(a); if (typeof Net !== 'undefined' && Net.S.host) Net.broadcast(g); pump();
    });
  }

  function act(a) {
    /* Стол на паузе ждёт вылетевшего. Принять ход сейчас — значит
       отыграть раздачу без него, ровно то, от чего пауза и заведена.
       Это единственная дверь для всех ходов: и для своих щелчков, и для
       присланных гостями, — потому стоит здесь. */
    if (netHold) { toast('Партия на паузе — ждём игрока'); return; }
    stopIdle();
    g.apply(a);
    if (typeof Net !== 'undefined' && Net.S.host && !g.isNet) Net.broadcast(g);
    pump();
  }
  function actIf(type, a) { if (g.pending && g.pending.type === type) act(a); }

  /* ---------- ввод человека ---------- */
  var idleT = null;
  function stopIdle() { clearTimeout(idleT); idleT = null; }
  function startIdle() {
    stopIdle();
    var my = gen;
    idleT = setTimeout(function () {
      if (my !== gen || !g.pending || g.pending.p !== ME) return;
      talk(anyBot(), 'slow', null, true);
      startIdle();
    }, 15000);
  }

  function askHuman(p) {
    if (p.type === 'play') { drawHand(); hint('Ваш ход'); startIdle(); return; }
    if (p.type === 'bid') return dlgBid(p);
    if (p.type === 'combo') return dlgCombo(p);
    if (p.type === 'swap7') return dlgSwap(p);
  }

  /* --- клик и перетаскивание --- */
  var drag = null;
  function onDown(ev) {
    var c = ev.target.closest('#hand .card');
    if (!c || !g.pending || g.pending.type !== 'play' || g.pending.p !== ME) return;
    if (!c.classList.contains('playable')) { toast('Так ходить нельзя'); return; }
    var r = c.getBoundingClientRect();
    drag = {
      el: c, id: c.dataset.id, x0: ev.clientX, y0: ev.clientY,
      ox: ev.clientX - r.left, oy: ev.clientY - r.top, w: r.width, h: r.height, moved: false
    };
    c.setPointerCapture && c.setPointerCapture(ev.pointerId);
    ev.preventDefault();
  }
  function onMove(ev) {
    if (!drag) return;
    var dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 8) return;
    if (!drag.moved) {
      drag.moved = true;
      drag.el.classList.add('drag');
      drag.el.style.width = drag.w + 'px'; drag.el.style.height = drag.h + 'px';
    }
    drag.el.style.left = (ev.clientX - drag.ox) + 'px';
    drag.el.style.top = (ev.clientY - drag.oy) + 'px';
    drag.el.style.transform = 'scale(1.25)';
    var d = $('#drop'), dr = d.getBoundingClientRect();
    var hot = ev.clientY < dr.bottom && ev.clientY > dr.top - 60;
    d.classList.toggle('hot', hot); drag.hot = hot;
    ev.preventDefault();
  }
  function onUp(ev) {
    if (!drag) return;
    var d = drag; drag = null;
    $('#drop').classList.remove('hot');
    if (!d.moved) {                                   // тап/клик
      if (isTouch() && selected !== d.id) { selected = d.id; drawHand(); hint('Ещё раз — ходить'); return; }
      selected = null; return playCard(d.id);
    }
    d.el.classList.remove('drag');
    d.el.style.cssText = '';
    if (d.hot) { selected = null; return playCard(d.id); }
    drawHand();
  }
  function isTouch() { return matchMedia('(hover:none)').matches; }

  function playCard(id) {
    if (!g.pending || g.pending.type !== 'play' || g.pending.p !== ME) return;
    var c = K.parse(id);
    var ok = g.pending.legal.some(function (x) { return K.id(x) === id; });
    if (!ok) return toast('Так ходить нельзя');
    if (g.bellaOffer(ME, c) && !g.o.autoBella) return dlgBella(c);
    hint(''); act({ card: c, bella: g.bellaOffer(ME, c) });
  }

  /* ---------- диалоги ---------- */
  function modal(html, wire, o) {
    o = o || {};
    var m = $('#modal');
    m.innerHTML = '<div class="dlg' + (o.wide ? ' wide' : '') + '">' + html + '</div>';
    m.classList.add('on');
    // решения по ходу партии стол не гасят — иначе не видно ни козыря, ни кто сдаёт
    m.classList.toggle('light', !!o.light);
    // окно, открытое из стартового экрана, должно лечь поверх него
    m.classList.toggle('over', $('#splash').classList.contains('on'));
    if (wire) wire(m);
  }
  function closeModal() {
    var m = $('#modal');
    m.classList.remove('on'); m.classList.remove('light'); m.innerHTML = '';
  }

  // стартовый экран живёт отдельно от игровых окон, чтобы они не наезжали друг на друга
  // key — какой это экран. Перерисовка того же экрана (выбрали портрет, щёлкнули
  // характер) не должна швырять к началу: место прокрутки сохраняем.
  function splash(html, wire, key) {
    var m = $('#splash');
    var wide = html.indexOf('<!--WIDE-->') === 0;
    if (wide) html = html.slice(11);
    var same = key && m.dataset.k === key && m.classList.contains('on');
    var top = same ? m.scrollTop : 0;
    var dlg = m.querySelector('.dlg');
    var dtop = (same && dlg) ? dlg.scrollTop : 0;
    // внутри экрана есть свои прокрутки — сетка портретов, лента комнаты.
    // Клик по портрету перерисовывает экран, и без этого список прыгал наверх.
    var inner = ['.facerow', '.hlog', '.hpeople'], keep = {};
    if (same) inner.forEach(function (sel) {
      var el = m.querySelector(sel);
      if (el) keep[sel] = el.scrollTop;
    });
    m.innerHTML = '<div class="dlg' + (wide ? ' hallwide' : '') + '">' + html + '</div>';
    m.dataset.k = key || '';
    m.classList.add('on');
    m.scrollTop = top;
    var nd = m.querySelector('.dlg');
    if (nd) nd.scrollTop = dtop;
    inner.forEach(function (sel) {
      if (keep[sel] == null) return;
      var el = m.querySelector(sel);
      if (el) el.scrollTop = keep[sel];
    });
    setPaused(true);
    if (wire) wire(m);
  }
  function closeSplash() {
    $('#splash').classList.remove('on'); $('#splash').innerHTML = '';
    if (!$('#modal').classList.contains('on')) setPaused(false);
  }


  // кто уже что сказал на торгах — словами, чтобы не лезть в журнал
  function bidLogHTML() {
    // очередь считаем по bidSeat, а не по длине журнала: у партии, поднятой из
    // старого сейва, журнала торга ещё нет, и «вы говорите первым» врало сдающему
    var i = g.bidSeat || 0, when;
    if (i === 0) when = 'Вы говорите первым.';
    else if (i === g.N - 1) when = 'Вы говорите последним: после вас круг закрывается.';
    else when = 'Вы ' + (i + 1) + '-й по счёту в этом круге.';
    var l = g.bidLog || [];
    if (!l.length) return '<div class="bidlog">' + when + '</div>';
    var t = l.map(function (x) {
      return '<i>' + (x.p === ME ? 'вы' : g.names[x.p]) + '</i> — ' +
        (x.pass ? 'пас' : 'берёт ' + K.SUIT_NAME[x.suit]);
    }).join(', ');
    return '<div class="bidlog">' + when + ' Уже сказали: ' + t + '.</div>';
  }

  // обяз всегда ложится на сдающего: торг идёт слева от него, значит он говорит
  // последним, и передавать слово ему уже некому
  function dealerForced() {
    if (g.o.obyaz) return true;
    return g.obyazSide >= 0 && g.o.pairs && g.sideOf(g.dealer) === g.obyazSide;
  }

  // куда денется открытая карта — вопрос, который всё время путает
  function upFate() {
    if (g.N === 4) return 'Открытая карта уйдёт <b>' + (g.dealer === ME ? 'вам' : g.names[g.dealer]) +
      '</b>: вчетвером она достаётся сдающему последней прикупной картой.';
    return 'Открытая карта <b>никому не идёт</b> — она просто лежит на колоде и показывает масть' +
      (g.o.swap7 ? '. Забрать её можно только козырной семёркой, когда торг кончится.' : '.');
  }

  function obyazHTML() {
    var out = '';
    if (g.obyazSide >= 0 && g.o.pairs) {
      var mine = g.sideOf(ME) === g.obyazSide;
      out += '<div class="bidlog">Обяз раунда у ' +
        (mine ? '<i>вашей команды</i>' : '<i>' + g.sideName(g.obyazSide) + '</i>') +
        ': на своих раздачах пасовать нельзя.</div>';
    }
    if (dealerForced())
      out += '<div class="bidlog">Обяз в этой раздаче на <i>' +
        (g.dealer === ME ? 'вас' : g.names[g.dealer]) + '</i> — на сдающем: он говорит последним, ' +
        'и передать слово ему уже некому.</div>';
    return out;
  }

  // шапка окна торга: открытая карта слева, а справа — кто сдаёт, кому она уйдёт,
  // что уже сказали и чем оборачивается «беру». Раньше тут было глухое «вы играющий»,
  // и Ник справедливо не понимал, идёт речь о нём сейчас или о том, что будет.
  function bidHead(lead, noPass) {
    var d = '<div class="who">' + lead +
      '<div class="bidlog">' + (g.dealer === ME ? '<i>Сдаёте вы.</i>'
        : '<i>Сдаёт:</i> ' + g.names[g.dealer] + '.') + ' Слово сейчас за вами.</div>' +
      '<div class="bidlog">' + upFate() + '</div>' +
      obyazHTML() +
      (noPass ? '<div class="bidlog">Вы последний в круге и пасовать не можете — обяз.</div>' : '') +
      bidLogHTML() + '</div>';
    return '<div class="bidhead">' +
      '<div class="up"><div class="card">' + ART.faceHTML(g.upCard) + '</div>' +
      '<div class="uplbl">открыта</div></div>' + d + '</div>';
  }

  function dlgBid(p) {
    var h;
    if (p.round === 1) {
      h = '<h3>Торг за козырь</h3>' +
        bidHead('Возьмёте — <b>станете играющим</b>: козырь будет ' + K.SUIT_NAME[p.opts.take] + ' ' +
          K.SUIT_CH[p.opts.take] + ', вы ходите первым, и вам надо набрать больше очков, чем каждый из соперников. ' +
          'Не наберёте — бейт, ваши очки уйдут вистующим. Пас — слово идёт дальше по кругу.',
          !p.opts.pass) +
        '<div class="combolist big" id="bidHand"></div>' +
        '<div class="row"><button class="btn pri wide" data-a="take">Беру ' + K.SUIT_NAME[p.opts.take] + ' ' +
        K.SUIT_CH[p.opts.take] + '</button>' +
        (p.opts.pass ? '<button class="btn wide" data-a="pass">Пас</button>' : '') + '</div>';
    } else {
      h = '<h3>Второй круг</h3>' +
        bidHead('Открытую масть не взял никто. Назовёте другую — <b>станете играющим</b> ' +
          'со всеми последствиями: ходите первым и обязаны набрать больше соперника. ' +
          'Пас у всех — пересдача.', !p.opts.pass) +
        '<div class="combolist big" id="bidHand"></div><div class="row">' +
        p.opts.name.map(function (s) {
          return '<button class="btn suitbtn' + (K.isRed({ s: s }) ? ' r' : '') + '" data-s="' + s + '">' + K.SUIT_CH[s] + '</button>';
        }).join('') + '</div>' +
        (p.opts.pass ? '<div class="row"><button class="btn wide" data-a="pass">Пас</button></div>' : '');
    }
    modal(h, function (m) {
      var box = m.querySelector('#bidHand');
      g.hands[ME].forEach(function (c) {
        var d = el('div', 'card'); d.innerHTML = ART.faceHTML(c); box.appendChild(d);
      });
      m.onclick = function (ev) {
        var b = ev.target.closest('[data-a],[data-s]'); if (!b) return;
        closeModal();
        if (b.dataset.a === 'take') return actIf('bid', { suit: p.opts.take });
        if (b.dataset.a === 'pass') return actIf('bid', { pass: true });
        actIf('bid', { suit: b.dataset.s });
      };
    }, { light: true, wide: true });
  }

  function dlgSwap(p) {
    var gain = K.val(g.upCard, g.trump);
    modal('<h3>У вас козырная семёрка</h3>' +
      '<div class="sub">Торг закончен, козырь — ' + K.SUIT_NAME[g.trump] + ' ' + K.SUIT_CH[g.trump] +
      '. Право обмена есть у любого, у кого семёрка, — играете вы или нет. ' +
      'Меняете свою семёрку на лежащую на столе <b>' + K.name(g.upCard) + '</b>' +
      (gain ? ' (это ' + gain + ' очков)' : '') + '.</div>' +
      '<div class="combolist" style="justify-content:center;align-items:center;gap:14px">' +
      '<div class="card" style="width:78px">' + ART.faceHTML({ r: '7', s: g.trump }) + '</div>' +
      '<span style="font-size:24px;color:var(--gold)">→</span>' +
      '<div class="card" style="width:78px">' + ART.faceHTML(g.upCard) + '</div></div>' +
      '<div class="row"><button class="btn pri wide" data-y="1">Забрать ' + K.name(g.upCard) + '</button>' +
      '<button class="btn wide" data-y="0">Оставить как есть</button></div>', function (m) {
        m.onclick = function (ev) {
          var b = ev.target.closest('[data-y]'); if (!b) return;
          closeModal(); actIf('swap7', { yes: b.dataset.y === '1' });
        };
      }, { light: true });
  }

  /* Что уже сказано — половина решения. Полтина бьёт терц, поэтому после
     ЧУЖОЙ полтины ваш терц не запишется никогда; после полтины НАПАРНИКА,
     наоборот, говорить надо: очки у стороны общие. */
  function comboTip(p) {
    var rk = function (x) { return x === 'P' ? 2 : x === 'T' ? 1 : 0; };
    var my = rk(p.mine.kind), foe = rk(p.foe), mate = rk(p.mate);
    if (foe > Math.max(my, mate))
      return '<br><b>Соперник уже сказал полтину.</b> Ваш ' + g.kindWord(p.mine) +
        ' эту раздачу не запишет при любом раскладе — молчание не стоит ничего, ' +
        'а заявка дарит сопернику кусок расклада.';
    if (mate >= my && mate > 0)
      return '<br><b>Напарник уже сказал ' + (p.mate === 'P' ? 'полтину' : 'терц') + '.</b> ' +
        'Очки у стороны общие: если их сторона старше, в зачёт пойдёт и ваша комбинация.';
    return '';
  }

  function dlgCombo(p) {
    var mine = p.mine, sum = 0;
    g.combos[p.p].forEach(function (c) { sum += (c.kind === 'P' ? g.o.polt : g.o.terz); });
    var cards = '';
    g.combos[p.p].forEach(function (c) {
      c.cards.forEach(function (cc) { cards += '<div class="card">' + ART.faceHTML(cc) + '</div>'; });
    });
    var h, wire;

    if (p.mode === 'say') {
      h = '<h3>Ваше слово</h3><div class="sub">У вас ' + g.combos[p.p].map(K.comboLabel).join(', ') +
        ' — <b>' + sum + '</b> очков. По одесскому клабору сказать надо <b>сейчас</b>, ' +
        'вместе с первой картой: потом слова уже не будет. Называют только вид — ' +
        'ни рост, ни масть. Чьё старше, разберут, когда взятка соберётся; ' +
        'карты старший откроет после второй.<br>Заявка выдаёт соперникам кусок вашей руки — ' +
        'иногда дешевле промолчать.' + comboTip(p) + '</div>' +
        '<div class="combolist big">' + cards + '</div>' +
        '<div class="row"><button class="btn pri wide" data-c="1">Говорю: ' + g.comboWords(p.p) + '</button>' +
        '<button class="btn wide" data-c="0">Молчу</button></div>';
      wire = function (a) { actIf('combo', { declare: a === '1' }); };

    } else if (p.mode === 'grow' || p.mode === 'trumpq') {
      /* Вас спросили — стол стоит и ждёт. Выбора тут нет и быть не может:
         ответ один и правдивый, соврать про рост в клаборе нельзя. Кнопка
         нужна не для решения, а чтобы слово сказали вы, а не движок за вас. */
      var ask = g.names[p.ask] || 'Соперник';
      var say = p.mode === 'trumpq'
        ? (mine.trump ? 'Козырной' : 'Простой')
        : 'До ' + K.RANK_FROM[K.RANKS[mine.top]];
      h = '<h3>' + esc(ask) + ' спрашивает: ' +
        (p.mode === 'trumpq' ? 'козырный?' : 'рост?') + '</h3>' +
        '<div class="sub">У вас ' + g.combos[p.p].map(K.comboLabel).join(', ') +
        '. Ответить надо честно — рост и масть у вас всё равно на руках, ' +
        'и после второй взятки старший показывает карты.</div>' +
        '<div class="combolist big">' + cards + '</div>' +
        '<div class="row"><button class="btn pri wide" data-c="1">Сказать: ' + say + '</button></div>';
      wire = function () { actIf('combo', { ok: true }); };

    } else if (p.mode === 'declare') {
      h = '<h3>Заявка комбинаций</h3><div class="sub">У вас ' + g.combos[p.p].map(K.comboLabel).join(', ') +
        ' — <b>' + sum + '</b> очков. Запишет их только один игрок за раздачу. ' +
        'Заявка показывает соперникам, что у вас на руках, — иногда выгоднее промолчать.</div>' +
        '<div class="combolist big">' + cards + '</div>' +
        '<div class="row"><button class="btn pri wide" data-c="1">Заявить: ' + g.kindWord(mine) + '</button>' +
        '<button class="btn wide" data-c="0">Пас</button></div>';
      wire = function (a) { actIf('combo', { declare: a === '1' }); };

    } else if (p.mode === 'ask') {
      h = '<h3>' + g.names[p.from] + ' заявил: ' + g.kindWord(p.lead) + '</h3>' +
        '<div class="sub">У вас ' + K.comboLabel(mine) + '. Вид совпал — можно спросить рост (старшую карту) ' +
        'или сдать торг сразу.</div><div class="combolist big">' + cards + '</div>' +
        '<div class="row"><button class="btn pri wide" data-c="1">Рост?</button>' +
        '<button class="btn wide" data-c="0">Твой</button></div>';
      wire = function (a) { actIf('combo', { ask: a === '1' }); };

    } else {
      var cmp = K.cmpCombo(mine, p.lead);
      h = '<h3>' + g.names[p.from] + ': от ' + K.RANK_FROM[K.RANKS[p.lead.top]] + '</h3>' +
        '<div class="sub">У вас ' + K.comboLabel(mine) + '. ' +
        (cmp > 0 ? 'Ваша старше. Спросив рост, сдавать торг уже нельзя — это нарушение.' :
          cmp === 0 ? 'Ровно та же карта и обе некозырные — спор решит последняя взятка.' :
            'Ваша младше — тут только сдать торг.') + '</div>' +
        '<div class="combolist big">' + cards + '</div><div class="row">' +
        (cmp >= 0 ? '<button class="btn pri wide" data-c="1">Не идёт</button>' : '') +
        (cmp <= 0 ? '<button class="btn wide" data-c="0">Твой</button>' : '') + '</div>';
      wire = function (a) { actIf('combo', { beat: a === '1' }); };
    }

    modal(h, function (m) {
      m.onclick = function (ev) {
        var b = ev.target.closest('[data-c]'); if (!b) return;
        closeModal(); wire(b.dataset.c);
      };
    }, { light: true, wide: true });
  }

  function dlgBella(c) {
    /* В одесской росписи это ЕДИНСТВЕННЫЙ шанс: промолчал первой картой
       — очки сгорели. В турнирной шанс остаётся на второй. Разница
       решает, молчать или нет, поэтому она стоит прямо в окне. */
    var last = !(g.o && g.o.bellaAny) || (g.bella && g.bella.played === 1);
    modal('<h3>Белла</h3><div class="sub">Объявить беллу? 20 очков достанутся тому, кто заберёт эту взятку.' +
      (last ? ' <b>Другого случая не будет</b> — промолчите, и очки сгорят.'
        : ' Промолчите — останется вторая карта.') + '</div>' +
      '<div class="row"><button class="btn pri wide" data-b="1">Белла!</button>' +
      '<button class="btn wide" data-b="0">Молчу</button></div>', function (m) {
        m.onclick = function (ev) {
          var b = ev.target.closest('[data-b]'); if (!b) return;
          closeModal(); actIf('play', { card: c, bella: b.dataset.b === '1' });
        };
      }, { light: true });
  }

  /* Комбинации на виду: что заявили и что показали.
     По правилам карты открывает только записавший, но заявку слышат все —
     значит, и в панели должно быть видно, кто что называл. */
  var comboSaid = [], comboShown = [], comboTalk = [];
  // сколько висит служебная пометка за столом: раньше мелькала и не читалась
  var MARK = 2400;

  function comboReset() { comboSaid = []; comboShown = []; comboTalk = []; }
  function comboNote(e) {
    if (!e.declare || !e.kind) return;
    for (var i = 0; i < comboSaid.length; i++)
      if (comboSaid[i].p === e.p) { comboSaid[i].kind = e.kind; comboSaid[i].word = e.word; return; }
    /* Слово запоминаем целиком: Ник заявил два терца, а в панели стояло
       «терц» — вид комбинации без счёта. За столом называют именно то,
       что сказали вслух: «2 терца», «полтина и терц». */
    comboSaid.push({ p: e.p, kind: e.kind, word: e.word });
  }

  function showCombo(e) {
    comboShown = e.list || [];
    toast(g.W(e.p, 'записывает', 'записываете') + ' ' + e.pts + ' за комбинации');
    drawScore();
  }

  // одесский клабор: вторая взятка сыграна — старший открывает карты всем
  function dlgComboShow(e, next) {
    var list = e.list || [];
    if (!list.length) return wait(300, next);
    var byOwner = {}, order = [];
    list.forEach(function (co) {
      if (!byOwner[co.owner]) { byOwner[co.owner] = []; order.push(co.owner); }
      byOwner[co.owner].push(co);
    });
    var body = order.map(function (q) {
      var cards = '';
      byOwner[q].forEach(function (co) {
        co.cards.forEach(function (cc) { cards += '<div class="card">' + ART.faceHTML(cc) + '</div>'; });
      });
      return '<div class="sub" style="margin:10px 0 4px"><b>' + g.names[q] + '</b> — ' +
        byOwner[q].map(K.comboLabel).join(', ') + '</div>' +
        '<div class="combolist big">' + cards + '</div>';
    }).join('');
    var mine = (g.sideOf ? g.sideOf(e.p) === g.sideOf(ME) : e.p === ME);
    modal('<h3>Показ комбинаций</h3>' +
      '<div class="sub">' + (mine ? 'Ваша сторона' : g.names[e.p] + '') + ' записывает <b>' + e.pts +
      '</b> — карты на стол, чтобы все убедились. Младшие комбинации не показывают: ' +
      'это подсказка напарнику.</div>' + body +
      '<div class="row"><button class="btn pri wide" data-x="1">Понятно</button></div>',
      function (m) {
        m.onclick = function (ev) {
          if (!ev.target.closest('[data-x]')) return;
          closeModal(); next();
        };
      }, { light: true, wide: true });
  }

  function kindWord(k) { return k === 'P' ? 'полтина' : 'терц'; }
  // «заявлял полтина» — не по-русски; в этой строке нужен винительный
  function saidWord(x) {
    var w = x.word || kindWord(x.kind);
    return w.replace(/(^|\s)полтина(?=$|\s)/g, '$1полтину');
  }

  function combosHTML() {
    if (!comboSaid.length && !comboShown.length)
      return '<div class="ltr empty">Комбинаций пока не заявляли.</div>';
    var byOwner = {}, order = [];
    comboShown.forEach(function (co) {
      if (!byOwner[co.owner]) { byOwner[co.owner] = []; order.push(co.owner); }
      byOwner[co.owner].push(co);
    });
    var rows = order.map(function (p) {
      var cards = '', kinds = [], pts = 0;
      byOwner[p].forEach(function (co) {
        kinds.push(kindWord(co.kind) + (co.trump ? ' козырной' : ''));
        pts += (co.pts || 0);
        co.cards.forEach(function (cc) {
          cards += '<div class="card">' + ART.faceHTML(cc) + '</div>';
        });
      });
      return '<div class="cmb"><div class="cmbhead">' +
        '<span class="who' + (p === ME ? ' you' : '') + '">' + (p === ME ? 'вы' : g.names[p]) + '</span>' +
        '<span class="k">' + kinds.join(', ') + '</span>' +
        (pts ? '<b class="pt">+' + pts + '</b>' : '') + '</div>' +
        '<div class="cmbcards">' + cards + '</div></div>';
    });
    /* Весь разбор целиком: кто что заявил, кто спрашивал рост, что ответили
       и чем кончилось. За столом это пролетает за секунды, а тут остаётся
       записью, к которой можно вернуться. */
    if (comboTalk.length) {
      /* Ник: «2 терца — спросили рост — я сказал до короля — он сдался,
         твой; это надо в комбинациях тоже кратко выводить». Поэтому не
         столбик, а одна строка через точки: весь разбор читается разом. */
      rows.push('<div class="cmb talkrec"><div class="cmbhead">' +
        '<span class="k">как разбирали</span></div><div class="tl">' +
        comboTalk.map(function (x) {
          return '<span class="who' + (x.p === ME ? ' you' : '') + '">' +
            (x.p === ME ? 'вы' : esc(g.names[x.p])) + '</span>\u00a0' +
            esc(x.t.charAt(0).toLowerCase() + x.t.slice(1));
        }).join('<i class="sep">·</i>') + '</div></div>');
    }
    // те, кто заявлял, но карты не открывал — по правилам их и не показывают
    var said = comboSaid.filter(function (x) { return !byOwner[x.p]; });
    if (said.length)
      rows.push('<div class="cmb said">' + said.map(function (x) {
        if (x.p === ME) return '<span class="who you">вы</span> заявляли ' + esc(saidWord(x));
        return '<span class="who">' + esc(g.names[x.p]) + '</span> заявлял' +
          (g.sex && g.sex[x.p] === 'f' ? 'а' : '') + ' ' + esc(saidWord(x));
      }).join(', ') + ' — карты не открыты.</div>');
    return '<div class="ltr">' + rows.join('') + '</div>';
  }

  // Откуда взялся итог: набрали в раздаче, добавили висяк, отдали по бейту.
  // Без этой сноски в таблице появлялось число, которого нет ни в одной колонке.
  function calcHTML(r) {
    var sides = g.sideList(), L = [], i;
    function nm(k) { return g.sideName(k); }
    // «зашёл Марик» / «зашли вы» / «зашла Циля» — как в журнале
    function verb(p, m, f, v2) {
      if (p === ME) return v2;
      return ((g.sex && g.sex[p] === 'f') ? f : m) + ' ' + g.names[p];
    }
    function all(v) { return v.map(function (x, k) { return nm(k) + ' ' + x; }).join(', '); }

    // послед — его видно только в журнале, а решает он и десятку, и спор комбинаций
    if (r.last) L.push('<b>Последняя взятка:</b> ' + (r.last.lead === r.last.w
      ? (r.last.lead === ME ? 'вы зашли и забрали сами'
        : g.names[r.last.lead] + ((g.sex && g.sex[r.last.lead] === 'f')
          ? ' зашла и забрала сама' : ' зашёл и забрал сам'))
      : verb(r.last.lead, 'зашёл', 'зашла', 'зашли вы') + ', ' +
        verb(r.last.w, 'забрал', 'забрала', 'забрали вы')) + ' — плюс ' + K.POSLED + '.');

    if (!r.carry && !r.beit && !r.hang) return wrap(L);

    L.push('<b>В раздаче:</b> ' + all(r.base || r.sraw) + '.');
    if (r.carry) {
      var same = r.carry.every(function (x) { return x === r.carry[0]; }), pot = 0;
      r.carry.forEach(function (x) { pot += x || 0; });
      // котёл считается отдельно от раздачи: он разыгран ею, а не сложен с ней
      L.push('<b>На кону висело:</b> ' +
        (same ? 'по ' + r.carry[0] + ' у каждой стороны' :
          r.carry.map(function (x, k) { return nm(k) + ' ' + x; }).join(', ')) +
        ' — всего ' + pot + '. ' +
        (r.hang ? 'Снова поровну — котёл висит дальше.'
          : r.beit ? 'Играющие проиграли раздачу, и их висевшее ушло вистующим вместе с очками раздачи.'
            : 'Играющие отыграли — котёл возвращается поровну, а очки этой раздачи не пишутся.'));
    }
    if (r.hang)
      L.push('<b>Висяк:</b> поровну — эти очки никому не пишутся. Они переносятся ' +
        'на следующую раздачу, и тот же играющий будет защищать их от бейта.');
    else if (r.beit) {
      /* Вистующие делят пробейтившегося поровну — значит и в объяснении
         должно быть видно, кому сколько, а не «ушло туда-то». */
      var to = Array.isArray(r.beitTo) ? r.beitTo : [r.beitTo != null ? r.beitTo : 0];
      var potAll = Math.max(0, r.sraw[r.declSide]) + (r.carry ? (r.carry[r.declSide] || 0) : 0);
      L.push('<b>Бейт:</b> у играющих меньше — их ' + Math.max(0, r.sraw[r.declSide]) +
        (r.carry ? ' и висевшие ' + (r.carry[r.declSide] || 0) : '') +
        (to.length > 1
          ? (r.carry ? ', всего ' + potAll : '') + ' — пополам вистующим: ' +
            to.map(function (k) {
              return nm(k) + ' ' + ((r.beitShare || 0) + (k === r.beitBest ? (r.beitRest || 0) : 0));
            }).join(', ')
          : ' → ' + nm(to[0])) + '.');
      if (r.shtraf || r.final[r.declSide] < 0)
        L.push('<b>Бейт номер ' + (r.beitNo || 3) + '</b>' +
          (g.o.pairs && g.o.match2 ? ' в этом раунде' : ' в партии') + ' — ещё минус 100 играющим.');
    }
    return wrap(L);
  }
  function wrap(L) {
    if (!L.length) return '';
    return '<div class="calc">' + L.map(function (t) { return '<div>' + t + '</div>'; }).join('') + '</div>';
  }

  function showResult(e) {
    var r = e.res, sides = g.sideList(), pairs = g.o.pairs, i;
    var rows = '';
    for (i = 0; i < g.N; i++) {
      var d = r.det[i], side = g.sideOf ? g.sideOf(i) : i;
      // data-h нужен телефону: там таблица разворачивается в карточки строками
      rows += '<tr' + (i === ME ? ' class="me"' : '') + '><td data-h="">' +
        ART.ava(faceOf(i), letterOf(i), 'sm') + ' ' + g.names[i] +
        (i === g.declarer ? ' <b>(играет)</b>' : '') + '</td>' +
        '<td data-h="Взятки">' + d.cards + '</td>' +
        '<td data-h="Послед">' + (d.posled || '') + '</td>' +
        '<td data-h="Комбинации">' + (d.combo || '') + '</td>' +
        '<td data-h="Белла">' + (d.bella || '') + '</td>' +
        '<td data-h="Лыжи" class="' + (d.lyzhi ? 'neg' : '') + '">' + (d.lyzhi || '') + '</td>' +
        (pairs ? '' : '<td data-h="Итого" class="tot">' + r.final[side] + '</td>') + '</tr>';
    }
    if (pairs)
      for (i = 0; i < sides.length; i++)
        rows += '<tr class="sum"><td colspan="6" data-h="">' + g.sideName(i) +
          (i === r.declSide ? ' — играли' : '') + '</td><td data-h="Итого" class="tot">' +
          r.final[i] + '</td></tr>';

    var head = r.beit ? '<h3 style="color:#ec8b7d">Бейт</h3>' : (r.hang ? '<h3>Висяк</h3>' : '<h3>Итог раздачи</h3>');
    var sub = r.beit ? 'Играющий набрал меньше соперника — его очки уходят.' :
      (r.hang ? 'Поровну. Очки переносятся на следующую раздачу, козырь не выбирают, комбинации не объявляются.' :
        'Козырь — ' + K.SUIT_NAME[g.trump] + ' ' + K.SUIT_CH[g.trump] + ', играл ' + g.names[g.declarer] + '.');
    modal(head + '<div class="sub">' + sub + '</div>' +
      '<table class="res"><thead><tr><th>Игрок</th><th>Взятки</th><th>Послед</th><th>Комб.</th>' +
      '<th>Белла</th><th>Лыжи</th>' + (pairs ? '<th></th>' : '<th>Итого</th>') + '</tr></thead>' +
      '<tbody>' + rows + '</tbody></table>' + calcHTML(r) +
      '<div class="row"><button class="btn pri wide" data-n="1">' +
      (g.over ? 'Итог партии' : 'Следующая раздача') + '</button></div>', function (m) {
        m.onclick = function (ev) {
          if (!ev.target.closest('[data-n]')) return;
          closeModal(); evIdx = g.ev.length;
          // партия закончилась этой раздачей — «дальше» некуда, показываем итог партии
          if (g.over) return ready();
          actIf('next', {});
        };
      }, { light: true });
  }

  /* ---------- достижения ----------
     Всё, что можно честно проверить, проверяется здесь: у интерфейса под рукой
     и результат раздачи, и состояние стола, и кто в сети живой. */
  var hangMine = false, wasMinus = false;
  // трекеры на партию: серии висяков и бейтов, минимум счёта, отставание перед последней раздачей
  var prevBeitGiven = false, prevBeitTaken = false,
    shtrafGiven = 0, minScore = 0, defPrev = 0, defAtStart = 0,
    defWins = 0, lostHand = false, sawHang = false;
  /* Золотые считаются по партии целиком: брал ли я слово хоть раз, получал ли
     бейт, и сколько раздач за весь вечер взял соперник. */
  var gWord = false, gBeitMe = false, gFoeHands = 0, gSpyHand = false;
  function achReset() {
    gWord = false; gBeitMe = false; gFoeHands = 0; gSpyHand = false;
    hangMine = false; wasMinus = false;
    prevBeitGiven = false; prevBeitTaken = false;
    shtrafGiven = 0; minScore = 0; defPrev = 0; defAtStart = 0;
    defWins = 0; lostHand = false; sawHang = false;
  }
  function myScore() { return g.o.pairs ? g.sideScore(mySide()) : g.score[ME]; }
  function bestOther() {
    var sd = mySide(), n = g.sideList ? g.sideList().length : g.N, b = -Infinity, i;
    for (i = 0; i < n; i++) {
      if (i === sd) continue;
      var v = g.sideScore ? g.sideScore(i) : g.score[i];
      if (v > b) b = v;
    }
    return b === -Infinity ? 0 : b;
  }

  function sideOfP(p) { return g.sideOf ? g.sideOf(p) : p; }
  function mySide() { return sideOfP(ME); }
  function sideBeitsMine() { return g.sideBeits ? g.sideBeits(mySide()) : (g.beits[ME] || 0); }
  function liveOthers() {
    if (!window.Net || !Net.S.on || !Net.S.conns) return 0;
    var n = 0;
    for (var i = 0; i < g.N; i++) if (i !== ME && Net.S.conns[i] && Net.S.conns[i].conn) n++;
    return n;
  }
  function mateLive() {
    if (!window.Net || !Net.S.on || !Net.S.conns || !g.o.pairs) return false;
    var mate = (ME + 2) % 4;
    return !!(Net.S.conns[mate] && Net.S.conns[mate].conn);
  }
  function allLive() {
    if (!window.Net || !Net.S.on || !Net.S.conns) return false;
    for (var i = 0; i < g.N; i++) if (i !== ME && !(Net.S.conns[i] && Net.S.conns[i].conn)) return false;
    return g.N > 1;
  }
  /* Сетевые близнецы: тот же подвиг, но за столом с живым соперником, стоит отдельного
     портрета. Чтобы не дублировать проверки, они висят прямо на выдаче: сработала
     обычная — сработает и сетевая, если рядом живой человек. */
  var NETTWIN = {
    lyzhi: 'netLyzhi', shtraf: 'netShtraf', bella: 'netBella', sweep: 'netSweep',
    h150: 'netH150', hangWin: 'netHang', swap7: 'netSwap7', musor: 'netMusor',
    comeback: 'netComeback', clean: 'netClean', lastWord: 'netLastWord',
    allTrump: 'netAllTrump', noTrump: 'netNoTrump', cards120: 'netCards120',
    spor: 'netSpor', crush100: 'netCrush'
  };
  function netLive() { return !!(window.Net && Net.S.on) && liveOthers() >= 1; }
  function ach(id) {
    try { if (window.Boot && Boot.ach) Boot.ach(id); } catch (e) { }
    var tw = NETTWIN[id];
    if (tw && netLive()) { try { Boot.ach(tw); } catch (e) { } }
  }

  function achHand(r) {
    var sd = mySide(), i, sides = g.sideList ? g.sideList() : null;
    // соперника оставили без взяток
    for (i = 0; i < g.N; i++) if (r.det[i] && r.det[i].lyzhi && sideOfP(i) !== sd) ach('lyzhi');
    // третий бейт сопернику — с минусом сто
    if (r.beit && r.shtraf && r.declSide !== sd) ach('shtraf');
    // чужая белла легла в нашу взятку
    if (r.bella && r.bella.taker >= 0 &&
      sideOfP(r.bella.holder) !== sd && sideOfP(r.bella.taker) === sd) ach('bella');
    // бейт стороне, которая записала полтину
    if (r.beit && r.declSide !== sd && r.comboKind === 'P' &&
      r.comboBy >= 0 && sideOfP(r.comboBy) === r.declSide) ach('beitPolt');
    // висяк на своей игре — и следующая раздача взята
    if (r.hang) hangMine = (sideOfP(g.declarer) === sd);
    else if (hangMine) {
      if (!r.beit && r.declSide === sd) ach('hangWin');
      hangMine = false;
    }
    // все взятки раздачи наши
    if (r.taken && r.tricks) {
      var tk = 0;
      for (i = 0; i < g.N; i++) if (sideOfP(i) === sd) tk += r.taken[i];
      if (tk === r.tricks) ach('sweep');
    }
    // комбинация и белла в одной раздаче
    if (r.comboBy >= 0 && sideOfP(r.comboBy) === sd && r.bella && sideOfP(r.bella.holder) === sd)
      ach('allthree');
    // полтораста за раздачу
    if ((r.base ? r.base[sd] : r.sraw[sd]) >= 150) ach('h150');
    // в одной взятке легли и мусор, и манела — и взятка наша
    if (g.trump != null && g.tricks) {
      for (i = 0; i < g.tricks.length; i++) {
        var t = g.tricks[i];
        if (sideOfP(t.w) !== sd) continue;
        var j = false, n9 = false;
        t.plays.forEach(function (pl) {
          if (pl.c.s !== g.trump) return;
          if (pl.c.r === 'J') j = true;
          if (pl.c.r === '9') n9 = true;
        });
        if (j && n9) { ach('yasman'); break; }
      }
    }
    // обменяли козырную семёрку и раздачу взяли
    if (r.swap7 != null && r.swap7 >= 0 && sideOfP(r.swap7) === sd) {
      var best = -1e9;
      for (i = 0; i < r.final.length; i++) if (i !== sd && r.final[i] > best) best = r.final[i];
      if (r.final[sd] > best) ach('swap7');
    }
    // раунд взят всухую: 500+ у нас, соперник не добрал и сотни
    // (условие «против нуля» за 2300 партий выпало один раз — это был не секрет, а мираж)
    var mineScore = g.sideScore ? g.sideScore(sd) : g.score[ME], dry = mineScore >= 500;
    if (dry) {
      var n = sides ? sides.length : g.N;
      for (i = 0; i < n; i++) if (i !== sd && (g.sideScore ? g.sideScore(i) : g.score[i]) >= 100) dry = false;
      if (dry) ach('dry');
    }
    if (mineScore < 0) wasMinus = true;
    try {
      var stx = (window.Boot && Boot.stats) ? Boot.stats() : {};
      if ((stx.hands || 0) >= 100) ach('h100');
      if ((stx.hands || 0) >= 200) ach('hands200');
      if ((stx.hands || 0) >= 500) ach('hands500');
      if ((stx.hands || 0) >= 1000) ach('h1000');
      if ((stx.hands || 0) >= 2500) ach('h2500');
      if ((stx.tricks || 0) >= 1000) ach('tr1000');
      if ((stx.tricks || 0) >= 5000) ach('tr5000');
      if ((stx.combos || 0) >= 100) ach('cmb100');
      if ((stx.comboPts || 0) >= 5000) ach('cmbPts');
      if ((stx.bella || 0) >= 50) ach('bella50');
      if ((stx.beitsGave || 0) >= 100) ach('gave100');
      if ((stx.lyzhi || 0) >= 25) ach('lyzhi25');
      if ((stx.declWon || 0) >= 200) ach('declWon200');
      if ((stx.best || 0) >= 200) ach('best200');
      if ((stx.nHands || 0) >= 100) ach('nH100');
      if ((stx.nHands || 0) >= 500) ach('nH500');
      if ((stx.nHands || 0) >= 1000) ach('nH1000');
    } catch (e) { }
    achHand2(r);
  }

  /* ---------- золотые: копилка по раздаче ----------
     Считается только за живым столом (вызов стоит под netLive) и только
     по тому, что уже лежит в результате раздачи. Каждый счётчик — своя
     легенда, лестница с серебряными ачивками нигде не пересекается. */
  function goldHand(r, pat, side) {
    var i, bestO = -Infinity;
    for (i = 0; i < r.sraw.length; i++) if (i !== side && r.sraw[i] > bestO) bestO = r.sraw[i];
    var winHand = r.sraw[side] > bestO;
    var declSide = (r.declSide != null) ? r.declSide
      : (g.declarer >= 0 ? (g.sideOf ? g.sideOf(g.declarer) : g.declarer) : -1);

    pat.nTricks = g.taken[ME] || 0;                       // Пушкин
    if (r.last && r.last.w === ME) pat.nPosled = 1;       // Костя-моряк
    if (g.cDecl && g.cDecl.indexOf(ME) >= 0) pat.nCombos = 1;   // Бабель
    if (g.declarer === ME) {
      gWord = true;
      if (!r.beit) pat.nDeclWon = 1;                      // Беня Крик
    }
    if (r.beit) {
      if (declSide === side) gBeitMe = true;
      else pat.nBeitOpp = 1;                              // Мишка Япончик
    }
    if (winHand && declSide >= 0 && declSide !== side) pat.nDefWon = 1;   // Бендер
    if (winHand && gSpyHand) pat.nSpy = 1;                // Сидней Рейли
    if (!winHand) gFoeHands++;
    gSpyHand = false;
  }

  /* Достижения партии 2. Всё считается по тому, что уже лежит в результате
     раздачи и в g.tricks — отдельного учёта в ядре не заводим. */
  function achHand2(r) {
    var sd = mySide(), i, ME_ = ME;
    // перевес по раздаче (до бейта — иначе перевес всегда огромный)
    var bestO = -Infinity;
    for (i = 0; i < r.sraw.length; i++) if (i !== sd && r.sraw[i] > bestO) bestO = r.sraw[i];
    var mineRaw = r.sraw[sd], winHand = mineRaw > bestO, dif = mineRaw - bestO;

    if ((r.base ? r.base[sd] : mineRaw) >= 200) ach('h200');
    if (winHand) {
      if (dif === 1) ach('one1');
      if (dif <= 10) ach('close10');
      if (r.last && sideOfP(r.last.w) !== sd) ach('noPosled');
      if (r.forced && r.declSide === sd && !r.beit) ach('lastWord');
      if (g.o.pairs && r.taken) {
        if (r.taken[ME_] === 1) ach('oneTrick');
        if (r.taken[ME_] === 0) ach('zeroTrick');
      }
    }

    // комбинации
    if (r.tie && sideOfP(r.tie.win) === sd) ach('spor');
    if (r.comboBy >= 0 && sideOfP(r.comboBy) === sd && g.combos) {
      var mySideList = g.sideList ? g.sideList()[sd] : [ME_], cnt = 0, kozPolt = false;
      mySideList.forEach(function (q) {
        var kk = g.combos[q] || [];
        cnt += kk.length;
        kk.forEach(function (co) { if (co.kind === 'P' && co.trump) kozPolt = true; });
      });
      if (cnt >= 3) ach('combo3');
      if (kozPolt && winHand) ach('poltK');
      var nP = 0, nT = 0, fromAce = false;
      mySideList.forEach(function (q) {
        (g.combos[q] || []).forEach(function (co) {
          if (co.kind === 'P') nP++; else nT++;
          if (K.RANKS[co.top] === 'A') fromAce = true;
        });
      });
      if (fromAce) ach('fromAce');
      if (nP >= 1 && nT >= 1) ach('terzPolt');
      if (nP >= 2) ach('twoPolt');
      if (nP >= 1 && r.bella && sideOfP(r.bella.holder) === sd) ach('bellaPolt');
    }

    // белла
    if (r.bella) {
      if (sideOfP(r.bella.holder) === sd) {
        if (winHand) ach('bellaWin');
        if (r.beit && r.declSide === sd) ach('bellaBeit');
      } else if (g.trump != null && g.tricks) {
        var gk = false, gq = false;
        g.tricks.forEach(function (t) {
          if (sideOfP(t.w) !== sd) return;
          t.plays.forEach(function (pl) {
            if (pl.c.s !== g.trump) return;
            if (pl.c.r === 'K') gk = true;
            if (pl.c.r === 'Q') gq = true;
          });
        });
        if (gk && gq) ach('bellaSteal');
      }
    }

    // козыри и взятки
    if (g.trump != null && g.tricks && g.tricks.length) {
      var hadTrump = false, allTr = 0, myTr = 0, myAces = 0, myTens = 0,
        myKings = 0, myQueens = 0, myJacks = 0, fatTrick = 0;
      g.tricks.forEach(function (t) {
        var trumps = 0, wc = null, foeN9 = false, worth = 0;
        t.plays.forEach(function (pl) {
          if (pl.c.s === g.trump) { allTr++; trumps++; if (pl.p === ME_) hadTrump = true; }
          if (pl.c.s === g.trump && pl.c.r === '9' && sideOfP(pl.p) !== sd) foeN9 = true;
          if (pl.p === t.w) wc = pl.c;
          worth += K.val(pl.c, g.trump);
        });
        if (sideOfP(t.w) !== sd) return;
        myTr += trumps;
        if (worth > fatTrick) fatTrick = worth;
        if (wc && wc.s === g.trump && wc.r === '7') ach('seven7');
        t.plays.forEach(function (pl) {
          if (pl.c.r === 'A') myAces++;
          if (pl.c.r === '10') myTens++;
          if (pl.c.r === 'K') myKings++;
          if (pl.c.r === 'Q') myQueens++;
          if (pl.c.r === 'J' && pl.c.s !== g.trump) myJacks++;
        });
        // козырный валет накрыл чужую манэллу
        if (wc && wc.s === g.trump && wc.r === 'J' && foeN9) ach('manela');
        if (trumps >= 3) ach('tri3');
        if (wc && wc.s === g.trump && wc.r === 'J') {
          var n9 = false, ace = false;
          t.plays.forEach(function (pl) {
            if (pl.c.s === g.trump && pl.c.r === '9') n9 = true;
            if (pl.c.r === 'A') ace = true;
          });
          if (n9 && ace) ach('musor');
        }
      });
      if (winHand && !hadTrump) ach('noTrump');
      if (allTr >= 8 && myTr >= 8) ach('allTrump');
      if (myAces === 4) ach('aces4');
      if (myTens === 4) ach('tens4');
      if (myKings === 4) ach('kings4');
      if (myQueens === 4) ach('queens4');
      if (myJacks === 3) ach('jacks3');
      if (fatTrick >= 40) ach('fat40');
    }

    // очки за раздачу и разбор висяка
    if (r.det && r.det[ME_] && r.det[ME_].cards >= 120) ach('cards120');
    if (r.det && r.det[ME_] && r.det[ME_].cards >= 100) ach('cards100');
    // разнесли чужую игру
    if (winHand && r.declSide !== sd && dif >= 100) ach('crush100');
    // белла легла в последнюю взятку, и она наша
    if (r.bella && g.trump != null && g.tricks && g.tricks.length) {
      var lt2 = g.tricks[g.tricks.length - 1];
      if (sideOfP(lt2.w) === sd && lt2.plays.some(function (pl) {
        return pl.c.s === g.trump && (pl.c.r === 'K' || pl.c.r === 'Q');
      })) ach('bellaLast');
    }
    // взяли раздачу голыми взятками: ни комбинаций, ни беллы, ни последа
    if (winHand && r.comboKind === 'P' && r.comboBy >= 0 && sideOfP(r.comboBy) !== sd)
      ach('poltLost');
    // три чужие игры подряд
    if (winHand && r.declSide !== sd) { defWins++; if (defWins >= 3) ach('defense3'); }
    else if (r.declSide !== sd) defWins = 0;
    // обменяли семёрку и записали комбинацию
    if (r.swap7 != null && r.swap7 >= 0 && sideOfP(r.swap7) === sd &&
      r.comboBy >= 0 && sideOfP(r.comboBy) === sd) ach('swapCombo');
    if (!winHand) lostHand = true;
    if (r.hang) sawHang = true;
    if (winHand && !(r.comboBy >= 0 && sideOfP(r.comboBy) === sd) &&
      !(r.bella && sideOfP(r.bella.holder) === sd) &&
      !(r.last && sideOfP(r.last.w) === sd)) ach('dryHand');
    if (r.carry && winHand) ach('razgreb');
    // серии бейтов
    var bg = !!(r.beit && r.declSide !== sd), bt = !!(r.beit && r.declSide === sd);
    if (bg && prevBeitGiven) ach('beit2');
    if (prevBeitTaken && r.declSide === sd && !r.beit && winHand) ach('beitBack');
    if (r.shtraf && r.declSide !== sd) { shtrafGiven++; if (shtrafGiven >= 2) ach('shtraf2'); }
    prevBeitGiven = bg; prevBeitTaken = bt;

    // счёт партии: минимум и отставание перед последней раздачей
    var ms = myScore();
    if (ms < minScore) minScore = ms;
    defAtStart = defPrev;
    defPrev = bestOther() - ms;
  }

  /* ---------- золотые: пороги ----------
     Проверяются после того, как копилка обновлена. Всё сетевое: с ботами
     ни один из этих счётчиков не растёт вовсе. */
  function achGold() {
    if (!window.Boot || !Boot.ach) return;
    var st = Boot.stats ? Boot.stats() : {}, n = function (k) { return st[k] || 0; };
    if (n('nGames') - n('nWins') >= 100) ach('gPopandopulo');
    if (n('nDeclWon') >= 100) ach('gBenya');
    if (n('nDays') >= 60) ach('gSashka');
    if (n('nNoWord') >= 10) ach('gSonka');
    if (n('nSpy') >= 15) ach('gReilly');
    if (n('nBeitOpp') >= 50) ach('gYaponchik');
    if (n('nDefWon') >= 150) ach('gBender');
    if (n('nW2') >= 25 && n('nW3') >= 25 && n('nW4') >= 25) ach('gUtyosov');
    if (n('nCombos') >= 100) ach('gBabel');
    if (n('nChat') >= 300) ach('gZhvanetsky');
    if (n('hosted') >= 50) ach('gDuke');
    if (n('nPosled') >= 100) ach('gKostya');
    if (n('nTricks') >= 1000) ach('gPushkin');
    if (n('nNoBeit') >= 75) ach('gKholodnaya');
    if (n('nDry') >= 10) ach('gAkhmatova');
    if (n('nGames') >= 500) ach('gInber');
  }

  function achGame(mine) {
    if (!window.Boot || !Boot.ach) return;
    achGold();
    var sd = mySide(), st = Boot.stats ? Boot.stats() : {};
    if (window.Net && Net.S.on && g.N === 4 && allLive()) ach('full4');
    if (!mine) { try { Boot.bumpStats({ streak: -(st.streak || 0) }); } catch (e) { } return; }
    ach('first');
    if ((st.wins || 0) >= 10) ach('w10');
    if ((st.wins || 0) >= 20) ach('w20');
    if ((st.streak || 0) >= 3) ach('streak3');
    if (sideBeitsMine() === 0 && (g.handsPlayed || 0) >= 3) ach('clean');
    if (sideBeitsMine() >= 2) ach('twoBeit');
    if (g.N === 3 && g.o.target === 1001 && sideBeitsMine() >= 2) ach('big3');
    if (wasMinus) ach('comeback');
    if (g.o.pairs && g.o.match2 && g.roundWins &&
      g.roundWins[sd] === 2 && g.roundWins[1 - sd] === 0) ach('m20');
    var net = !!(window.Net && Net.S.on), live = liveOthers();
    if (g.N === 2 && !net && (g.lvl || 2) === 3) ach('duelBot');
    if (g.N === 2 && net && live >= 1) ach('duelNet');
    if (net && live >= 1) {
      if ((st.netOne || 0) >= 1) ach('live1');
      if ((st.netOne || 0) >= 5) ach('live5');
    }
    if (net && allLive()) {
      if ((st.netAll || 0) >= 1) ach('net1');
      if ((st.netAll || 0) >= 5) ach('net5');
    }
    // --- партия 2
    if (g.N === 2 && g.o.target === 301) ach('d301');
    if (g.N === 2 && g.o.target === 501) ach('d501');
    if (myScore() === g.o.target) ach('exact');
    if (minScore <= -100) ach('minus100');
    if (defAtStart >= 200) ach('catchup');
    if ((st.streak || 0) >= 5) ach('streak5');
    if ((st.wins || 0) >= 50) ach('w50');
    if (g.o.target >= 1001 && (g.handsPlayed || 0) >= 8) ach('long8');
    var hr = new Date().getHours();
    if (hr >= 0 && hr < 5) ach('night');

    // --- партия 3: вокруг стола
    if ((st.hosted || 0) >= 10) ach('host10');
    if ((st.joined || 0) >= 10) ach('guest10');
    if ((st.talkGames || 0) >= 10) ach('odessit');
    if ((st.mateWins || 0) >= 10) ach('mate10');
    if ((st.lvl1 || 0) && (st.lvl2 || 0) && (st.lvl3 || 0)) ach('allLvl');
    if ((st.lvl3 || 0) >= 25) ach('katala25');
    if (!(Boot.CFG && Boot.CFG.talk)) ach('silent');
    if (!net && g.N === 3 && !g.o.pairs && (g.lvl || 2) === 3) ach('soloThree');

    // --- партия 4
    if ((st.wins || 0) >= 100) ach('w100');
    if ((st.streak || 0) >= 10) ach('streak10');
    if ((st.w2 || 0) >= 25) ach('duel25');
    if ((st.w3 || 0) >= 25) ach('solo25');
    if ((st.w4 || 0) >= 25) ach('pair25');
    if ((st.w2 || 0) && (st.w3 || 0) && (st.w4 || 0)) ach('allModes');
    if ((st.days || 0) >= 7) ach('week7');
    if ((st.days || 0) >= 30) ach('month30');

    // --- партия 5: долгие копилки
    if ((st.games || 0) >= 100) ach('g100');
    if ((st.games || 0) >= 250) ach('g250');
    if ((st.games || 0) >= 500) ach('g500');
    if ((st.wins || 0) >= 200) ach('w200');
    if ((st.wins || 0) >= 500) ach('w500');
    if ((st.bestGame || 0) >= 650) ach('bestGame650');
    if (!lostHand) ach('noLoss');
    if ((g.handsPlayed || 0) <= 3) ach('blitz');
    if (sawHang) ach('viaHang');

    // --- партия 5: сетевые копилки
    if ((st.nGames || 0) >= 10) ach('nG10');
    if ((st.nGames || 0) >= 50) ach('nG50');
    if ((st.nGames || 0) >= 100) ach('nG100');
    if ((st.nGames || 0) >= 250) ach('nG250');
    if ((st.nWins || 0) >= 10) ach('nW10');
    if ((st.nWins || 0) >= 50) ach('nW50');
    if ((st.nWins || 0) >= 100) ach('nW100');
    if ((st.nStreak || 0) >= 3) ach('nS3');
    if ((st.nStreak || 0) >= 5) ach('nS5');
    if ((st.nStreak || 0) >= 10) ach('nS10');
    if ((st.nDays || 0) >= 7) ach('nD7');
    if ((st.nDays || 0) >= 30) ach('nD30');
    if ((st.nW2 || 0) && (st.nW3 || 0) && (st.nW4 || 0)) ach('nModes');
  }

  function showOver() {
    var win = g.names[g.winner];
    var mine = (g.winner === ME) || (g.o.pairs && g.winner === (ME + 2) % 4);
    talk(g.winner, 'gameWin', null, true);
    talk(anyBot(g.winner), 'gameLose', null, true);
    if (window.Boot) {
      try {
        var pat = { games: 1, wins: mine ? 1 : 0 };
        // «сегодня» числом ГГГГММДД: setMax сам не даст откатить дату назад
        var dt = new Date(), today = dt.getFullYear() * 10000 + (dt.getMonth() + 1) * 100 + dt.getDate();
        if (today > (Boot.stats().lastDay || 0)) { Boot.setMax('lastDay', today); pat.days = 1; }
        pat['g' + g.N] = 1; pat['w' + g.N] = mine ? 1 : 0;
        var netG = !!(window.Net && Net.S.on), nl = netLive();
        if (netG) pat[Net.S.host ? 'hosted' : 'joined'] = 1;
        if (nl) {
          // сетевая копилка: только столы, где сидел живой соперник
          pat.nGames = 1;
          if (mine) { pat.nWins = 1; pat.nStreak = 1; pat['nW' + g.N] = 1; }
          var ns = Boot.stats();
          if (today > (ns.nLastDay || 0)) { Boot.setMax('nLastDay', today); pat.nDays = 1; }
          if (!mine) pat.nStreak = -(ns.nStreak || 0);
          // золотые, которые считаются партией целиком
          if (mine) {
            if (!gWord) pat.nNoWord = 1;          // Сонька: всё чужими руками
            if (!gBeitMe) pat.nNoBeit = 1;        // Вера Холодная: ни одного своего бейта
            if (gFoeHands === 0) pat.nDry = 1;    // Ахматова: соперник не взял ни раздачи
          }
        }
        if (Boot.CFG && Boot.CFG.talk) pat.talkGames = 1;
        if (mine) {
          pat.streak = 1;
          if (netG && liveOthers() >= 1) pat.netOne = 1;
          if (netG && allLive()) pat.netAll = 1;
          if (!netG) pat['lvl' + (g.lvl || 2)] = 1;      // победа над ботами этого уровня
          if (netG && g.o.pairs && mateLive()) pat.mateWins = 1;
        }
        Boot.bumpStats(pat);
        Boot.setMax('bestGame', g.o.pairs ? g.sideScore(g.sideOf(ME)) : g.score[ME]);
        Boot.dropSolo();
        achGame(mine);
      } catch (err) { }
    }
    var rows = g.o.pairs
      ? g.sideList().map(function (s, i) { return g.sideName(i) + ' — ' + g.sideScore(i); }).join(', ')
      : g.names.map(function (n, i) { return n + ' — ' + g.score[i]; }).join(', ');
    // за доигранную партию — новый портрет в копилку
    var opened = -1;
    try { if (window.Boot && Boot.unlockFace) opened = Boot.unlockFace(mine); } catch (err) { }
    var gift = opened >= 0
      ? '<div class="gift">' + ART.ava(opened, '+', 'huge') +
        '<div><b>Открыт новый портрет!</b><div class="sub" style="margin:2px 0 0">' +
        (window.Boot ? Boot.facesLine() : '') + ' Забрать себе — в профиле.</div></div></div>'
      : '';
    // выбитые за эту партию секреты — вот тут они и раскрываются
    try {
      var got = (window.Boot && Boot.achTake) ? Boot.achTake() : [];
      got.forEach(function (a) {
        gift += '<div class="gift ach">' + ART.ava(a.face, '!', 'huge') +
          '<div><b>Секрет открыт: ' + a.name + '</b>' +
          '<div class="sub" style="margin:2px 0 0">' + a.why + ' — портрет ваш.</div></div></div>';
      });
    } catch (err2) { }
    /* За сетевым столом «Ещё партию» не работала и работать не могла:
       кнопка поднимала новую партию только у того, кто нажал, — у
       остальных стол оставался в прежнем состоянии. Ник: «просто оставь
       кнопку выйти в лобби, где игроки выходят в главное меню, а
       текущий стол закрывается». Так и сделано: одна кнопка, стол
       закрывается для всех, новую партию поднимают заново с лобби. */
