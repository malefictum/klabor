<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Клабор (Деберц)</title>
<!-- Установка как приложения (Microsoft Store / «Установить» в браузере).
     Воркер регистрируется только на https и не во фрейме — на itch.io
     и при открытии файла двойным кликом ничего не меняется.
     В однофайловой сборке блок вырезается. -->
<!--PWA-->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c5561">
<link rel="icon" type="image/png" sizes="32x32" href="img/icons/icon-32.png">
<link rel="apple-touch-icon" href="img/icons/icon-180.png">
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && window.top === window.self)
  addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
<!--/PWA-->
<!-- Колоду и рубашку браузер начинает тянуть ещё при разборе разметки, а не
     когда карта впервые понадобилась: иначе первая фигурная карта мелькает
     пустым белым прямоугольником. Отрисовку это не задерживает — меню
     появляется так же быстро. В однофайловой сборке строки вырезаются:
     там картинки вшиты внутрь. -->
<!--PRELOAD-->
<link rel="preload" as="image" href="img/back.webp">
<link rel="preload" as="image" fetchpriority="low" href="img/KS.webp">
<link rel="preload" as="image" fetchpriority="low" href="img/KH.webp">
<link rel="preload" as="image" fetchpriority="low" href="img/KC.webp">
<link rel="preload" as="image" fetchpriority="low" href="img/KD.webp">
<link rel="preload" as="image" fetchpriority="low" href="img/QS.webp">
<link rel="preload" as="image" fetchpriority="low" href="img/QH.webp">
<link rel="preload" as="image" fetchpriority="low" href="img/QC.webp">
<link rel="preload" as="image" fetchpriority="low" href="img/QD.webp">
<link rel="preload" as="image" fetchpriority="low" href="img/JS.webp">
<link rel="preload" as="image" fetchpriority="low" href="img/JH.webp">
<link rel="preload" as="image" fetchpriority="low" href="img/JC.webp">
<link rel="preload" as="image" fetchpriority="low" href="img/JD.webp">
<!--/PRELOAD-->
<style>
:root{
  --felt:#14707d; --felt2:#0c5561;
  --ink:#1d1a16; --paper:#fbf7ec; --gold:#d8b26a; --gold2:#8d6a2c;
  --red:#c0392b; --good:#2e8b57; --bad:#b23a3a; --rare:#5aa6e0; --legend:#d9a441;
  --panel:rgba(12,32,36,.86); --line:rgba(216,178,106,.35);
  --cw:112px; --ov:-0.30;          /* ширина карты в руке и нахлёст */
  --infoh:48px;                    /* высота табло, ниже него всё остальное */
  --sf:1;                          /* масштаб интерфейса */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font:15px/1.45 "PT Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color:#f3ecdd; background:#0b1416; user-select:none;
  -webkit-user-select:none; touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* прокрутка своя, а не системная белая: тонкая, в цвет стола */
*{scrollbar-width:thin;scrollbar-color:rgba(216,178,106,.45) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:8px}
::-webkit-scrollbar-thumb{background:rgba(216,178,106,.38);border-radius:8px;
  border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(216,178,106,.62);background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}

/* ---------- каркас ---------- */
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
#top{
  display:flex;align-items:center;gap:10px;padding:7px 14px;position:relative;
  background:linear-gradient(180deg,#22353a 0%,#16262a 55%,#0f1c1f 100%);
  border-bottom:1px solid #06100f;
  box-shadow:0 2px 10px rgba(0,0,0,.45);
  flex:0 0 auto;min-height:50px;z-index:30
}
/* золотая волосинка под шапкой — та самая «нарядность» */
#top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(216,178,106,.55) 18%,rgba(216,178,106,.55) 82%,transparent)}
#top .brand{font:700 19px/1 "PT Serif",Georgia,serif;letter-spacing:.1em;color:var(--gold);
  text-shadow:0 1px 0 rgba(0,0,0,.6);display:inline-flex;align-items:center;gap:7px}
#top .brand::before{content:"♠";font-size:13px;color:#cfe0e2;opacity:.55;transform:translateY(-1px)}
#top .brand::after{content:"♦";font-size:13px;color:#d4574c;opacity:.9;transform:translateY(-1px)}
#top .sp{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
  background:rgba(0,0,0,.28);border:1px solid rgba(216,178,106,.28);font-size:12.5px;
  white-space:nowrap;color:#d8c7a0;letter-spacing:.02em
}
.chip b{font-weight:700}
.tbtn{padding:6px 13px;border-radius:9px;border:1px solid var(--line);font-size:13px;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 2px 5px rgba(0,0,0,.3);transition:.14s}
.tbtn:hover{background:linear-gradient(180deg,rgba(216,178,106,.28),rgba(216,178,106,.14));
  border-color:rgba(216,178,106,.6);color:#fff}
.tbtn:active{transform:translateY(1px)}

#body{flex:1;display:flex;min-height:0}
#table{flex:1;position:relative;min-width:0;overflow:hidden}
#side{
  width:330px;flex:0 0 330px;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0
}

/* ---------- сукно ---------- */
#felt{position:absolute;inset:0;background:var(--felt);background-size:cover;background-position:center}
#felt.pattern::after{
  content:"";position:absolute;inset:0;opacity:.085;
  background-image:var(--pat);background-size:104px 104px
}
#felt .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 30%,rgba(0,0,0,.45) 100%)}

/* ---------- места игроков ---------- */
.seat{
  position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:5;
  transition:opacity .2s
}
.seat .pl{
  display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;
  background:rgba(8,22,25,.72);border:1px solid var(--line);font-size:13px;white-space:nowrap
}
.seat.act .pl{border-color:var(--gold);box-shadow:0 0 0 2px rgba(216,178,106,.35),0 0 18px rgba(216,178,106,.3)}
.seat .pl .nm{font-weight:700;flex:1 1 auto;min-width:2.5em;max-width:11em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .pl .sc,#seatMe .sc{flex:0 0 auto}
.seat .pl .sc{color:var(--gold);font-weight:700}
.seat .badge{
  font-size:11px;padding:1px 7px;border-radius:6px;background:rgba(216,178,106,.2);
  border:1px solid var(--line)
}
.seat .fan{display:flex;height:44px;align-items:center}
.seat .fan i{
  display:block;width:26px;height:38px;border-radius:3px;margin-left:-14px;
  background:var(--backimg) center/cover;border:1px solid rgba(0,0,0,.45);
  box-shadow:1px 1px 3px rgba(0,0,0,.4)
}
.seat .fan i:first-child{margin-left:0}
.bubble{
  position:absolute;top:100%;margin-top:6px;left:50%;transform:translateX(-50%);
  background:var(--paper);color:#241d12;padding:6px 12px;border-radius:12px;font-size:13px;
  font-weight:700;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.45);opacity:0;
  transition:opacity .18s, transform .18s;pointer-events:none;z-index:9
}
.bubble.talk{white-space:normal;width:max-content;max-width:230px;font-weight:400;
  font-size:13px;line-height:1.35;text-align:left;font-style:italic}
.bubble.talk::before{content:"";position:absolute;top:-5px;left:50%;margin-left:-5px;
  border:5px solid transparent;border-bottom-color:var(--paper);border-top:0}
#seatL .bubble.talk{left:0;transform:none}
#seatL .bubble.talk::before{left:26px}
#seatR .bubble.talk{left:auto;right:0;transform:none}
#seatR .bubble.talk::before{left:auto;right:22px}
#seatL .bubble.talk.on,#seatR .bubble.talk.on{transform:translateY(2px)}
.ava{
  position:relative;width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:inline-block;
  border:1px solid rgba(0,0,0,.45);box-shadow:0 1px 4px rgba(0,0,0,.4);overflow:hidden;
  vertical-align:middle
}
.ava i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;
  font-weight:700;font-size:14px;color:rgba(255,255,255,.92)}
.ava b{position:absolute;inset:0;background-position:center;background-size:cover}
.ava.big{width:56px;height:56px}
.ava.big i{font-size:24px}
.ava.sm{width:22px;height:22px}
.ava.sm i{font-size:11px}
.ava.md{width:38px;height:38px}
.ava.md i{font-size:17px}
.ava.huge{width:84px;height:84px;flex:0 0 auto}
.ava.huge i{font-size:34px}
/* профиль игрока */
/* «чем гордится» в карточке человека из комнаты */
.topach{display:flex;flex-direction:column;gap:6px}
.topach .ta{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:9px;
  background:rgba(255,255,255,.035);border:1px solid transparent}
.topach .ta.gold{border-color:rgba(217,164,65,.45);background:rgba(217,164,65,.1)}
.topach .ta .tt{display:flex;flex-direction:column;min-width:0}
.topach .ta .tan{font-size:13px;font-weight:600}
.topach .ta i{font-style:normal;font-size:11.5px;color:#9fb4b8}
.hrow.tapme{cursor:pointer;transition:.14s}
.hrow.tapme:hover{background:rgba(216,178,106,.1)}
/* одесская биография портрета — под именем в карточке и в профиле */
.bio{font-size:13px;line-height:1.45;color:#cfd8d8;font-style:italic;
  border-left:2px solid rgba(216,178,106,.5);padding:2px 0 2px 10px;margin:8px 0 10px}
.profhead{display:flex;gap:14px;align-items:center;margin:4px 0 10px}
.profhead .pname{font:700 22px/1.2 "PT Serif",Georgia,serif;color:var(--gold)}
table.prof{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 2px}
table.prof td{padding:6px 2px;border-bottom:1px solid rgba(255,255,255,.08)}
@media (max-width:560px){
  table.prof{font-size:13px}
  table.prof td{padding:5px 2px}
  .profhead .pname{font-size:19px}
  .ava.huge{width:64px;height:64px}
  .facerow{grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:7px}
}
table.prof td.v{text-align:right;color:#fff;font-weight:600}
table.prof .dim{color:#9fb4b8;font-weight:400;font-size:12px}
.seat .ava,.sc .ava,.pl .ava{cursor:pointer}
.faces{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:6px}
.faces .fc{aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;position:relative;overflow:hidden}
.faces .fc.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(216,178,106,.2)}
.bubble.on{opacity:1;transform:translateX(-50%) translateY(2px)}

#seatL{left:3%;top:calc(var(--infoh) + 46px)}
#seatR{right:3%;top:calc(var(--infoh) + 46px)}
#seatT{left:50%;top:calc(var(--infoh) + 14px);transform:translateX(-50%)}

/* ---------- центр стола ---------- */
#trick{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:440px;height:290px;z-index:6;
  pointer-events:none}
#trick .slot{position:absolute;width:var(--cw);aspect-ratio:344/512;transition:transform .25s}
#drop{
  position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  width:300px;height:210px;border-radius:18px;border:2px dashed transparent;z-index:4;
  transition:border-color .15s,background .15s;pointer-events:none
}
#drop.hot{border-color:var(--gold);background:rgba(216,178,106,.12)}

#info{
  position:absolute;left:10px;right:10px;top:8px;z-index:7;display:flex;align-items:center;
  gap:12px;flex-wrap:wrap;padding:8px 12px;border-radius:14px;
  background:linear-gradient(180deg,rgba(14,32,36,.88),rgba(8,20,23,.82));
  border:1px solid rgba(216,178,106,.22);backdrop-filter:blur(4px);
  box-shadow:0 6px 20px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.05) inset;
  font-size:13px;pointer-events:none
}
#info .tr{display:flex;align-items:center;gap:9px;padding-right:12px;border-right:1px solid rgba(216,178,106,.2)}
#info .suit{
  width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:var(--paper);box-shadow:0 3px 8px rgba(0,0,0,.5);border:1px solid rgba(0,0,0,.3)
}
#info .suit svg{display:block}
#info .suit.none{background:rgba(255,255,255,.08);color:#8fa3a7;font-size:20px}
#info .tr b{display:block;font-size:14px;color:#f3ecdd}
#info .tr span{display:block;font-size:11px;color:rgba(216,178,106,.8);text-transform:uppercase;letter-spacing:.08em}
#info .grp{display:flex;flex-direction:column;line-height:1.25;padding-right:10px}
#info .grp span{font-size:10px;color:rgba(216,178,106,.75);text-transform:uppercase;letter-spacing:.08em}
#info .grp b{font-weight:700;color:#e7dcc4;font-size:13px}
#info .grp b.dim{color:#7f9296;font-weight:400}
#info .pts{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  justify-content:flex-end;min-width:0}
#info .pts i{font-style:normal;background:rgba(0,0,0,.3);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;white-space:nowrap;color:#cfe0e2}
#info .pts i.me{border-color:var(--gold);color:var(--gold);background:rgba(216,178,106,.12)}

#deckzone{position:absolute;right:3%;bottom:31%;display:flex;gap:14px;align-items:flex-end;z-index:5}
.stock{position:relative;width:98px;height:98px}
.stock .card{position:absolute;width:64px}
.stock .cd{left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);
  background:var(--backimg) center/cover;border-color:rgba(0,0,0,.45);aspect-ratio:344/512}
.stock .cu{left:50%;top:50%;transform:translate(-50%,-50%);z-index:2}
.stock .lb{position:absolute;left:50%;transform:translateX(-50%);bottom:-4px;font-size:11px;color:#e7dcc4;
  background:rgba(8,22,25,.75);padding:1px 7px;border-radius:6px;white-space:nowrap;border:1px solid var(--line);z-index:3}
.mini{width:64px;aspect-ratio:344/512;position:relative}
.mini .lb{
  position:absolute;left:50%;transform:translateX(-50%);bottom:-19px;font-size:11px;color:#e7dcc4;
  background:rgba(8,22,25,.7);padding:1px 7px;border-radius:6px;white-space:nowrap;border:1px solid var(--line)
}
.deckpile{width:64px;aspect-ratio:344/512;border-radius:6px;background:var(--backimg) center/cover;
  box-shadow:2px 2px 0 rgba(0,0,0,.3),4px 4px 0 rgba(0,0,0,.2),0 6px 14px rgba(0,0,0,.4)}

/* ---------- рука ---------- */
#handwrap{position:absolute;left:0;right:0;bottom:0;z-index:10;padding:0 8px 12px;display:flex;
  background:linear-gradient(transparent,rgba(0,0,0,.28) 55%);
  flex-direction:column;align-items:center;gap:4px}
#hand{display:flex;justify-content:center;align-items:flex-end;min-height:calc(var(--cw)*1.49);
  padding-top:26px;width:100%}
#meline{display:flex;align-items:center;gap:10px;min-height:30px}
/* реплика живого игрока: висит над своей же рукой */
#bubMe{position:static;transform:none;margin:0 0 4px;max-width:min(92vw,420px);
  align-self:center;display:none;white-space:normal;text-align:center}
#bubMe.on{display:block;opacity:1;transform:none}
#bubMe::before{left:50%}
#hint{font-size:13px;color:#f0e6cf;font-weight:600;letter-spacing:.02em;
  background:rgba(8,22,25,.8);border:1px solid var(--line);border-radius:999px;
  padding:4px 12px;box-shadow:0 2px 8px rgba(0,0,0,.45)}
#hint:empty{display:none;padding:0;border:0;background:none}
#seatMe{display:flex;align-items:center;gap:7px;padding:3px 11px 3px 4px;border-radius:999px;
  background:rgba(8,22,25,.72);border:1px solid var(--line);font-size:13px;white-space:nowrap}
#seatMe .nm{font-weight:700}
#seatMe .sc{color:var(--gold);font-weight:700}
#seatMe.act{border-color:var(--gold);box-shadow:0 0 0 2px rgba(216,178,106,.3)}

/* ---------- карта ---------- */
.card{
  width:var(--cw);aspect-ratio:344/512;border-radius:7px;background:var(--paper);
  box-shadow:0 2px 6px rgba(0,0,0,.45);position:relative;overflow:hidden;flex:0 0 auto;
  border:1px solid rgba(0,0,0,.25)
}
.card>img,.card>svg{display:block;width:100%;height:100%}
.card.back{background:var(--backimg) center/cover;border-color:rgba(0,0,0,.4)}
#hand .card{
  margin-left:calc(var(--cw) * var(--ov));transition:transform .16s,box-shadow .16s,filter .16s;
  cursor:pointer;touch-action:none
}
#hand .card:first-child{margin-left:0}
#hand .card.playable:hover{transform:translateY(-18px);box-shadow:0 10px 22px rgba(0,0,0,.5);z-index:3}
#hand .card.dead{filter:grayscale(.75) brightness(.62);cursor:not-allowed}
#hand .card.sel{transform:translateY(-22px);box-shadow:0 0 0 2px var(--gold),0 12px 24px rgba(0,0,0,.55);z-index:4}
#hand .card.drag{position:fixed;z-index:200;pointer-events:none;margin:0;transform:none;
  box-shadow:0 18px 34px rgba(0,0,0,.6);transition:none}
#hand .card.ret{transition:transform .18s ease-out,left .18s ease-out,top .18s ease-out}

#fly{position:fixed;inset:0;pointer-events:none;z-index:150}
#fly .card{position:absolute;transition:transform .34s cubic-bezier(.25,.8,.35,1),opacity .3s}

/* ---------- боковая панель ---------- */
#tabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto}
#tabs button{flex:1;padding:9px 4px;font-size:13px;opacity:.6;border-bottom:2px solid transparent}
#tabs button.on{opacity:1;color:var(--gold);border-bottom-color:var(--gold)}
#side h4.hd{font:700 11.5px/1 "PT Sans",sans-serif;letter-spacing:.13em;text-transform:uppercase;
  color:rgba(216,178,106,.8);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
#side h4.hd::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(216,178,106,.3),transparent)}
.pane{display:none;flex:1;overflow:auto;padding:12px;min-height:0}
.pane.on{display:block}
/* чат за столом — только в сетевой партии */
.pane.chat{overflow:hidden;padding:10px}
.pane.chat.on{display:flex;flex-direction:column}
#chatpane .chead{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-bottom:6px}
#chatpane .chead h4.hd{margin:0}
#chatpane .clog{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px;
  padding:6px 2px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#chatpane .cmsg{font-size:13px;line-height:1.4;color:#e2dccb;word-break:break-word}
#chatpane .cmsg b{color:var(--gold);font-weight:700}
#chatpane .cmsg.me b{color:#9fd7c4}
#chatpane .cmsg.sys{color:#9fb4b8;font-size:12px;font-style:italic}
#chatpane .cempty{color:#9fb4b8;font-size:12.5px;line-height:1.45}
#chatpane .csay{display:flex;gap:7px;flex:0 0 auto;margin-top:8px}
#chatpane .csay .fld{flex:1;margin:0}
#tabs button[hidden],#mtabs button[hidden]{display:none}
#logpane p{margin:0 0 5px;font-size:13px;line-height:1.4;color:#d9d0bd}
#logpane p.sys{color:#9fb4b8}
#logpane p.hi{color:var(--gold)}
#logpane p.bad{color:#ec8b7d}
#logpane p.big{color:#fff;font-weight:700}
#logpane hr{border:0;border-top:1px solid var(--line);margin:10px 0}
/* ---------- боковая панель счёта ---------- */
.rbar{margin:0 0 12px;padding:11px 13px;border-radius:12px;text-align:center;
  background:linear-gradient(180deg,rgba(216,178,106,.16),rgba(216,178,106,.05));
  border:1px solid rgba(216,178,106,.32);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.rbar .rb-t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(216,178,106,.85)}
.rbar .rb-score{font:700 34px/1.05 "PT Serif",Georgia,serif;color:#fff;margin-top:2px;
  display:flex;align-items:baseline;justify-content:center;gap:8px}
.rbar .rb-score span{color:rgba(216,178,106,.7);font-size:26px}
.rbar .rb-score.one{font-size:20px;color:#e7dcc4;font-weight:400}
.rbar .rb-score.one b{font-size:30px;color:#fff;margin-left:4px}
.rbar .rb-x{font-size:11px;color:#9fb4b8;margin-top:2px;letter-spacing:.04em}
.rbar.final{background:linear-gradient(180deg,rgba(232,86,74,.2),rgba(232,86,74,.06));
  border-color:rgba(232,86,74,.45)}
/* Сыгранные раунды — разворачиваются кликом по плитке. Табло в матче
   обнуляется между раундами, и без этого списка их счёт пропадал. */
.rbar.tap{cursor:pointer}
.rbar.tap:hover{border-color:rgba(216,178,106,.6)}
.rbar .rl-more{color:var(--gold);opacity:.85;border-bottom:1px dashed rgba(216,178,106,.45)}
.rlog{margin:-6px 0 12px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;
  background:rgba(0,0,0,.2);display:flex;flex-direction:column;gap:4px}
.rlogrow{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:8px;font-size:12px}
.rlogrow .rl-n{color:#9fb4b8;letter-spacing:.04em}
.rlogrow .rl-s{font:700 15px/1 "PT Serif",Georgia,serif;color:#e7dcc4;text-align:center}
.rlogrow .rl-s span{color:rgba(216,178,106,.6);margin:0 3px}
.rlogrow .rl-s b.won{color:var(--gold)}
.rlogrow .rl-w{color:#9fb4b8;font-size:11px;text-align:right;max-width:11em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tcards{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.tcard{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  border:1px solid var(--line);transition:.16s}
.tcard.me{border-color:rgba(216,178,106,.55);
  background:linear-gradient(180deg,rgba(216,178,106,.14),rgba(216,178,106,.04))}
.tcard.act{box-shadow:0 0 0 2px rgba(216,178,106,.35),0 0 18px rgba(216,178,106,.18)}
.tcard .tava{display:flex;flex:0 0 auto}
.tcard .tava span+span{margin-left:-12px}
.tcard .tava .ava{border:2px solid rgba(8,22,25,.85);cursor:pointer}
.tcard .tbody{flex:1;min-width:0}
.tcard .tnames{font-size:13.5px;font-weight:700;color:#f3ecdd;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis}
.tcard .tnames .who.you{color:var(--gold)}
.tcard .tnames .amp{font-style:normal;color:#7f9296;font-weight:400;margin:0 4px}
.tcard .tflag{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:#0d1a1c;background:var(--gold);
  padding:1px 6px;border-radius:5px;vertical-align:1px}
.tcard .tsub{font-size:11.5px;color:#9fb4b8;margin-top:2px}
.tcard .tsub b{color:#d8c7a0;font-weight:600}
.tcard .tpts{font:700 26px/1 "PT Serif",Georgia,serif;color:#fff;flex:0 0 auto;
  min-width:2.2em;text-align:right}
.tcard.me .tpts{color:var(--gold)}

.dbox{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:2px}
.dline{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 12px;font-size:13.5px;background:rgba(255,255,255,.025)}
.dline+.dline{border-top:1px solid rgba(255,255,255,.07)}
.dline span{color:#9fb4b8}
.dline b{color:#f3ecdd;font-weight:700;text-align:right}
.dline b.hot{color:var(--gold)}

table.sc{width:100%;border-collapse:collapse;font-size:14px}
table.sc th,table.sc td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:right}
table.sc th:first-child,table.sc td:first-child{text-align:left}
table.sc th{color:var(--gold);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
table.sc tr.me td{background:rgba(216,178,106,.09)}
h4.hd{margin:16px 0 6px;font:700 13px/1 "PT Serif",Georgia,serif;color:var(--gold);
  text-transform:uppercase;letter-spacing:.07em}
h4.hd:first-child{margin-top:0}
.rules{font-size:13.5px;line-height:1.55;color:#ddd4c2}
.rules b{color:#fff}
.rules ul{margin:4px 0 10px;padding-left:18px}
.rules li{margin:2px 0}
.trakt{border-left:2px solid var(--gold);padding:6px 10px;margin:6px 0;background:rgba(216,178,106,.07);
  font-size:12.5px;border-radius:0 6px 6px 0}
.trakt b{display:block;color:var(--gold);font-size:12px;margin-bottom:2px}

/* ---------- диалоги ---------- */
#modal{position:fixed;inset:0;background:rgba(4,10,12,.72);display:none;align-items:center;
  justify-content:center;z-index:300;padding:16px;backdrop-filter:blur(3px)}
#modal.on{display:flex}
/* окна решений по ходу партии стол не гасят: за ними надо видеть козырь, кто сдаёт и свои карты */
#modal.light{background:rgba(4,10,12,.14);backdrop-filter:none;
  padding-bottom:118px}          /* окно приподнято: снизу видно свою реплику и руку */
@media (max-width:900px){ #modal.light{padding-bottom:96px} }
#modal.light .dlg{border-color:rgba(216,178,106,.5);box-shadow:0 0 0 1px rgba(0,0,0,.5),0 26px 70px rgba(0,0,0,.75)}
#modal.over{z-index:500}
#splash{position:fixed;inset:0;background:rgba(4,10,12,.82);display:none;align-items:center;
  justify-content:center;z-index:400;padding:16px;backdrop-filter:blur(4px)}
#splash.on{display:flex}
#splash .dlg{max-width:480px}
/* экраны меню — широкие: слева дело, справа комната */
#splash .dlg.hallwide{max-width:900px}
.mainwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:18px;align-items:start}
.mcol{min-width:0;max-width:470px;margin:0 auto;width:100%}
/* две одинаковые круглые иконки справа в шапке комнаты: звук и сворачивание */
.hico{display:inline-grid;place-items:center;width:26px;height:26px;flex:0 0 auto;
  border:1px solid var(--line);border-radius:50%;color:#9fb4b8;background:rgba(255,255,255,.03);
  font-size:13px;line-height:1;cursor:pointer;transition:.14s}
.hico:hover{border-color:rgba(216,178,106,.6);color:var(--gold);background:rgba(216,178,106,.12)}
/* тот же класс носит текстовая кнопка звука в чате за столом — там она
   осталась кнопкой, круглая иконка только в лобби */
.btn.hsnd{margin-left:auto;padding:2px 8px;white-space:nowrap}
.btn.hsnd.off{opacity:.55;text-decoration:line-through}
.hico.hsnd{margin-left:auto}
.hico.hsnd.off{opacity:.5;position:relative}
.hico.hsnd.off::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:1px;
  background:currentColor;transform:rotate(-35deg)}
.hfold{display:none}
.hallcol{min-width:0;display:flex;flex-direction:column;gap:8px;
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  background:rgba(255,255,255,.025);height:min(62vh,520px)}
.hhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hhead h4.hd{margin:0}
/* вкладки: «Люди» с числом и «Чат» с точкой непрочитанного */
.htabs{display:flex;gap:6px;flex:0 0 auto}
.htab{flex:1;padding:5px 10px;border:1px solid var(--line);border-radius:9px;
  background:rgba(255,255,255,.03);color:#c4d0d2;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:.14s}
.htab:hover{border-color:rgba(216,178,106,.45);color:#fff}
.htab.on{background:linear-gradient(180deg,rgba(216,178,106,.26),rgba(216,178,106,.12));
  border-color:rgba(216,178,106,.6);color:#fff}
.htab .hnum{font-style:normal;font-size:11px;font-weight:700;color:var(--gold);
  background:rgba(216,178,106,.16);border-radius:999px;padding:0 6px;line-height:16px}
.htab .hnew{width:7px;height:7px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 6px rgba(216,178,106,.7)}
/* показываем ровно одну вкладку — каждой достаётся вся высота колонки */
.hallcol.t-people .hlog,.hallcol.t-log .hpeople{display:none}
.hstat{font-size:11.5px;color:#9fb4b8;border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.hstat.ok{color:var(--gold);border-color:rgba(216,178,106,.45)}
.hstat.bad{color:#ec8b7d;border-color:rgba(232,86,74,.45)}
.hpeople{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:5px;padding-top:2px}
/* статус прямо на аватаре: зелёный — в меню, жёлтый — уже за столом */
.hav{position:relative;display:inline-block;flex:0 0 auto;line-height:0}
.hdotst{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;
  border:2px solid #16262a;box-sizing:border-box}
.hdotst.free{background:#5fbf7a}
.hdotst.busy{background:var(--gold)}
/* Играет с ботами — не в комнате, но и не за сетевым столом: свой цвет,
   иначе «занят» и «занят по-другому» неразличимы. */
.hdotst.bots{background:#7f9ad6}
/* Строка «кто в сети» под вкладками комнаты: тихая, в одну строку,
   переносится на узком экране. */
.honlinebox:empty{display:none}
.honline{padding:5px 10px 3px;font-size:12px;color:#9fb3b8;line-height:1.35}
.hrow{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:9px;
  background:rgba(255,255,255,.035);font-size:13px}
.hrow.me{border:1px solid rgba(216,178,106,.4);background:rgba(216,178,106,.09)}
.hrow .hname{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.hrow .hname b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .hsub{font-size:11px;color:#8ba0a4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .hhost{font-style:normal;color:var(--gold)}
.hrow .hst{font-size:11.5px;color:#9fb4b8;white-space:nowrap}
.btn.tiny{padding:3px 10px;font-size:12px;border-radius:7px;white-space:nowrap}
.hlog{flex:1;min-height:0;overflow:auto;padding-top:2px;
  display:flex;flex-direction:column;gap:4px}
.hmsg{font-size:13px;line-height:1.4;color:#e2dccb}
.hmsg b{color:var(--gold);font-weight:700}
.hmsg.sys{color:#9fb4b8;font-size:12px;font-style:italic}
.hmsg.tbl{color:#d8c7a0;font-size:12.5px;background:rgba(216,178,106,.1);
  border:1px solid rgba(216,178,106,.28);border-radius:8px;padding:5px 8px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hempty{font-size:12.5px;color:#7f9296;padding:6px 2px}
/* сноска под таблицей итога: откуда взялось число */
.calc{margin-top:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;
  background:rgba(255,255,255,.03);font-size:12.5px;line-height:1.5;color:#c9d3d4}
.calc div+div{margin-top:3px}
.calc b{color:var(--gold);font-weight:700}
.sub.build{opacity:.45;font-size:11px;margin-top:4px}
/* подвал главного экрана: штамп сборки и маленькая кнопка поддержки */
.foot{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.foot .sub.build{margin:0}
.donate{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
  border:1px solid rgba(216,178,106,.4);color:var(--gold);font-size:11.5px;text-decoration:none;
  opacity:.75;transition:opacity .15s,background .15s}
.donate:hover{opacity:1;background:rgba(216,178,106,.12)}
/* последняя взятка в боковой панели: чем ходили, кто забрал, сколько это стоило */
.ltr{border:1px solid var(--line);border-radius:12px;padding:9px 10px;
  background:rgba(255,255,255,.03)}
.ltr.empty{font-size:12.5px;color:#7f9296;padding:8px 10px}
.ltcards{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.ltc{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.ltc .card{width:46px}
.ltc span{font-size:10.5px;color:#8ea3a7;max-width:52px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ltc.win .card{border-color:var(--gold);box-shadow:0 0 0 2px rgba(216,178,106,.55),0 2px 6px rgba(0,0,0,.45)}
.ltc.win span{color:var(--gold);font-weight:700}
.ltwho{margin-top:8px;text-align:center;font-size:12.5px;color:#c9d3d4}
.ltwho b{color:var(--gold)}
.ltwho i{font-style:normal;color:#8ea3a7;font-size:11.5px}
/* комбинации на столе: кто что заявил и что открыл */
.cmb+.cmb{margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,.08)}
.cmbhead{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-bottom:5px}
.cmbhead .who{font-weight:700;color:#e7dcc4;font-size:13px}
.cmbhead .who.you{color:var(--gold)}
.cmbhead .k{font-size:11.5px;color:#8ea3a7}
.cmbcards{display:flex;gap:4px;flex-wrap:wrap}
.cmbcards .card{width:40px}
.cmbhead .pt{margin-left:auto;color:var(--gold);font-weight:700;font-size:13px}
.cmb.talkrec{font-size:12.5px;color:#c3ced0}
.cmb.talkrec .tl{padding:2px 0;line-height:1.55}
.cmb.talkrec .sep{font-style:normal;color:#6c7b7e;padding:0 5px}
.cmb.talkrec .who{font-weight:700;color:#d8c7a0}
.cmb.talkrec .who.you{color:var(--gold)}
.cmb.said{font-size:12px;color:#8ea3a7}
.cmb.said .who{font-weight:700;color:#c6cfd0}
/* подарок за доигранную партию — новый портрет */
.gift{display:flex;align-items:center;gap:12px;margin:12px 0 4px;padding:10px 12px;
  border:1px solid rgba(216,178,106,.45);border-radius:12px;background:rgba(216,178,106,.09)}
.gift b{color:var(--gold);font-size:15px}
.gift .sub{margin:0}
/* секрет открыт — рамка теплее подарочной */
/* Выбитые достижения — карточками, а не строчкой со счётом: человек
   хочет видеть, ЧТО он выбил, а не только сколько. Тир читается кольцом
   у портрета — теми же токенами, что и в сетке портретов. */
.achlist{max-height:320px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:6px 0}
/* ВСЁ про карточку списка — только внутри списка. Голый `.ach` лез на
   чужую карточку: в итогах партии секрет показывается блоком
   `.gift.ach`, у него своя раскладка (флекс с крупным портретом), а
   сетка «34 пикселя под портрет плюс текст» накрывала текст портретом.
   В клаборе это было видно, в преферансе — нет, и только потому, что
   там `.gift` описан НИЖЕ и перебивал. Одинаковая специфичность,
   разный порядок строк: так не чинят, так везёт. */
.achlist .ach{display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto;gap:1px 8px;
  align-items:center;padding:6px;border:1px solid var(--line);border-radius:9px;
  background:rgba(216,178,106,.07)}
.achlist .ach .aface{grid-row:1/3;width:34px;height:34px;border-radius:50%;overflow:hidden}
.achlist .ach .aface img,.achlist .ach .aface .ava{width:100%;height:100%;object-fit:cover}
.achlist .ach b{font-size:13px;color:var(--gold)}
.achlist .ach .ahow{font-size:11px;opacity:.7;line-height:1.3}
.achlist .ach.rare .aface{box-shadow:0 0 0 2px var(--rare)}
.achlist .ach.gold{border-color:rgba(217,164,65,.45);background:rgba(217,164,65,.1)}
.achlist .ach.gold .aface{box-shadow:0 0 0 2px var(--legend),0 0 10px rgba(217,164,65,.45)}
.gift.ach{border-color:rgba(216,178,106,.75);background:rgba(216,178,106,.14)}
/* пустая клетка с вопросиком в сетке портретов */
.facerow .fc.q{display:grid;place-items:center;border:1px dashed rgba(216,178,106,.5);
  border-radius:50%;aspect-ratio:1;cursor:pointer;color:var(--gold);background:rgba(216,178,106,.06)}
.facerow .fc.q span{font:700 22px/1 "PT Serif",Georgia,serif;opacity:.8}
.facerow .fc.q:hover{background:rgba(216,178,106,.16)}
/* редкий портрет — синий ободок: сразу видно, что он за секрет */
.facerow .fc.rare .ava{box-shadow:0 0 0 2px var(--rare)}
.facerow .fc.rare:hover{border-color:rgba(90,166,224,.55)}
.facerow .fc.rare.on{border-color:var(--rare);box-shadow:0 0 0 3px rgba(90,166,224,.25)}
/* золотые — легенды: то же кольцо, но тёплое и с ореолом, чтобы в ряду
   аватаров они читались отдельным тиром, а не «ещё одним редким» */
.facerow .fc.gold .ava{box-shadow:0 0 0 2px var(--legend),0 0 10px rgba(217,164,65,.45)}
.facerow .fc.gold:hover{border-color:rgba(217,164,65,.6)}
.facerow .fc.gold.on{border-color:var(--legend);box-shadow:0 0 0 3px rgba(217,164,65,.3)}

.hsay{display:flex;gap:7px;flex:0 0 auto}
.hsay .fld{flex:1;margin:0}
/* Комната должна быть сбоку как можно дольше: на itch игра живёт в рамке,
   и на 800–1000 px она раньше сваливалась вниз — со стороны это выглядело так,
   будто чат пропал. Две колонки держим до 720 px, ниже — комната под меню,
   но развёрнутая; свернуть её можно кнопкой, сама она не прячется. */
@media (max-width:1000px){
  .mainwrap{grid-template-columns:minmax(0,1fr) minmax(0,280px);gap:12px}
  .mcol{max-width:400px}
}
@media (max-width:720px){
  #splash .dlg.hallwide{max-width:520px}
  .mainwrap{grid-template-columns:1fr}
  .mcol{max-width:none}
  .hallcol{height:min(46vh,360px)}
  .hfold{display:inline-grid}
  .hallcol.folded{height:auto}
  .hallcol.folded .htabs,.hallcol.folded .hpeople,.hallcol.folded .hlog,.hallcol.folded .hsay{display:none}
}

#splash .cards{display:flex;justify-content:center;margin:2px 0 16px;height:86px;transform:translateX(-11px)}
.nav{display:flex;align-items:center;gap:8px;margin:-4px -4px 8px}
.nav .navt{flex:1;text-align:center;font:700 20px/1.2 "PT Serif",Georgia,serif;color:var(--gold)}
#splash .nav .navt{font-size:26px;letter-spacing:.05em}
.navb{width:34px;height:34px;flex:0 0 auto;border-radius:9px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);font-size:20px;line-height:1;color:#e7dcc4;display:grid;place-items:center}
.navb:hover{background:rgba(216,178,106,.2);border-color:var(--gold)}
.navb.ghost{border:0;background:none;pointer-events:none}
/* голую стрелочку игроки не замечали — пишем словом */
.navb.word{width:auto;padding:0 13px;font-size:16px;display:inline-flex;align-items:center;
  gap:7px;white-space:nowrap}
.navb.word span{font:600 13px/1 "Manrope",system-ui,sans-serif;letter-spacing:.02em}
@media (max-width:520px){ .navb.word span{display:none} .navb.word{width:34px;padding:0;justify-content:center} }
.menu{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.menu .btn{width:100%;padding:13px 16px;font-size:15px}
/* портретов много — сетка выбора прокручивается, а не растёт вниз без края */
.facerow{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:9px;padding:4px 0 6px;max-height:262px;overflow-y:auto}
.facerow .fc{aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;
  display:grid;place-items:center;transition:.14s}

<script>
/* ============================================================
   КЛАБОР (ДЕБЕРЦ) — ядро правил
   Источник: malefictum.wordpress.com/2018/02/26/klabor/
   Места, где источник молчит, помечены TRAKT и собраны в K.TRAKT
   ============================================================ */
var K = (function () {
  'use strict';

  var SUITS = ['S', 'H', 'C', 'D'];
  var SUIT_NAME = { S: 'пики', H: 'черви', C: 'трефы', D: 'бубны' };
  var SUIT_ONE = { S: 'пика', H: 'черва', C: 'трефа', D: 'бубна' };
  var SUIT_CH = { S: '♠', H: '♥', C: '♣', D: '♦' };
  var RED = { H: 1, D: 1 };
  var RANKS = ['7', '8', '9', '10', 'J', 'Q', 'K', 'A'];
  var RANK_RU = { '7': '7', '8': '8', '9': '9', '10': '10', J: 'В', Q: 'Д', K: 'К', A: 'Т' };
  var RANK_WORD = { '7': 'семёрка', '8': 'восьмёрка', '9': 'девятка', '10': 'десятка', J: 'валет', Q: 'дама', K: 'король', A: 'туз' };
  var RANK_FROM = { '7': 'семёрки', '8': 'восьмёрки', '9': 'девятки', '10': 'десятки', J: 'валета', Q: 'дамы', K: 'короля', A: 'туза' };

  // «обычный» порядок для комбинаций: 7 8 9 10 В Д К Т
  var SEQ = { '7': 0, '8': 1, '9': 2, '10': 3, J: 4, Q: 5, K: 6, A: 7 };

  // старшинство в простой масти: Т 10 К Д В 9 8 7
  var ORD_PLAIN = { A: 7, '10': 6, K: 5, Q: 4, J: 3, '9': 2, '8': 1, '7': 0 };
  // старшинство в козыре: В 9 Т 10 К Д 8 7
  var ORD_TRUMP = { J: 7, '9': 6, A: 5, '10': 4, K: 3, Q: 2, '8': 1, '7': 0 };

  // стоимость карт
  var VAL_PLAIN = { A: 11, '10': 10, K: 4, Q: 3, J: 2, '9': 0, '8': 0, '7': 0 };
  var VAL_TRUMP = { J: 20, '9': 14, A: 11, '10': 10, K: 4, Q: 3, '8': 0, '7': 0 };

  var TERZ = 20, POLT = 50, BELLA = 20, POSLED = 10, SHTRAF = 100;

  function id(c) { return c.r + c.s; }
  function parse(s) { return { r: s.length === 3 ? '10' : s[0], s: s[s.length - 1] }; }
  function name(c) { return RANK_RU[c.r] + SUIT_CH[c.s]; }
  function isRed(c) { return !!RED[c.s]; }

  function deck() {
    var d = [];
    for (var i = 0; i < SUITS.length; i++)
      for (var j = 0; j < RANKS.length; j++) d.push({ r: RANKS[j], s: SUITS[i] });
    return d;
  }

  function shuffle(a, rnd) {
    rnd = rnd || Math.random;
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function ord(c, trump) { return c.s === trump ? ORD_TRUMP[c.r] : ORD_PLAIN[c.r]; }
  function val(c, trump) { return c.s === trump ? VAL_TRUMP[c.r] : VAL_PLAIN[c.r]; }

  /* -------- кто забрал взятку --------
     plays: [{p:индекс игрока, c:карта}] в порядке хода */
  function trickWinner(plays, trump) {
    var lead = plays[0].c.s;
    var best = 0;
    for (var i = 1; i < plays.length; i++) {
      var c = plays[i].c, b = plays[best].c;
      var cT = c.s === trump, bT = b.s === trump;
      if (cT && !bT) { best = i; continue; }
      if (!cT && bT) continue;
      if (cT && bT) { if (ORD_TRUMP[c.r] > ORD_TRUMP[b.r]) best = i; continue; }
      // обе некозырные: чужая масть не бьёт масть захода
      if (c.s === lead && b.s === lead) { if (ORD_PLAIN[c.r] > ORD_PLAIN[b.r]) best = i; }
    }

    var c = charOf(botChar);
    tick++;
    var seat = (ctx && ctx.seat != null) ? ctx.seat : 0;
    var mine = !!(ctx && ctx.mine);
    if (!force) {
      var lvl = (ctx && ctx.lvl) || 2;
      var pr = c.p * (lvl === 1 ? 1.2 : lvl === 3 ? 0.72 : 1);
      // байку рассказывают охотно даже молчуны — иначе за столом тихо
      if (ctx && ctx.joke) pr = Math.max(pr, 0.85);
      // свой игрок говорит охотнее: у него одно место, и это его голос за столом
      if (mine) pr = Math.min(0.95, pr * 1.6);
      if (Math.random() > pr) return null;
      if (lastAt[seat] && tick - lastAt[seat] < (mine ? 3 : 4)) return null;   // не тараторить
      if (!mine && lastAt.any && tick - lastAt.any < 2) return null;           // не хором
    }
    var s = pick(list, botChar, null, key, ctx && ctx.sex, ctx && ctx.tsex,
      ctx && ctx.tags);
    /* Реплики на эту карту не нашлось — молчим, и слот разговора при
       этом не тратим: иначе один промах затыкал бы игрока на две-три
       ситуации вперёд. */
    if (!s) return null;
    lastAt[seat] = tick; lastAt.any = tick;
    if (ctx && ctx.suit) s = s.replace('{м}', K.SUIT_NAME[ctx.suit] + ' ' + K.SUIT_CH[ctx.suit]);
    return s;
  }

  function reset() { lastAt = {}; tick = 0; used = {}; }
  function count() {
    var n = 0; for (var k in L) n += L[k].length; return n;
  }

  return {
    say: say, pick: pick, CHARS: CHARS, L: L, reset: reset,
    count: count, charOf: charOf, fitSex: fitSex,
    cardTags: cardTags, fitTag: fitTag
  };
})();

/* ============================================================
   КЛАБОР — движок партии
   Движок ничего не знает про DOM. Он выставляет engine.pending —
   от кого сейчас ждём решение — и складывает события в engine.ev,
   которые интерфейс проигрывает анимацией.
   ============================================================ */
var Engine = (function () {
  'use strict';

  var DEF = {
    players: 3,          // 3 | 2 | 4
    pairs: false,        // вчетвером напару
    target: 501,         // 501 | 1001
    terz: 20, polt: 50,
    strogach: false,     // белла только если объявивший взял обе карты
    bellaAny: false,     // турнирная белла: назвать можно любой из двух карт (по умолчанию одесская — только первой)
    freeTrakt: false,    // напару: не козырять, когда взятку держит напарник (белотовское правило)
    redeal4sevens: true, // пересдача при четырёх семёрках
    redealLow: 0,        // 0 — выкл, иначе порог очков на руках (13 или 2)
    klabor: false,       // комбинация «клабор» — мгновенная победа
    autoBella: true,
    obyaz: true,         /* обяз: на своей раздаче во втором круге сдающий пасовать
                            не может. По умолчанию включён — иначе вечер уходит
                            на пересдачи: карта у всех средняя, брать никто не хочет,
                            и колода ходит по кругу. */
    swap7: false,        // обмен козырной семёрки на открытый козырь (только до прикупа)
    odessa: true,        // одесский клабор: комбинации заявляют первой картой, а не после торга
    match2: false        // напару: матч из двух раундов по 501 и четыре финальные раздачи
  };

  function Game(opts) {
    this.o = {};
    for (var k in DEF) this.o[k] = (opts && k in opts) ? opts[k] : DEF[k];
    this.N = this.o.players;
    this.names = (opts && opts.names) || ['Вы', 'Бот 1', 'Бот 2', 'Бот 3'].slice(0, this.N);
    this.human = (opts && 'human' in opts) ? opts.human : 0;   // -1 — все боты
    this.rnd = (opts && opts.rnd) || Math.random;
    this.sex = (opts && opts.sex) || [];
    this.score = []; this.beits = [];
    for (var i = 0; i < this.N; i++) { this.score.push(0); this.beits.push(0); }
    this.dealer = Math.floor(this.rnd() * this.N);
    this.hangCarry = null;         // висяк: перенос очков
    this.hangForce = null;         // висяк: кто обязан играть
    this.over = false; this.winner = -1;
    this.round = 1; this.roundWins = [0, 0]; this.obyazSide = -1; this.finalLeft = 0;
    /* Чем кончился каждый сыгранный раунд. Ник: «когда заканчивается
       любой раунд, нигде не виден счёт прошлого — он обнуляется и
       пропадает». Табло и правда обнуляется, и единственным следом
       раунда оставалась строка в журнале, которую надо было ещё найти.
       Теперь итог раунда остаётся числами, и его можно развернуть. */
    this.roundLog = [];
    this.handsPlayed = 0;   // сыгранных до конца раздач (пересдачи не в счёт)
    this.handNo = 0;
    this.ev = [];
    this.log = [];
    this.pending = null;
  }

  Game.prototype.team = function (i) { return this.o.pairs ? (i % 2) : i; };
  Game.prototype.mates = function (i) {
    if (!this.o.pairs) return [i];
    return [i, (i + 2) % 4];
  };

  // «Вы берёте» вместо «Вы берёт»
  Game.prototype.W = function (p, v3, v2) {
    return (p === this.human) ? ('Вы ' + v2) : (this.names[p] + ' ' + v3);
  };
  // то же, но с родом: Циля набралА, Сеня набралЪ
  Game.prototype.W3 = function (p, m, f, v2) {
    if (p === this.human) return 'Вы ' + v2;
    return this.names[p] + ' ' + ((this.sex && this.sex[p] === 'f') ? f : m);
  };
  Game.prototype.say = function (txt, cls) {
    this.log.push({ t: txt, c: cls || '' });
    this.ev.push({ e: 'log', t: txt, c: cls || '' });
  };
  Game.prototype.push = function (o) { this.ev.push(o); };

  /* ---------------- раздача ---------------- */
  Game.prototype.newHand = function () {
    var N = this.N, i;
    this.handNo++;
    var d = K.shuffle(K.deck(), this.rnd);
    this.hands = []; for (i = 0; i < N; i++) this.hands.push([]);
    var p = 0;
    // по две карты по кругу, начиная слева от сдающего, пока не станет по 6
    for (var round = 0; round < 3; round++)
      for (var k = 0; k < N; k++) {
        var who = (this.dealer + 1 + k) % N;
        this.hands[who].push(d[p++], d[p++]);
      }
    this.first6 = this.hands.map(function (h) { return h.slice(); });
    // потенциальный козырь: втроём и вдвоём — следующая карта, вчетвером — последняя
    // карта колоды, она же второй прикуп сдающего
    if (N === 4) { this.rest = d.slice(p); this.upCard = this.rest[this.rest.length - 1]; }
    else { this.upCard = d[p++]; this.rest = d.slice(p); }
    this.trump = null; this.declarer = -1;
    this.declRound = 0; this.declForced = false; this.tieInfo = null;
    this.freza = null; this.swapped7 = -1;
    this.combos = null; this.comboWinner = -1; this.comboPts = 0;
    this.cLive = false; this.cSaid = []; this.cShown = false;
    /* Спор о комбинациях чистится ТУТ, а не в начале своей фазы.

       Ник, со скриншота: идёт торг за козырь, а в боковой панели уже
       написано «Комбинации — заявили: Тася». Заявить их в этот момент
       нельзя: в одесском клаборе комбинацию называют первой картой, то
       есть уже в розыгрыше. Панель показывала `cDecl` — а он обнулялся
       только когда доходило до самой фазы комбинаций. До тех пор в нём
       лежали заявки ПРОШЛОЙ раздачи, и панель честно их показывала. */
    this.cSeat = 0; this.cLeader = -1; this.cTie = null; this.cDecl = [];
    this.bella = { holder: -1, announced: false, played: 0, trick: -1, taker: -1 };
    this.tricks = []; this.cur = [];
    this.taken = []; this.pts = [];
    for (i = 0; i < N; i++) { this.taken.push(0); this.pts.push(0); }
    this.lastTrickBy = -1;
    this.bidRound = 1; this.bidSeat = 0; this.passes = 0; this.bidLog = [];
    this.sortHands();

    this.push({ e: 'deal', dealer: this.dealer, up: this.upCard });
    this.say(this.W(this.dealer, 'сдаёт', 'сдаёте') + '. Открыта ' + K.name(this.upCard) + ' — потенциальный козырь.', 'sys');

    /* ---------- висяк: торга нет ----------

       Ник: «при висяке НЕТ фазы торговли; игроки остаются те же».
       Торг и не спрашивается — играющий назначается прежний, тот, кто
       брал слово в повисшей раздаче. А козырь остаётся случайным: им,
       как и в обычной раздаче первого круга, становится масть свежей
       открытой карты. (День назад мы было сделали козырь тоже прежним —
       Ник поправил: масть вскрывается заново.) */
    if (this.hangForce != null) {
      this.trump = this.upCard.s;
      this.declarer = this.hangForce;
      this.say('Висяк: торга нет. Козырь по открытой карте — ' +
        K.SUIT_NAME[this.trump] + ' ' + K.SUIT_CH[this.trump] +
        ', играет прежний играющий, ' + this.names[this.declarer] +
        '. Терцы и полтинники не объявляются.', 'sys');
      this.afterTrump();
      return;
    }
    this.askBid();
  };

  Game.prototype.sortHands = function () {
    var t = this.trump, self = this;
    var so = ['S', 'H', 'C', 'D'];
    for (var i = 0; i < this.N; i++)
      this.hands[i].sort(function (a, b) {
        var as = so.indexOf(a.s), bs = so.indexOf(b.s);
        if (t) { if (a.s === t) as = -1; if (b.s === t) bs = -1; }
        if (as !== bs) return as - bs;
        return K.SEQ[b.r] - K.SEQ[a.r];
      });
  };

  /* ---------------- торг за козырь ---------------- */
  Game.prototype.bidder = function () { return (this.dealer + 1 + this.bidSeat) % this.N; };

  Game.prototype.askBid = function () {
    var p = this.bidder();
    var opts;
    this.bidForced = false;
    if (this.bidRound === 1) opts = { take: this.upCard.s, pass: true };
    else {
      var suits = K.SUITS.filter(function (s) { return s !== this.upCard.s; }, this);
      opts = { name: suits, pass: true };
    }
    // обяз: последний в круге не может пасовать
    if (this.bidRound === 2) {
      var forced = (this.o.obyaz && this.bidSeat === this.N - 1);
      // «обяз» команды-победителя раунда: на своих раздачах спасовать нельзя
      if (this.obyazSide >= 0 && this.sideOf(p) === this.obyazSide && this.sideOf(this.dealer) === this.obyazSide) {
        var lastOfSide = true;
        for (var q = this.bidSeat + 1; q < this.N; q++)
          if (this.sideOf((this.dealer + 1 + q) % this.N) === this.obyazSide) lastOfSide = false;
        if (lastOfSide) forced = true;
      }
      if (forced) { opts.pass = false; this.bidForced = true; }
    }
    this.pending = { type: 'bid', p: p, round: this.bidRound, opts: opts };
  };

  Game.prototype.doBid = function (act) {
    var p = this.bidder();
    if (act.pass) {
      this.say(this.names[p] + ': пас.');
      this.push({ e: 'bid', p: p, pass: true });
      this.bidLog.push({ p: p, pass: true, round: this.bidRound });
      this.bidSeat++; this.passes++;
      if (this.bidSeat < this.N) return this.askBid();
      this.bidSeat = 0;
      if (this.bidRound === 1) {
        this.bidRound = 2;
        this.say('Круг пасов. Второй круг — можно назвать любую другую масть.', 'sys');
        return this.askBid();
      }
      // полные пасы — пересдача
      this.say('Полные пасы. Пересдача, сдаёт следующий.', 'sys');
      this.dealer = (this.dealer + 1) % this.N;
      this.push({ e: 'redeal', why: 'пасы' });
      this.handNo--;                 // пересдача не считается раздачей
      return this.newHand();
    }
    this.trump = act.suit;
    this.declarer = p;
    this.declRound = this.bidRound;                 // 1 — взял козырь, 2 — назвал масть
    this.declForced = (this.bidRound === 2 && !!this.bidForced);  // «последнее слово»
    this.say(this.W(p, this.bidRound === 1 ? 'берёт козырь' : 'назначает козырь',
      this.bidRound === 1 ? 'берёте козырь' : 'назначаете козырь') +
      ' ' + K.SUIT_NAME[this.trump] + ' ' + K.SUIT_CH[this.trump] + '.', 'hi');
    this.bidLog.push({ p: p, suit: this.trump, round: this.bidRound });
    this.push({ e: 'trump', p: p, suit: this.trump, round: this.bidRound, forced: !!this.declForced });
    this.afterTrump();
  };

  /* ---------------- обмен козырной семёрки, прикуп, фреза ----------------
     По уточнению Ника обмен разыгрывается ТОЛЬКО сданными шестью картами,
     до того как поднят прикуп, и только если правило включено в настройках. */
  Game.prototype.afterTrump = function () {
    if (this.o.swap7 && this.upCard && this.upCard.s === this.trump) {
      this.swapSeat = 0; this.swapped7 = -1;
      return this.askSwap7();
    }
    return this.dealPrikup();
  };

  Game.prototype.canSwap7 = function (i) {
    if (!this.upCard || this.upCard.s !== this.trump) return false;
    if (this.swapped7 >= 0) return false;
    for (var k = 0; k < this.hands[i].length; k++)
      if (this.hands[i][k].s === this.trump && this.hands[i][k].r === '7') return true;
    return false;
  };

  Game.prototype.askSwap7 = function () {
    while (this.swapSeat < this.N) {
      var p = (this.dealer + 1 + this.swapSeat) % this.N;
      if (this.canSwap7(p)) { this.pending = { type: 'swap7', p: p }; return; }
      this.swapSeat++;
    }
    this.dealPrikup();
  };

  Game.prototype.doSwap7 = function (yes) {
    var p = this.pending.p;
    if (yes) {
      var got = this.upCard;
      for (var k = 0; k < this.hands[p].length; k++)
        if (this.hands[p][k].s === this.trump && this.hands[p][k].r === '7') {
          var old = this.hands[p][k];
          this.hands[p][k] = this.upCard;
          this.upCard = old;
          this.swapped7 = p;
          break;
        }
      this.sortHands();
      this.say(this.W(p, 'меняет', 'меняете') + ' козырную семёрку на ' + K.name(got) + '.', 'hi');
      this.push({ e: 'swap7', p: p, up: this.upCard, got: got });
    }
    this.swapSeat++;
    this.askSwap7();
  };

  Game.prototype.dealPrikup = function () {
    var per = (this.N === 4) ? 2 : 3, i, k;
    for (k = 0; k < per; k++)
      for (i = 0; i < this.N; i++) {
        var who = (this.dealer + 1 + i) % this.N;
        this.hands[who].push(this.rest.shift());
      }
    if (this.N === 4) {
      this.upCard = null;   // ушла сдающему последней прикупной картой
    } else if (this.N === 3) {
      this.freza = this.rest.pop() || null;   // нижняя карта остатка, лежит открытой
    }                                         // вдвоём остаток в прикупе и не открывается
    this.sortHands();
    this.push({ e: 'prikup', freza: this.freza });
    if (this.freza) this.say('Прикуп роздан. Фреза: ' + K.name(this.freza) + ' (только для сведения).');
    else this.say('Прикуп роздан.');

    // пересдача: четыре семёрки
    if (this.o.redeal4sevens) {
      for (i = 0; i < this.N; i++) if (K.countSevens(this.hands[i]) === 4) {
        this.say(this.W(i, 'предъявляет', 'предъявляете') + ' четыре семёрки — пересдача.', 'sys');
        this.dealer = (this.dealer + 1) % this.N;
        this.push({ e: 'redeal', why: 'четыре семёрки' });
        this.handNo--;
        return this.newHand();
      }
    }
    if (this.o.redealLow) {
      for (i = 0; i < this.N; i++) if (K.handPointsPlain(this.hands[i]) <= this.o.redealLow) {
        this.say(this.W(i, 'пересдаёт', 'пересдаёте') + ': на руках ' + K.handPointsPlain(this.hands[i]) + ' очков.', 'sys');
        this.dealer = (this.dealer + 1) % this.N;
        this.push({ e: 'redeal', why: 'мало очков' });
        this.handNo--;
        return this.newHand();
      }
    }
    this.startCombos();
  };

  /* ---------------- заявка комбинаций ----------------
     Порядок как за столом: сначала называют вид («терц», «полтина»),
     равный вид — спрашивают рост, старший говорит «не идёт».
     Два равных некозырных терца — комбинацию запишет тот, кто возьмёт послед. */
  function kindRank(c) { return c.kind === 'P' ? 2 : 1; }

  Game.prototype.startCombos = function () {
    var i;
    this.combos = [];
    for (i = 0; i < this.N; i++) this.combos.push(K.findCombos(this.hands[i], this.trump));
    for (i = 0; i < this.N; i++) if (K.hasBella(this.hands[i], this.trump)) this.bella.holder = i;

    if (this.o.klabor) {                       // 6 подряд от туза — партия сразу
      for (i = 0; i < this.N; i++) {
        var kl = K.hasKlabor(this.hands[i]);
        if (kl) {
          this.say(this.W(i, 'объявляет', 'объявляете') + ' КЛАБОР ' + K.SUIT_CH[kl] + ' — партия выиграна!', 'big');
          this.over = true; this.winner = i; this.pending = null;
          this.push({ e: 'klabor', p: i, suit: kl });
          return;
        }
      }
    }
    if (this.hangForce != null) {              // висяк — комбинации не объявляются
      this.comboWinner = -1; this.comboPts = 0; this.cTie = null;
      this.cLive = false; this.cSaid = []; this.cShown = true;
      return this.startPlay();
    }
    this.cSeat = 0; this.cLeader = -1; this.cTie = null; this.cDecl = [];

    /* Одесский клабор: слова после торга нет. Каждый называет вид комбинации
       в свой первый ход, кладя первую карту; старшинство выясняется, когда
       первая взятка собрана, а карты старший показывает после второй. */
    if (this.o.odessa) {
      this.cLive = true; this.cSaid = []; this.cShown = false;
      return this.startPlay();
    }
    this.cLive = false;
    this.askCombo();
  };

  /* Старший ВИД, уже названный своей стороной (side=true) или соперниками
     (side=false). Это открытая информация: вид звучит вслух, и по ней за
     столом решают, стоит ли раскрывать свою комбинацию. Полтина бьёт терц,
     поэтому после ЧУЖОЙ полтины терц не запишется никогда — молчать дешевле,
     чем дарить сопернику кусок расклада. А после полтины НАПАРНИКА терц,
     наоборот, объявляют: у стороны очки общие. */
  Game.prototype.saidKind = function (p, side) {
    var best = null, self = this;
    this.cDecl.forEach(function (q) {
      var same = self.o.pairs ? (self.sideOf(q) === self.sideOf(p)) : (q === p);
      if (same !== side) return;
      var k = self.combos[q][0].kind;
      if (k === 'P') best = 'P'; else if (!best) best = 'T';
    });
    return best;
  };

  Game.prototype.corder = function (k) { return (this.dealer + 1 + k) % this.N; };
  Game.prototype.kindWord = function (c) { return c.kind === 'P' ? 'полтина' : 'терц'; };

  Game.prototype.askCombo = function () {
    while (this.cSeat < this.N) {
      var p = this.corder(this.cSeat);
      var mine = this.combos[p][0];
      if (!mine) { this.say(this.names[p] + ': пас.'); this.push({ e: 'combo', p: p, declare: false }); this.cSeat++; continue; }
      if (this.cLeader < 0) { this.pending = { type: 'combo', mode: 'declare', p: p, mine: mine }; return; }
      var lead = this.combos[this.cLeader][0];
      // напару комбинации идут в общий зачёт: с напарником не спорят, ему докладывают
      if (this.o.pairs && this.sideOf(p) === this.sideOf(this.cLeader)) {
        this.pending = { type: 'combo', mode: 'declare', p: p, mine: mine, team: this.cLeader };
        return;
      }
      if (kindRank(mine) < kindRank(lead)) {   // после полтины терцы не объявляют
        this.say(this.names[p] + ': пас.'); this.push({ e: 'combo', p: p, declare: false });
        this.cSeat++; continue;
      }
      if (kindRank(mine) > kindRank(lead)) { this.pending = { type: 'combo', mode: 'declare', p: p, mine: mine, over: true }; return; }
      this.pending = { type: 'combo', mode: 'ask', p: p, mine: mine, lead: { kind: lead.kind }, from: this.cLeader };
      return;
    }
    this.resolveCombos();
  };

  Game.prototype.doCombo = function (a) {
    var pd = this.pending, p = pd.p, mine = pd.mine;

    // одесский вариант: называют только вид, без роста и масти
    if (pd.mode === 'say') {
      if (a.declare) {
        var word = this.comboWords(p);
        this.say(this.names[p] + ': ' + word + '.', 'hi');
        // слово едет вместе с событием: за столом должно быть видно «терц»,
        // «полтина», «два терца» — а не служебное «есть»
        this.push({ e: 'combo', p: p, declare: true, kind: this.combos[p][0].kind,
          word: word, live: true });
        this.cDecl.push(p);
      } else {
        // комбинация бита ещё до показа: соперник назвал старший вид,
        // и своей стороне крыть нечем. Сидеть с таким терцом — отдельный жанр
        var rk = function (x) { return x === 'P' ? 2 : x === 'T' ? 1 : 0; };
        var dead = rk(pd.foe) > Math.max(rk(mine.kind), rk(pd.mate));
        this.say(this.names[p] + ': пас.');
        this.push({ e: 'combo', p: p, declare: false, dead: dead });
      }
      return this.askPlay();
    }

    // ответ в разборе старшинства: он вынужденный, врать нельзя
    if (pd.mode === 'grow' || pd.mode === 'trumpq') {
      if (pd.mode === 'grow') {
        this.say(this.names[p] + ': до ' + this.growWord(mine) + '.');
        this.push({ e: 'comboSay2', p: p, what: 'grow', top: mine.top });
        if (this.cQ) this.cQ.step = 'grow2';
      } else {
        this.say(this.names[p] + ': ' + (mine.trump ? 'козырной' : 'простой') + '.');
        this.push({ e: 'comboSay2', p: p, what: 'trump', trump: !!mine.trump });
        if (this.cQ) this.cQ.step = 'trump2';
      }
      return this.liveStep();
    }

    if (pd.mode === 'declare') {
      if (!a.declare) { this.say(this.names[p] + ': пас.'); this.push({ e: 'combo', p: p, declare: false }); }
      else {
        var l = this.combos[p];
        var tail = pd.over ? ' — старше' : (pd.team != null ? ' — в общий зачёт команды' : '');
        var word2 = this.comboWords(p);
        this.say(this.names[p] + ': ' + word2 + tail + '.', 'hi');
        this.push({ e: 'combo', p: p, declare: true, kind: l[0].kind, word: word2,
          team: pd.team != null });
        this.cDecl.push(p);
        // за команду говорит её старшая комбинация — с ней и будут спорить соперники
        if (pd.team == null || K.cmpCombo(mine, this.combos[this.cLeader][0]) > 0) {
          this.cLeader = p;
          if (pd.team == null) this.cTie = null;
        }
      }
      this.cSeat++; return this.askCombo();
    }

    if (pd.mode === 'ask') {
      if (!a.ask) {
        this.say(this.names[p] + ': твой.');
        this.push({ e: 'combo', p: p, declare: false, yield: true });
        this.cSeat++; return this.askCombo();
      }
      var lead = this.combos[this.cLeader][0];
      this.say(this.names[p] + ': рост?');
      this.say(this.names[this.cLeader] + ': от ' + K.RANK_FROM[K.RANKS[lead.top]] + '.');
      this.push({ e: 'combo-ask', p: p, from: this.cLeader, top: lead.top });
      this.pending = { type: 'combo', mode: 'beat', p: p, mine: mine, lead: lead, from: this.cLeader };
      return;
    }

    // mode === 'beat'
    var lead2 = this.combos[this.cLeader][0];
    var c = K.cmpCombo(mine, lead2);
    if (!a.beat || c < 0) {
      this.say(this.names[p] + ': твой.');
      this.push({ e: 'combo', p: p, declare: false, yield: true });
    } else if (c > 0) {
      this.say(this.names[p] + ': не идёт — от ' + K.RANK_FROM[K.RANKS[mine.top]] + '.', 'hi');
      this.push({ e: 'combo', p: p, declare: true, beat: true, kind: mine.kind });
      this.cDecl.push(p);
      this.cLeader = p; this.cTie = null;
    } else {
      this.say(this.names[p] + ': не идёт, ровно от ' + K.RANK_FROM[K.RANKS[mine.top]] +
        '. Комбинацию запишет тот, кто возьмёт послед.', 'hi');
      this.push({ e: 'combo', p: p, declare: true, tie: true });
      this.cDecl.push(p);
      this.cTie = [this.cLeader, p];
    }
    this.cSeat++; return this.askCombo();
  };

  // «полтина и 2 терца» — как это звучит за столом
  Game.prototype.comboWords = function (p) {
    var n = { T: 0, P: 0 }, w = [];
    this.combos[p].forEach(function (c) { n[c.kind]++; });
    if (n.P) w.push(n.P > 1 ? n.P + ' полтины' : 'полтина');
    if (n.T) w.push(n.T > 1 ? n.T + ' терца' : 'терц');
    return w.join(' и ');
  };

  Game.prototype.comboSumOf = function (p) {
    var s = 0, o = this.o;
    this.combos[p].forEach(function (c) { s += (c.kind === 'P' ? o.polt : o.terz); });
    return s;
  };

  // напару в зачёт идут комбинации обоих напарников — те, что они заявили
  Game.prototype.comboSideSum = function (p) {
    if (!this.o.pairs) return this.comboSumOf(p);
    var side = this.sideOf(p), s = 0, self = this;
    (this.cDecl || []).forEach(function (q) { if (self.sideOf(q) === side) s += self.comboSumOf(q); });
    return s;
  };

  // список тех, чьи комбинации пошли в зачёт (для журнала и окна итогов)
  Game.prototype.comboSideList = function (p) {
    if (!this.o.pairs) return [p];
    var side = this.sideOf(p), self = this;
    return (this.cDecl || []).filter(function (q) { return self.sideOf(q) === side; });
  };

  /* ===== Одесский вариант, шаг второй: разбор старшинства =====
     Первая взятка собрана, карты ещё лежат на столе — и начинается короткий
     ритуал. Он не молчаливый и не мгновенный: спросили рост — стол ждёт,
     пока спрошенный ответит. Поэтому разбор идёт через pending, как торг:
     тот, кого спросили, обязан сказать, и игра на это время стоит.

       — Рост?
       — До дамы.
       — Не идёт, до туза.        (или: — Твой.)
       — Козырный?                (если рост совпал)
       — Простой.
       — Пишется.

     Ответ тут всегда один и правдивый: соврать нельзя, карты сверяет движок.
     Пауза нужна не ради выбора, а ради того, что за столом ждут твоего слова. */
  Game.prototype.growWord = function (c) { return K.RANK_FROM[K.RANKS[c.top]]; };

  // взятка собрана и разобрана — вот теперь её забирают, и играем дальше
  Game.prototype.afterTrick = function (w) {
    this.cur = [];
    this.turn = w;
    if (this.hands[0].length === 0) return this.finishHand();
    return this.askPlay();
  };

  Game.prototype.startLive = function () {
    var lead = this.tricks[0].plays[0].p, order = [], k, p;
    for (k = 0; k < this.N; k++) {
      p = (lead + k) % this.N;
      if (this.cDecl.indexOf(p) >= 0) order.push(p);
    }
    if (!order.length) {
      this.cLeader = -1; this.comboWinner = -1; this.comboPts = 0; this.cTie = null;
      return this.afterTrick(this.takeAfter);
    }
    this.cQ = { order: order, i: 1, lead: order[0], tie: null, step: 'cmp' };
    return this.liveStep();
  };

  Game.prototype.liveSay = function (p, kind, extra) {
    if (kind === 'beat') {
      this.say(this.names[p] + ': не идёт' + (extra ? ', до ' + extra : '') + '.', 'hi');
      this.push({ e: 'combo', p: p, declare: true, beat: true, live: true });
    } else {
      this.say(this.names[p] + ': твой.');
      this.push({ e: 'combo', p: p, declare: false, yield: true, live: true });
    }
  };

  Game.prototype.liveStep = function () {
    var q = this.cQ, rk = function (c) { return c.kind === 'P' ? 2 : 1; };
    if (!q) return this.afterTrick(this.takeAfter);
    for (;;) {
      if (q.i >= q.order.length) return this.endLive();
      var p = q.order[q.i], lead = q.lead;
      if (p === lead) { q.i++; q.step = 'cmp'; continue; }
      var mine = this.combos[p][0], his = this.combos[lead][0];

      // напару не спорят: за сторону говорит её старшая комбинация
      if (this.o.pairs && this.sideOf(p) === this.sideOf(lead)) {
        if (K.cmpCombo(mine, his) > 0) q.lead = p;
        q.i++; q.step = 'cmp'; continue;
      }

      if (q.step === 'cmp') {
        if (rk(mine) !== rk(his)) {                   // полтина против терца — без вопросов
          if (rk(mine) > rk(his)) { this.liveSay(p, 'beat'); q.lead = p; q.tie = null; }
          else this.liveSay(p, 'yield');
          q.i++; continue;
        }
        q.step = 'grow';                              // виды равны — спрашиваем рост
        this.say(this.names[p] + ': рост?');
        this.push({ e: 'comboAsk2', p: p, from: lead, what: 'grow' });
        this.pending = { type: 'combo', mode: 'grow', p: lead, mine: his, ask: p };
        return;
      }

      if (q.step === 'grow2') {
        if (his.top > mine.top) { this.liveSay(p, 'yield'); q.i++; q.step = 'cmp'; continue; }
        if (mine.top > his.top) {
          this.liveSay(p, 'beat', this.growWord(mine));
          q.lead = p; q.tie = null; q.i++; q.step = 'cmp'; continue;
        }
        q.step = 'trumpq';                            // и рост совпал — остался козырь
        this.say(this.names[p] + ': козырный?');
        this.push({ e: 'comboAsk2', p: p, from: lead, what: 'trump' });
        this.pending = { type: 'combo', mode: 'trumpq', p: lead, mine: his, ask: p };
        return;
      }

      if (q.step === 'trump2') {
        if (mine.trump && !his.trump) {
          this.liveSay(p, 'beat', this.growWord(mine));
          q.lead = p; q.tie = null;
        } else if (his.trump && !mine.trump) {
          this.liveSay(p, 'yield');
        } else {
          q.tie = [lead, p];
          this.say('Ровно: ' + this.names[lead] + ' и ' + this.names[p] +
            '. Комбинацию запишет тот, кто возьмёт послед.', 'hi');
          this.push({ e: 'combo', p: p, declare: true, tie: true, live: true });
        }
        q.i++; q.step = 'cmp'; continue;
      }

      q.step = 'cmp';                                  // на всякий случай
    }
  };

  Game.prototype.endLive = function () {
    var best = this.cQ ? this.cQ.lead : -1, tie = this.cQ ? this.cQ.tie : null;
    this.cQ = null;
    this.cLeader = best; this.cTie = tie;
    this.comboWinner = best;
    this.comboPts = best >= 0 ? this.comboSideSum(best) : 0;
    if (best >= 0 && !tie) {
      var who = this.comboSideList(best).map(function (q) { return this.names[q]; }, this).join(' и ');
      this.say(who + ': пишется — ' + this.comboPts + '. Показ на второй взятке.', 'hi');
      this.push({ e: 'comboLive', win: best });
    }
    var w = this.takeAfter; this.takeAfter = null;
    return this.afterTrick(w);
  };

  /* Осталось от прежнего порядка: молчаливый разбор. Не используется, но
     пусть лежит — по нему удобно сверять, что ритуал считает так же. */
  Game.prototype.resolveLive = function () {
    var self = this, best = -1, tie = null, lead = this.tricks[0].plays[0].p, order = [], k;
    for (k = 0; k < this.N; k++) order.push((lead + k) % this.N);
    order.forEach(function (p) {
      if (self.cDecl.indexOf(p) < 0) return;
      var mine = self.combos[p][0];
      if (best < 0) { best = p; return; }
      var cmp = K.cmpCombo(mine, self.combos[best][0]);
      // напару спорить не с кем: за сторону говорит её старшая комбинация
      if (self.o.pairs && self.sideOf(p) === self.sideOf(best)) {
        // за сторону говорит старшая: спор с соперником переезжает на неё
        if (cmp > 0) { best = p; if (tie) tie = [p, tie[1]]; }
        return;
      }
      if (cmp > 0) { best = p; tie = null; }
      else if (cmp === 0) tie = [best, p];
    });
    this.cLeader = best; this.cTie = tie;
    this.comboWinner = best;
    this.comboPts = best >= 0 ? this.comboSideSum(best) : 0;
    if (best < 0) return;
    if (tie) {
      this.say('Ровно: ' + this.names[tie[0]] + ' и ' + this.names[tie[1]] +
        '. Комбинацию запишет тот, кто возьмёт послед.', 'hi');
      this.push({ e: 'combo', p: tie[1], declare: true, tie: true, kind: this.combos[tie[1]][0].kind });
      return;
    }
    var who = this.comboSideList(best).map(function (q) { return this.names[q]; }, this).join(' и ');
    this.say('Старше комбинация: ' + who + ' — ' + this.comboPts + ' очков. Показ после второй взятки.', 'hi');

    /* За столом этот разбор не молчаливый: старший говорит «не идёт»,
       остальные — «твой». В одесском порядке рост не спрашивают (в том и
       смысл — слово сказано первой картой), но сам обмен репликами живой,
       и стол должен его слышать. */
    var lost = [];
    this.cDecl.forEach(function (q) {
      if (q === best) return;
      if (self.o.pairs && self.sideOf(q) === self.sideOf(best)) return;   // напарнику не уступают
      lost.push(q);
    });
    this.push({ e: 'comboLive', win: best, lost: lost });
  };

  /* Шаг третий: вторая взятка сыграна — старший открывает карты. */
  Game.prototype.showLive = function () {
    this.cShown = true;
    if (this.cLeader < 0 || this.cTie) return;
    var lst = [];
    this.comboSideList(this.cLeader).forEach(function (q) {
      this.combos[q].forEach(function (co) {
        var cp = {}; for (var kk in co) cp[kk] = co[kk];
        cp.owner = q; lst.push(cp);
      });
    }, this);
    this.push({ e: 'comboWin', p: this.cLeader, pts: this.comboPts, list: lst, live: true });
  };

  Game.prototype.resolveCombos = function () {
    this.comboWinner = this.cLeader;
    this.comboPts = this.cLeader >= 0 ? this.comboSideSum(this.cLeader) : 0;
    if (this.cTie) this.say('Спор равных комбинаций: ' + this.names[this.cTie[0]] + ' и ' + this.names[this.cTie[1]] + '.', 'sys');
    else if (this.cLeader >= 0) {
      var who = this.comboSideList(this.cLeader).map(function (q) { return this.names[q]; }, this).join(' и ');
      this.say('Комбинации за ' + who + ' — ' + this.comboPts + ' очков.', 'hi');
    }
    else this.say('Комбинаций никто не заявил.');
    if (this.cLeader >= 0 && !this.cTie) {
      var lst = [];
      this.comboSideList(this.cLeader).forEach(function (q) {
        this.combos[q].forEach(function (co) {
          var cp = {}; for (var kk in co) cp[kk] = co[kk];
          cp.owner = q; lst.push(cp);
        });
      }, this);
      this.push({ e: 'comboWin', p: this.cLeader, pts: this.comboPts, list: lst });
    }
    this.startPlay();
  };

  /* ---------------- розыгрыш ---------------- */
  Game.prototype.startPlay = function () {
    this.turn = this.declarer;
    this.say(this.W3(this.declarer, 'ходит первым', 'ходит первой', 'ходите первым') + '.', 'sys');
    this.push({ e: 'play-start', p: this.declarer });
    this.askPlay();
  };

  Game.prototype.askPlay = function () {
    var p = this.turn;
    /* Показ старшей комбинации — в момент хода во вторую взятку: игрок берёт
       карту, но прежде чем положить, веером приоткрывает свои три-четыре и
       говорит «смотрите». Крайний срок — пока вторая взятка не закрылась,
       поэтому показываем именно на его ходу, а не после взятки. */
    if (this.cLive && !this.cShown && this.tricks.length === 1 &&
      this.cLeader >= 0 && !this.cTie && p === this.cLeader) this.showLive();
    // одесский вариант: слово говорят вместе с первой картой, до того как она легла
    if (this.cLive && this.tricks.length === 0 && this.cSaid.indexOf(p) < 0) {
      this.cSaid.push(p);
      var mine = this.combos[p] && this.combos[p][0];
      // нечего заявлять — молчит и кладёт карту, соперникам об этом знать незачем
      if (mine) {
        this.pending = {
          type: 'combo', mode: 'say', p: p, mine: mine,
          mate: this.saidKind(p, true), foe: this.saidKind(p, false)
        };
        return;
      }
    }
    this.pending = { type: 'play', p: p,
      legal: K.legalMoves(this.hands[p], this.cur, this.trump, p, this.sideVec(),
        this.o.freeTrakt) };
  };

  /* ---------- можно ли объявить беллу этой картой ----------

     Две росписи, и разница у них в одном — когда именно можно сказать
     слово.

     ОДЕССКАЯ (по умолчанию). Только первой из двух карт. Ник: «если вы
     выложили первую карту молча, а на короле вспомнили и сказали
     „Белла" — объявление не засчитывается, очки сгорают». Промолчал —
     потерял, второго шанса нет.

     ТУРНИРНАЯ. Назвать можно любой из двух — и первой, и второй. Забыл
     на даме — скажешь на короле.

     Общее у них то, что обе карты должны быть СВОИ: `bella.holder`
     ставится при раздаче тому, кому пришли и дама, и король козыря, —
     собрать беллу из чужих карт нельзя ни там, ни там. */
  Game.prototype.bellaOffer = function (p, c) {
    if (this.bella.holder !== p) return false;
    if (this.bella.announced) return false;
    if (c.s !== this.trump || (c.r !== 'Q' && c.r !== 'K')) return false;
    return this.o.bellaAny ? (this.bella.played <= 1) : (this.bella.played === 0);
  };

  Game.prototype.doPlay = function (card, sayBella) {
    var p = this.turn, i;
    var h = this.hands[p];
    var wasFirst = (this.cur.length === 0);
    var hadLead = false;
    if (!wasFirst) {
      var ls = this.cur[0].c.s;
      for (i = 0; i < h.length; i++) if (h[i].s === ls) hadLead = true;
    }
    for (i = 0; i < h.length; i++) if (h[i].r === card.r && h[i].s === card.s) { h.splice(i, 1); break; }
    if (this.bella.holder === p && card.s === this.trump && (card.r === 'Q' || card.r === 'K')) {
      /* Право на слово спрашиваем у `bellaOffer` — чтобы роспись была
         прописана в одном месте, а не продублирована здесь вторым
         условием, которое однажды разойдётся с первым. */
      if (sayBella && this.bellaOffer(p, card)) {
        this.bella.announced = true; this.bella.trick = this.tricks.length;
        this.say(this.names[p] + ': «Белла!»', 'hi');
        /* `n` — какой картой сказано слово: 1 первой, 2 второй. В
           одесской росписи бывает только 1, в турнирной — обе. Без
           этого номера разницу росписей нельзя ни показать, ни
           замерить. */
        this.push({ e: 'bella', p: p, n: this.bella.played + 1 });
      }
      this.bella.played++;
      /* Номера взяток обеих карт пишем ВСЕГДА, а не только после
         объявления: в турнирной росписи слово может прозвучать на
         второй карте, и тогда первая уже сыграна — строгачу иначе не с
         чем сверяться. */
      if (this.bella.played === 1) this.bella.firstTrick = this.tricks.length;
      else this.bella.secondTrick = this.tricks.length;
    }
    this.cur.push({ p: p, c: card });
    this.push({
      e: 'card', p: p, c: card, first: wasFirst,
      val: K.val(card, this.trump), forced: (!wasFirst && !hadLead)
    });

    if (this.cur.length < this.N) {
      this.turn = (this.turn + 1) % this.N;
      return this.askPlay();
    }
    // взятка собрана
    var w = K.trickWinner(this.cur, this.trump);
    var v = K.trickPoints(this.cur, this.trump);
    this.pts[w] += v; this.taken[w]++;
    if (this.bella.announced && this.bella.trick === this.tricks.length) this.bella.taker = w;
    if (this.o.strogach) {

    if (this.comboWinner >= 0)
      this.sideList()[this.sideOf(this.comboWinner)].forEach(function (q) { cTaken += this.taken[q]; }, this);
    if (this.comboWinner >= 0 && cTaken > 0) {

         («плюс то, что набрали сейчас»), но за столом играют не так.

         — все просто вернули своё, поровну, и раздача эта никому ничего
         не принесла. Не отыграл — весь кон уходит сопернику (ветка

  /* ---------------- вход для интерфейса ---------------- */

/* ============================================================

     2 «Дворовый» — считает вышедшее, бережёт козыри, играет на партнёра.

    var by = {};

    for (var s in by) {

  /* ================= раздача невидимых карт (для перебора) =================
     Датчик случайных чисел для прогонов — свой и привязанный к позиции.

  Brain.prototype.dealOnce = function (rnd) {

  // до скольких карт на руках имеет смысл считать до конца

  function search(st) {
    st.nodes++;
    if (st.nodes > SOLVE_BUDGET) { st.over = true; return st.pts.slice(); }
    var N = st.N, hand = st.hands[st.turn];
    if (!hand.length && !st.cur.length) return st.pts.slice();

    /* Место и раскладку по сторонам передаём обязательно: в парной игре
       напарника перебивать не обязан, и перебор должен видеть ровно те

        var lastOne = !st.hands[w].length;

        savedCur = st.cur; st.cur = [];
        st.turn = w;

        st.cur = savedCur;

  Brain.prototype.solve = function (legal) {

    if (g.hands[me].length > depth) return null;

    for (var s = 0; s < samples; s++) {

      var okAll = true;
      for (i = 0; i < legal.length; i++) {

        var st = {

          hands: hands.map(function (h) { return h.slice(); }),
          cur: g.cur.map(function (x) { return { p: x.p, c: x.c }; }),
          pts: []

        for (var k = 0; k < nSides; k++) st.pts.push(0);
        var h = st.hands[me], idx = -1;
        for (k = 0; k < h.length; k++) if (K.id(h[k]) === K.id(card)) { idx = k; break; }
        if (idx < 0) { okAll = false; break; }
        h.splice(idx, 1);
        st.cur.push({ p: me, c: card });
        var res;
        if (st.cur.length === N) {
