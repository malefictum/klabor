          var got = K.trickPoints(st.cur, st.trump);
          var lastOne = !st.hands[w].length;
          st.pts[side[w]] += got + (lastOne ? K.POSLED : 0);
          st.cur = []; st.turn = w;
          res = search(st);
        } else {
          st.turn = (me + 1) % N;
          res = search(st);
        }
        if (st.over) { okAll = false; break; }          // не уложились в бюджет — считаем по-простому
        var v = res[mySide] * 2 - Math.max.apply(null, res.filter(function (x, q) { return q !== mySide; }));

      cnt++;

  /* ---- политика доигрывания для прогонов ----
     Это «понимание игры» бота: перебор гоняет тысячи доигровок, и качество
     оценки упирается именно в неё. Сюда вшита тактика из курса по деберцу:
     тянуть козырь на своей игре, не выходить с тузов пока козыри в игре,

  // старшая ли карта из оставшихся (в прогоне карты всех известны)
  function topLeft(st, c) {
    var t = st.trump, i, j, h;
    for (i = 0; i < st.N; i++) {
      if (i === st.turn) continue;
      h = st.hands[i];
      for (j = 0; j < h.length; j++) {
        var u = h[j];
        if (c.s === t) { if (u.s === t && K.ORD_TRUMP[u.r] > K.ORD_TRUMP[c.r]) return false; }
        else if (u.s === c.s && K.ORD_PLAIN[u.r] > K.ORD_PLAIN[c.r]) return false;
      }
    }
    return true;
  }

    for (var i = 0; i < st.N; i++) {
      if (i === except) continue;
      for (var j = 0; j < st.hands[i].length; j++) if (st.hands[i][j].s === st.trump) n++;
    }
    return n;
  }

  function low(list, t) {
    var b = list[0];
    for (var k = 1; k < list.length; k++)
      if (K.val(list[k], t) * 10 + K.ord(list[k], t) < K.val(b, t) * 10 + K.ord(b, t)) b = list[k];
    return b;
  }
  function high(list, t) {
    var b = list[0];
    for (var k = 1; k < list.length; k++) if (K.ord(list[k], t) > K.ord(b, t)) b = list[k];
    return b;
  }
  function fat(list, t) {
    var b = list[0];
    for (var k = 1; k < list.length; k++) if (K.val(list[k], t) > K.val(b, t)) b = list[k];
    return b;
  }

  function quickMove(st) {
    var hand = st.hands[st.turn], t = st.trump;
    var legal = K.legalMoves(hand, st.cur, t, st.turn, st.side, st.freeTrakt);
    if (legal.length === 1) return legal[0];
    var i, c, best = legal[0], bv = -Infinity, v;
    var mySide = st.side[st.turn];
    var declMine = st.decl >= 0 && st.side[st.decl] === mySide;

    /* ---------- заход ---------- */
    if (!st.cur.length) {
      var cnt = {};
      for (i = 0; i < hand.length; i++) cnt[hand[i].s] = (cnt[hand[i].s] || 0) + 1;
      var oppTr = 0;
      for (i = 0; i < st.N; i++) if (st.side[i] !== mySide) {
        for (var j2 = 0; j2 < st.hands[i].length; j2++) if (st.hands[i][j2].s === t) oppTr++;
      }
      for (i = 0; i < legal.length; i++) {
        c = legal[i];
        var master = topLeft(st, c);
        v = 0;
        if (c.s === t) {
          // своя игра — тянем козырь, пока он есть у соперника; чужая — почти никогда
          if (declMine && oppTr > 0 && master) v += 30;
          else if (declMine && oppTr > 0) v += 6;
          else v -= 22;
          v -= K.val(c, t) * 0.25;
        } else {
          if (master) v += 20 + K.val(c, t) * 0.8;
          else v -= 4 + K.val(c, t) * 0.5;
          // пока козыри гуляют, тузом ходить рано — срежут
          if (c.r === 'A' && oppTr > 0) v -= 14;
          // десятка с одной мелкой — эту масть сами не разыгрываем
          if (c.r === '10' && cnt[c.s] <= 2) v -= 14;
          v += (cnt[c.s] || 0) * 1.2;
        }
        if (v > bv) { bv = v; best = c; }
      }
      return best;
    }

    /* ---------- ответ ---------- */
    var w = K.trickWinner(st.cur, t), pot = K.trickPoints(st.cur, t);
    var mateWins = st.side[w] === mySide;
    var lastToSpeak = (st.cur.length === st.N - 1);
    var lead = st.cur[0].c.s;
    var wins = [], loses = [];
    for (i = 0; i < legal.length; i++) {
      c = legal[i];
      st.cur.push({ p: st.turn, c: c });
      var nw = K.trickWinner(st.cur, t);
      st.cur.pop();
      (nw === st.turn ? wins : loses).push(c);
    }

    if (mateWins) {
      // напарник взял: если намертво или мы последние — сваливаем жир
      var wc = null;
      for (i = 0; i < st.cur.length; i++) if (st.cur[i].p === w) wc = st.cur[i].c;
      if (lastToSpeak || (wc && topLeft(st, wc))) return fat(legal, t);
      return loses.length ? low(loses, t) : low(legal, t);
    }

    if (wins.length) {
      var cheap = wins[0];
      for (i = 1; i < wins.length; i++) if (K.ord(wins[i], t) < K.ord(cheap, t)) cheap = wins[i];
      var ruff = cheap.s === t && lead !== t;
      var value = pot + (hand.length === 1 ? K.POSLED : 0);
      if (ruff && loses.length && value < 3 + ruffCost(cheap, t)) return low(loses, t);
      if (lastToSpeak || value >= 6 || topLeft(st, cheap)) return cheap;
      if (loses.length && value < 4) return low(loses, t);
      return cheap;
    }

    // взять нельзя. Король под туз: на мелкий заход соперника кладём короля,
    // чтобы вытащить туза, а не отдать пустышку
    if (!lastToSpeak && st.cur.length === 1 && K.val(st.cur[0].c, t) <= 2) {
      var kings = legal.filter(function (x) { return x.s === lead && x.r === 'K'; });
      var smalls = legal.filter(function (x) { return x.s === lead && K.val(x, t) === 0; });
      if (kings.length && smalls.length) return kings[0];
    }
    // снос: очки сопернику не дарим, козырь и верные карты держим,
    // короткую масть сносим охотнее — потом будет чем резать
    var cntS = {};
    for (i = 0; i < hand.length; i++) cntS[hand[i].s] = (cntS[hand[i].s] || 0) + 1;
    var db = legal[0], dv = -Infinity;
    for (i = 0; i < legal.length; i++) {
      c = legal[i];
      var s2 = -K.val(c, t) * 1.5 - K.ord(c, t) * 0.3;
      if (c.s === t) s2 -= 9 + ruffCost(c, t);
      if (topLeft(st, c)) s2 -= 10;
      if (cntS[c.s] === 1 && c.s !== t) s2 += 4;
      if (s2 > dv) { dv = s2; db = c; }
    }
    return db;
  }

  // доигрываем раздачу быстрой политикой и возвращаем очки по сторонам
  function rollout(st) {
    var guard = 0;
    while (guard++ < 64) {
      if (!st.hands[st.turn].length && !st.cur.length) break;
      var c = quickMove(st), hand = st.hands[st.turn], idx = hand.indexOf(c);
      hand.splice(idx, 1);
      st.cur.push({ p: st.turn, c: c });
      if (st.cur.length === st.N) {
        var w = K.trickWinner(st.cur, st.trump);
        var got = K.trickPoints(st.cur, st.trump);
        st.pts[st.side[w]] += got + (st.hands[w].length ? 0 : K.POSLED);
        st.cur = []; st.turn = w;
      } else st.turn = (st.turn + 1) % st.N;
    }
    return st.pts;
  }

  // середина раздачи: раскладываем невидимые карты несколькими вариантами
  // и смотрим, какой ход в среднем выгоднее. Это и есть «продумать до конца».
  Brain.prototype.mc = function (legal) {
    var g = this.g, N = g.N, me = this.me, self = this;
    if (this.lvl < 3 || legal.length < 2) return null;
    var side = [], i;
    for (i = 0; i < N; i++) side.push(this.sideOf(i));
    var mySide = side[me], nSides = g.o.pairs ? 2 : N;
    var samples = g.hands[me].length >= 7 ? this.opt.mc1 : this.opt.mc2;
    var rndMC = this.newRnd();
    var score = {}, cnt = 0;
    legal.forEach(function (c) { score[K.id(c)] = 0; });

    for (var sIdx = 0; sIdx < samples; sIdx++) {
      var hands = this.dealOut(rndMC);
      if (!hands) continue;
      cnt++;
      for (i = 0; i < legal.length; i++) {
        var card = legal[i];
        var st = {
          N: N, trump: g.trump, side: side, freeTrakt: g.o.freeTrakt, turn: me, decl: g.declarer,
          hands: hands.map(function (h) { return h.slice(); }),
          cur: g.cur.map(function (x) { return { p: x.p, c: x.c }; }),
          pts: []
        };
        for (var k = 0; k < nSides; k++) st.pts.push(0);
        var h = st.hands[me], idx = -1;
        for (k = 0; k < h.length; k++) if (K.id(h[k]) === K.id(card)) { idx = k; break; }
        if (idx < 0) continue;
        h.splice(idx, 1);
        st.cur.push({ p: me, c: card });
        if (st.cur.length === N) {
          var w = K.trickWinner(st.cur, st.trump);
          var got = K.trickPoints(st.cur, st.trump);
          st.pts[side[w]] += got + (st.hands[w].length ? 0 : K.POSLED);
          st.cur = []; st.turn = w;
        } else st.turn = (me + 1) % N;
        var res = rollout(st);
        var others = res.filter(function (x, q) { return q !== mySide; });
        score[K.id(card)] += res[mySide] * 2 - Math.max.apply(null, others);
      }
    }
    if (!cnt) return null;
    var best = null, bv = -Infinity;
    legal.forEach(function (c) {
      var v = score[K.id(c)] / cnt;
      if (v > bv) { bv = v; best = c; }
    });
    return best;
  };

  /* ================= торг за козырь =================
     Оценка руки не на глазок, а по цифрам: коэффициенты подобраны методом
     наименьших квадратов на тысячах принудительно взятых игр (learn_bid.js
     собирает выборку, fit.js считает). Значение = сколько очков раздача
     принесёт стороне играющего, если он возьмёт эту масть.
     Отсюда и видно, чего стоит рука без мусора и манэллы. */

  // [своб., козырей, валет, 9, туз, 10, K/Q, тузы вне козыря, десятки вне, белла, терц, полтина, длинная масть]
  // пороги «беру» по режимам: втроём пас дешевле всего, поэтому там строже всех
  /* Старая модель: сколько ОЧКОВ обещает рука. Решение по ней больше не принимается
     (см. bidP ниже) — оставлена для замеров и разбора: удобно смотреть, что бот
     ждёт от раздачи, отдельно от того, берёт он её или нет. */
  var BIDT = { 2: [52, 44, 30], 3: [60, 54, 38], 4: [70, 48, 32] };

  /* Веса логистической модели «не получу бейт». Порядок признаков — как в bidRow:
     const, len=1..4, len>=5, J, 9, J&9, T, 10, K/Q, чужие тузы, чужие десятки,
     белла, терц козырной, терц чужой, полтина козырная, полтина чужая, пустые масти,
     длиннейшая масть. Обучены learn_bid.js на прогонах движка. */
  var BIDP = {
    2: [-4.549, 0.228, 0.967, 1.586, 1.928, 2.280, 1.187, 0.650, 0.551, 0.753, 0.546, 0.335, 0.706, 0.403, 0.357, 0.607, 0.752, 1.622, 2.271, 0.052, 0.110, 0.213, -0.027, 0.525, 0.328, 0.681, 0.710, 1.269, 1.268, 0.192, 0.000, 0.603],
    3: [-5.278, 0.048, 0.872, 1.650, 2.354, 3.083, 1.530, 0.753, 0.558, 0.842, 0.513, 0.280, 0.861, 0.335, 0.485, 0.524, 0.797, 1.931, 2.833, 0.577, -0.150, 0.141, 0.246, 0.658, 0.857, 1.017, 0.801, 1.468, 1.881, 0.101, 0.000, 0.647],
    4: [-0.780, 0.273, 0.339, 0.585, 1.087, 1.627, 0.849, 0.479, 0.605, 0.436, 0.233, 0.109, 0.434, 0.039, 0.120, 0.663, 0.469, 1.998, 1.419, 0.420, -0.129, -0.058, 0.176, 0.312, 0.132, 0.385, 0.644, 0.897, 2.557, 0.483, -0.784, -0.715]
  };
  // порог по вероятности: [первый круг, второй круг, последнее слово]
  /* Порог по вероятности: [первый круг, второй круг, последнее слово перед пересдачей].
     Подобраны дуплетным турниром (bench.js), и по режимам они разные не случайно:
     – напару берущий один против двоих, бейт стоит дорого → самый жёсткий порог;
     – втроём каждый за себя пас отдаёт игру сопернику, а бейт уходит только одному
       из них → выгодно брать даже сомнительное;
     – в дуэли по очкам почти всё равно, взят порог поосторожнее. */
  var BIDQ = { 2: [0.56, 0.52, 0.42], 3: [0.56, 0.52, 0.42], 4: [0.82, 0.78, 0.68] };
  /* Насколько сильно слушать чужие пасы. Втроём и в дуэли — в полную силу.
     Напару вполовину: пас напарника и правда роняет шансы, но отдать раздачу
     сопернику там дороже, чем сыграть свою сомнительную. Проверено дуплетом. */
  var BIDC = { 2: 1, 3: 1, 4: 0.5 };

  var BIDW = {
    2: [-38.83, 9.77, 31.78, 18.82, 12.05, 8.93, 3.91, 13.48, 8.25, 10.91, 18.32, 56.67, 1.87],
    3: [-57.64, 13.76, 36.77, 18.10, 10.49, 5.51, 1.63, 13.36, 6.63, 16.63, 15.42, 44.55, 3.52],
    4: [-8.03, 7.66, 40.65, 19.74, 12.72, 8.53, -1.42, 10.93, 0.14, 19.19, 23.18, 60.94, 5.61]
  };

  /* ---------------- оценка заказа ----------------
     Раньше бот предсказывал ОЧКИ, которые принесёт игра, и брал масть,
     если очков обещалось много. На этом он и горел: полтина в чужой масти
     честно добавляет 50 очков прогнозу, но взяток не приносит, и рука
     «два мелких козыря + полтина в бубнах» переваливала порог.
     Теперь считается то, что на самом деле решает: ВЕРОЯТНОСТЬ НЕ ПОЛУЧИТЬ БЕЙТ,
     то есть шанс взять больше половины разыгранных очков (втроём — больше,
     чем лучший соперник). Модель логистическая, веса обучены на прогонах.
     Длина козыря входит признаками-индикаторами: разница между одним козырем
     и четырьмя совсем не линейная, и линия её раньше сглаживала. */
  function bidFeats(hand, t) {
    var f = { len: 0, J: 0, N9: 0, A: 0, T10: 0, KQ: 0, oA: 0, o10: 0, bella: 0,
      tT: 0, tS: 0, pT: 0, pS: 0, voids: 0, longest: 0,
      pairAT: 0, singles: 0 }, bySuit = {};
    hand.forEach(function (c) {
      bySuit[c.s] = (bySuit[c.s] || 0) + 1;
      if (c.s === t) {
        f.len++;
        if (c.r === 'J') f.J = 1; else if (c.r === '9') f.N9 = 1;
        else if (c.r === 'A') f.A = 1; else if (c.r === '10') f.T10 = 1;
        else if (c.r === 'K' || c.r === 'Q') f.KQ++;
      } else {
        if (c.r === 'A') f.oA++; else if (c.r === '10') f.o10++;
      }
    });
    var q = hand.some(function (c) { return c.s === t && c.r === 'Q'; });
    var k = hand.some(function (c) { return c.s === t && c.r === 'K'; });
    f.bella = (q && k) ? 1 : 0;
    // терцы и полтины теперь врозь: козырные держат игру, чужие только пишут очки
    K.findCombos(hand, t).forEach(function (c) {
      if (c.kind === 'P') { if (c.suit === t) f.pT++; else f.pS++; }
      else { if (c.suit === t) f.tT++; else f.tS++; }
    });
    for (var sx in bySuit) if (bySuit[sx] > f.longest) f.longest = bySuit[sx];
    f.voids = 4 - Object.keys(bySuit).length;
    // связка туз+десятка в одной чужой масти: чистые 21 очко и перехват хода —
    // за столом это считают отдельным козырем, и по замерам так и есть
    K.SUITS.forEach(function (s2) {
      if (s2 === t) return;
      var a = false, ten = false;
      hand.forEach(function (c) {
        if (c.s !== s2) return;
        if (c.r === 'A') a = true; if (c.r === '10') ten = true;
      });
      if (a && ten) f.pairAT++;
      if (bySuit[s2] === 1) f.singles++;
    });
    return f;
  }

  function bidRow(hand, t) {
    var f = bidFeats(hand, t), L = f.len, row = [1], i;
    for (i = 1; i <= 5; i++) row.push(i === 5 ? (L >= 5 ? 1 : 0) : (L === i ? 1 : 0));
    row.push(f.J, f.N9, f.J * f.N9, f.A, f.T10, f.KQ, f.oA, f.o10, f.bella,
      f.tT, f.tS, f.pT, f.pS, f.voids, f.longest, f.pairAT, f.singles,
      (f.N9 && !f.J) ? 1 : 0);
    /* Один козырь, но это мусор, — совсем не то же, что один мелкий: с мусором
       взятка твоя железно. Линия такого сама не выразит, поэтому «честь × длина»
       кладём отдельными клетками. */
    for (i = 1; i <= 5; i++) row.push((f.J && (i === 5 ? L >= 5 : L === i)) ? 1 : 0);
    return row;
  }

  /* Вероятность увести раздачу без бейта.
     ctx — то, что слышно за столом к моменту слова: сколько пасов сказали соперники,
     сколько напарник, и идёт ли ещё первый круг. Это не догадка: три последних веса
     обучены на раздачах, где соперники торговались по-настоящему, а не пасовали
     по приказу. Оказалось, чужой пас стоит немного (+0.14…+0.30 к логиту),
     а пас напарника обходится дороже (−0.47) — помощи ждать не от кого. */
  function bidP(hand, t, N, ctx) {
    var w = BIDP[N] || BIDP[3];
    if (!w) return null;
    var row = bidRow(hand, t), z = 0, i;
    for (i = 0; i < row.length && i < w.length; i++) z += w[i] * row[i];
    if (ctx && w.length > row.length + 2) {
      var kc = (ctx.w != null) ? ctx.w : 1;
      z += kc * (w[row.length] * (ctx.foe || 0) +
        w[row.length + 1] * (ctx.mate || 0) +
        w[row.length + 2] * (ctx.round1 ? 1 : 0));
    }
    return 1 / (1 + Math.exp(-z));
  }

  function handFeats(hand, t) {
    var f = { len: 0, J: 0, N9: 0, A: 0, T10: 0, KQ: 0, oA: 0, o10: 0, bella: 0,
      terz: 0, polt: 0, longest: 0 }, bySuit = {};
    hand.forEach(function (c) {
      bySuit[c.s] = (bySuit[c.s] || 0) + 1;
      if (c.s === t) {
        f.len++;
        if (c.r === 'J') f.J = 1; else if (c.r === '9') f.N9 = 1;
        else if (c.r === 'A') f.A = 1; else if (c.r === '10') f.T10 = 1;
        else if (c.r === 'K' || c.r === 'Q') f.KQ++;
      } else {
        if (c.r === 'A') f.oA++; else if (c.r === '10') f.o10++;
      }
    });
    var q = hand.some(function (c) { return c.s === t && c.r === 'Q'; });
    var k = hand.some(function (c) { return c.s === t && c.r === 'K'; });
    f.bella = (q && k) ? 1 : 0;
    K.findCombos(hand, t).forEach(function (c) { if (c.kind === 'P') f.polt++; else f.terz++; });
    for (var sx in bySuit) if (bySuit[sx] > f.longest) f.longest = bySuit[sx];
    return f;
  }

  // сколько очков, по опыту, принесёт игра на этой масти
  function handValue(hand, t, N) {
    var w = BIDW[N] || BIDW[3], f = handFeats(hand, t);
    return w[0] + w[1] * f.len + w[2] * f.J + w[3] * f.N9 + w[4] * f.A + w[5] * f.T10 +
      w[6] * f.KQ + w[7] * f.oA + w[8] * f.o10 + w[9] * f.bella + w[10] * f.terz +
      w[11] * f.polt + w[12] * f.longest;
  }

  // старая грубая оценка — осталась новичку и сборщику выборки
  function suitStrength(hand, s) {
    var v = 0, len = 0;
    hand.forEach(function (c) {
      if (c.s === s) {
        len++;
        if (c.r === 'J') v += 9; else if (c.r === '9') v += 6;
        else if (c.r === 'A') v += 4; else if (c.r === '10') v += 3;
        else if (c.r === 'K' || c.r === 'Q') v += 2; else v += 1;
      } else {
        if (c.r === 'A') v += 3;
        else if (c.r === '10') v += 1;
      }
    });
    if (len >= 3) v += (len - 2) * 2;
    var q = hand.some(function (c) { return c.s === s && c.r === 'Q'; });
    var k = hand.some(function (c) { return c.s === s && c.r === 'K'; });
    if (q && k) v += 4;
    return v;
  }

  Brain.prototype.bid = function (pend) {
    var g = this.g, h = g.hands[this.me], self = this, N = g.N;
    var last = (g.bidSeat === N - 1);

    if (this.lvl === 1) {                       // новичок считает по-простому и лезет во всё
      var thr1 = 15;
      if (pend.round === 1) {
        if (suitStrength(h, pend.opts.take) >= thr1 || !pend.opts.pass) return { suit: pend.opts.take };
        return { pass: true };
      }
      var b1 = null, v1 = -1;
      pend.opts.name.forEach(function (s2) {
        var vv = suitStrength(h, s2); if (vv > v1) { v1 = vv; b1 = s2; }
      });
      if (v1 >= thr1 - 3 || !pend.opts.pass) return { suit: b1 };
      return { pass: true };
    }

    /* Считаем не «сколько очков обещает рука», а шанс увести раздачу без бейта —
       то есть взять больше половины разыгранных очков. Пас почти ничего не стоит:
       в первом круге впереди второй, во втором — пересдача, а бейт стоит всего,
       поэтому порог заметно выше половины: бот не лезет в игру «на авось». */
    var Q = this.opt.bidQ || BIDQ[N] || BIDQ[3];
    // дворовый смелее каталы: тот же расчёт, но порог помягче
    if (this.lvl <= 2 && !this.opt.bidQ) Q = Q.map(function (x) { return x - 0.06; });

    // что уже слышно за столом
    var foe = 0, mate = 0;
    (g.bidLog || []).forEach(function (x) {
      if (!x.pass) return;
      if (self.isMate(x.p)) mate++; else foe++;
    });
    var ctx = { foe: foe, mate: mate, round1: pend.round === 1,
      w: (this.opt.passW != null) ? this.opt.passW : (BIDC[N] != null ? BIDC[N] : 1) };

    function P(s) {
      var p = bidP(h, s, N, ctx);
      return p == null ? 0 : p;
    }

    if (pend.round === 1) {
      if (!pend.opts.pass) return { suit: pend.opts.take };
      return P(pend.opts.take) >= Q[0] ? { suit: pend.opts.take } : { pass: true };
    }
    var best = null, bp = -1;
    pend.opts.name.forEach(function (s2) {
      var pp = P(s2);
      if (pp > bp) { bp = pp; best = s2; }
    });
    if (!pend.opts.pass) return { suit: best };   // обяз: пасовать нельзя, берём лучшее из плохого
    return bp >= (last ? Q[2] : Q[1]) ? { suit: best } : { pass: true };
  };

  /* ================= комбинации ================= */

  Brain.prototype.combo = function (pend) {
    var mine = pend.mine, g = this.g;
    // одесский вариант: слово говорят первой картой. Спорить потом не придётся —
    // старшинство разберут сами, — поэтому решение простое: стоит ли светить руку
    if (pend.mode === 'say') {
      /* Что уже прозвучало — открытая информация, и она решает больше, чем
         сила своей комбинации. Соперник сказал полтину, а своей стороне
         ответить нечем — терц не запишется при любом раскладе, и назвать
         его значит просто показать сопернику три карты подряд в масти.
         Молчим. После полтины НАПАРНИКА, наоборот, говорим: очки общие,
         и его старшая комбинация тянет за собой в зачёт и наш терц. */
      var rk = function (x) { return x === 'P' ? 2 : x === 'T' ? 1 : 0; };
      var myR = rk(mine.kind), foeR = rk(pend.foe), mateR = rk(pend.mate);
      if (this.lvl >= 2 && foeR > Math.max(myR, mateR)) return { declare: false };
      if (mateR >= myR && mateR > 0) return { declare: true };   // за напарником — в общий зачёт
      if (g.o.pairs) return { declare: true };            // напару очки общие, молчать незачем
      if (this.lvl >= 3 && mine.kind === 'T' && !mine.trump && mine.top <= K.SEQ['10'])
        return { declare: this.newRnd()() < 0.5 };        // мелкий терц выдаёт масть дороже, чем стоит
      return { declare: true };
    }
    if (pend.mode === 'declare') {
      // напарнику доложить свою комбинацию — почти всегда выгодно: очки общие
      if (pend.team != null) return { declare: true };
      // светить комбинацию — значит показать сопернику кусок руки
      if (this.lvl >= 3 && !pend.over && mine.kind === 'T' && mine.top <= K.SEQ['10'] && !mine.trump) {
        var worth = g.o.terz, risk = g.declarer === this.me ? 0.35 : 0.55;
        return { declare: this.newRnd()() < risk || worth >= 30 };
      }
      return { declare: true };
    }
    // разбор старшинства по-одесски: ответ вынужденный, врать нельзя
    if (pend.mode === 'grow' || pend.mode === 'trumpq') return { ok: true };

    if (pend.mode === 'ask') {
      if (this.lvl <= 2) return { ask: true };
      return { ask: mine.trump || mine.top >= K.SEQ.J };
    }
    return { beat: K.cmpCombo(mine, pend.lead) >= 0 };
  };

  Brain.prototype.swap7 = function () {
    var g = this.g;
    return { yes: K.val(g.upCard, g.trump) > 0 || this.lvl === 1 };
  };

  /* ================= розыгрыш ================= */

  Brain.prototype.play = function (pend) {
    var g = this.g, legal = pend.legal, me = this.me, card;
    if (this.lvl === 1) card = this.playSimple(legal);
    else {
      card = (this.lvl >= 3 && !this.opt.noSolve) ? this.solve(legal) : null;
      if (!card && this.lvl >= 3 && !this.opt.noMC) card = this.mc(legal);
      if (!card) card = (g.cur.length === 0) ? this.lead(legal) : this.follow(legal);
    }
    var bella = false;
    if (g.bellaOffer(me, card)) bella = this.wantBella(card);
    return { card: card, bella: bella };
  };

  /* Порог «объявлять беллу». Арифметика даёт ровно 0.5 (молчание 0,
     объявление ±20), и замер `sweepbella.js` это подтверждает — но не
     единогласно, и это стоит записать честно.

     Чистые очки беллы за партию, три бота одного уровня:

       порог    новичок (250 партий)   дворовый (200 партий)
       −1 «всегда, пока взятка моя»     9.4                  15.4
       0.5                             13.4                  13.4
       2  «только наверняка»           10.6                  11.2

     У дворового «всегда» вышло лучше: он и правда чаще удерживает
     взятку, которую уже держит. Но у новичка тот же порог оказался
     ХУДШИМ из всех — он её теряет, и каждая вторая белла уходит
     сопернику (111 из 339). Порог 0.5 не проигрывает нигде и нигде не
     даёт той картины, ради которой всё и затевалось: бот, дарящий
     двадцатку через раз, выглядит дураком, даже если в сумме выходит
     ноль. Берём устойчивое, а не лучшее на одном уровне.

     `setBellaP` открыт наружу, чтобы порог можно было перемерить
     замером, а не переспорить. */
  var BELLA_P = 0.5;
  function setBellaP(v) { BELLA_P = v; }

  /* ---------- объявлять ли беллу ----------

     Ник: «бот объявляет беллу, даже если соперник зашёл с козырного
     туза. Два раза подряд так было».

     Дело не в характере бота, а в цене решения. По нашим правилам
     двадцать очков за беллу идут НЕ тому, у кого дама с королём, а
     ТОМУ, КТО ЗАБЕРЁТ ВЗЯТКУ, в которой беллу объявили (так написано и
     на экране правил, и на этом стоит достижение «Чужая белла»).
     Значит объявить беллу под чужого туза — это не «поторопился», а
     подарить сопернику двадцать очков своими руками.

     Молчание стоит ноль. Объявление стоит ±20. Поэтому вопрос ровно
     один: останется ли ЭТА взятка за нами.

     Старый код отвечал на него дважды неверно. Новичок и дворовый
     (`lvl <= 2`) объявляли ВСЕГДА, без единой проверки, — а именно с
     ними Ник и играл. Катала проверял, но условие `g.cur.length <
     g.N - 1` читалось как «я не последний, значит ещё не всё потеряно»:
     под козырным тузом терять уже нечего, а бот всё равно объявлял.

     Правило одно на все уровни. Это не сила игры, которую подбирают
     поединком, — это грубая ошибка, и новичку она не идёт. */
  Brain.prototype.wantBella = function (card) {
    var g = this.g, t = g.trump;
    var plays = g.cur.concat([{ p: this.me, c: card }]);
    /* Турнирная роспись: на ПЕРВОЙ карте спешить незачем — впереди
       вторая, и она может лечь удачнее. Поэтому тут объявляем, только
       когда взятка уже наверняка наша; во всех сомнительных случаях
       ждём второй карты, где выбора уже не будет и работает обычное
       правило «чаще наша, чем нет». */
    var spare = !!g.o.bellaAny && g.bella && g.bella.played === 0;
    var w = K.trickWinner(plays, t);
    var ours = (w === this.me) || this.isMate(w);
    var left = g.N - plays.length;          // сколько игроков ещё положат карту

    // Все сказали слово — гадать не о чем, вопрос решён.
    if (left <= 0) return ours;

    var top = null, i;
    for (i = 0; i < plays.length; i++) if (plays[i].p === w) top = plays[i].c;
    var beatable = this.canBeBeaten(top, plays[0].c.s);

    /* Взятка за нами. Бить нечем — объявляем не думая. Есть чем — это
       ставка: молчание стоит ноль, объявление ±20, значит объявлять
       выгодно ровно тогда, когда взятка останется за нами ЧАЩЕ, чем
       уйдёт. Отсюда и порог: 0.5. */
    if (ours) return !beatable || (!spare && this.bellaKeep(top, plays) > BELLA_P);

    /* Наверху соперник. Надежда только на напарника, которому ещё
       ходить, — и только если карту наверху вообще есть чем бить. */
    return !spare && beatable && this.mateToCome(left);
  };

  /* Вероятность, что взятка останется за нашей стороной: у каждого, кому
     ЕЩЁ ХОДИТЬ и кто нам не свой, складываем шансы держать бьющую карту.
     Это `pLeadWins`, честно суженный до тех, кто не сходил: считать риск
     от уже сходивших — пугать себя тем, что уже случилось. */
  Brain.prototype.bellaKeep = function (top, plays) {
    var g = this.g, t = g.trump, self = this, un = this.unseen();
    var lead = plays[0].c.s;
    var done = {}, i;
    for (i = 0; i < plays.length; i++) done[plays[i].p] = 1;
    var p = 1;
    this.others().forEach(function (q) {
      if (done[q] || self.isMate(q)) return;
      var risk = 0;
      un.forEach(function (u) {
        var beats;
        if (top.s === t) beats = (u.s === t && K.ORD_TRUMP[u.r] > K.ORD_TRUMP[top.r]);
        else beats = (u.s === t) ? self.voidOf[q][lead]
          : (u.s === lead && K.ORD_PLAIN[u.r] > K.ORD_PLAIN[top.r]);
        if (beats) risk += self.pHas(q, u);
      });
      p *= Math.max(0, 1 - Math.min(1, risk));
    });
    return p;
  };

  /* Есть ли среди НЕВИДЕННЫХ карт такая, что побьёт эту. `unseen` не
     считает мою руку, а значит это ровно те карты, что могут лечь
     после меня. Своя масть слабее козыря, чужая простая не берёт
     вовсе — как и во взятке. */
  Brain.prototype.canBeBeaten = function (top, lead) {
    if (!top) return true;
    var t = this.g.trump, un = this.unseen(), i, u;
    for (i = 0; i < un.length; i++) {
      u = un[i];
      if (top.s === t) { if (u.s === t && K.ORD_TRUMP[u.r] > K.ORD_TRUMP[top.r]) return true; }
      else if (u.s === t) return true;                       // козырь режет простую
      else if (u.s === lead && K.ORD_PLAIN[u.r] > K.ORD_PLAIN[top.r]) return true;
    }
    return false;
  };

  /* Ходить ли ещё напарнику. Он сидит через одного, значит он среди
     оставшихся, только если после меня говорят хотя бы двое. */
  Brain.prototype.mateToCome = function (left) {
    return this.g.o.pairs && left >= 2;
  };

  Brain.prototype.playSimple = function (legal) {
    var g = this.g, self = this;
    if (g.cur.length) {
      var win = legal.filter(function (c) {
        return K.trickWinner(g.cur.concat([{ p: self.me, c: c }]), g.trump) === self.me;
      });
      if (win.length) return this.highest(win);
    }
    return this.cheapest(legal);
  };

  Brain.prototype.cheapest = function (list) {
    var g = this.g, best = list[0];
    list.forEach(function (c) {
      var a = K.val(c, g.trump) * 10 + K.ord(c, g.trump);
      var b = K.val(best, g.trump) * 10 + K.ord(best, g.trump);
      if (a < b) best = c;
    });
    return best;
  };
  Brain.prototype.highest = function (list) {
    var g = this.g, best = list[0];
    list.forEach(function (c) { if (K.ord(c, g.trump) > K.ord(best, g.trump)) best = c; });
    return best;
  };
  Brain.prototype.dearest = function (list) {
    var g = this.g, best = list[0];
    list.forEach(function (c) { if (K.val(c, g.trump) > K.val(best, g.trump)) best = c; });
    return best;
  };

  /* ---- тактика на раздачу ---- */
  Brain.prototype.tactic = function () {
    var g = this.g, me = this.me, t = g.trump;
    if (this.plan && this.plan.hand === g.handNo) return this.plan;
    var h = g.hands[me], tr = h.filter(function (c) { return c.s === t; });
    var strong = tr.filter(function (c) { return c.r === 'J' || c.r === '9' || c.r === 'A'; }).length;
    var name;
    if (g.declarer === me || (g.o.pairs && this.isMate(g.declarer))) {
      // играем мы: с длинным козырем вытягиваем, с коротким режем чужие масти
      name = (tr.length >= 3 && strong >= 1) ? 'draw' : 'cross';
    } else {
      // защищаемся: с сильным козырем душим, иначе бережём очки и целим в бейт
      name = (strong >= 2 || tr.length >= 4) ? 'press' : 'guard';
    }
    this.plan = { hand: g.handNo, name: name };
    return this.plan;
  };

  /* ---- цена козыря: чем дороже, тем неохотнее им режут ---- */
  function ruffCost(c, trump) {
    if (c.s !== trump) return 0;
    if (c.r === 'J') return 16;
    if (c.r === '9') return 12;
    if (c.r === 'A') return 8;
    if (c.r === '10') return 7;
    return 2;
  }

  /* ---- заход ---- */
  Brain.prototype.lead = function (legal) {
    var g = this.g, me = this.me, t = g.trump, self = this;
    if (g.hands[me].length === 1) return legal[0];

    var plan = this.tactic().name;

    // ни одной взятки и карты кончаются — рвёмся за взяткой, иначе лыжи (-100)
    if (g.taken[me] === 0 && g.hands[me].length <= 3 && !(g.o.pairs && g.taken[this.mate()] > 0)) {
      var m2 = legal.filter(function (c) { return self.isMaster(c); });
      if (m2.length) return this.highest(m2);
      var tr0 = legal.filter(function (c) { return c.s === t; });
      if (tr0.length) return this.highest(tr0);
      return this.highest(legal);
    }

    var mateVoidTrump = false;
    if (g.o.pairs) {
      var mt = this.mate();
      mateVoidTrump = !this.voidOf[mt][t] && this.trumpsLeft() > 0;
    }

    var best = null, bv = -Infinity;
    legal.forEach(function (c) {
      var v = 0, master = self.isMaster(c), pw = self.lvl >= 3 ? self.pLeadWins(c) : (master ? 1 : 0.3);

      if (c.s === t) {
        // козырем ходят, когда вытягивают чужие козыри, а не «чтобы был ход»
        var opp = self.oppTrumps();
        if (plan === 'draw' && opp > 0.4 && master) v += 26;
        else if (plan === 'press' && master && opp > 0.4) v += 16;
        else v -= 20 + ruffCost(c, t);                     // иначе козырь дороже взятки
        v -= K.val(c, t) * 0.3;
      } else {
        v += pw * (14 + K.val(c, t) * 1.2);
        if (master) v += 8;
        // масть, по которой соперник пуст и держит козырь — заход под нож
        self.others().forEach(function (q) {
          if (self.isMate(q)) return;
          if (self.voidOf[q][c.s] && !self.voidOf[q][t]) v -= 16;
        });
        // напару: заход в масть, где пуст напарник, — это его подрез
        if (g.o.pairs && self.voidOf[self.mate()][c.s] && mateVoidTrump) v += 12;
        // не оголяем десятку без прикрытия и не отдаём туза даром
        var sameSuit = g.hands[me].filter(function (x) { return x.s === c.s; });
        if (c.r === '10' && sameSuit.length === 1) v -= 12;
        if (c.r === 'A' && pw < 0.5) v -= 6;
        if (plan === 'guard' && K.val(c, t) >= 10 && pw < 0.6) v -= 8;
      }
      // из длинной масти ходить полезнее: её труднее перебить до конца
      v += g.hands[me].filter(function (x) { return x.s === c.s; }).length * 0.8;
      v -= K.val(c, t) * (pw < 0.4 ? 0.6 : 0);             // мелочью, если взятка не наша

      if (v > bv) { bv = v; best = c; }
    });
    return best || legal[0];
  };

  /* ---- ответ ---- */
  Brain.prototype.follow = function (legal) {
    var g = this.g, me = this.me, t = g.trump, self = this;
    var pot = K.trickPoints(g.cur, t);
    var curW = K.trickWinner(g.cur, t);
    var mateWins = this.isMate(curW);
    var lastToSpeak = (g.cur.length === g.N - 1);
    var lastTrick = (g.hands[me].length === 1);
    var value = pot + (lastTrick ? K.POSLED : 0);

    var winning = legal.filter(function (c) {
      return K.trickWinner(g.cur.concat([{ p: me, c: c }]), t) === me;
    });
    var losing = legal.filter(function (c) { return winning.indexOf(c) < 0; });

    // лыжи на носу — берём любой ценой
    if (winning.length && g.taken[me] === 0 && g.hands[me].length <= 3 && !mateWins &&
      !(g.o.pairs && g.taken[this.mate()] > 0))
      return this.highest(winning);

    if (mateWins) {
      // напарник берёт: если он взял намертво — кидаем всё дорогое, иначе аккуратно
      var safe = lastToSpeak || this.mateSure();
      if (safe) return this.dearest(legal);
      var noTop = legal.filter(function (c) { return !(c.r === 'A' && c.s !== t) && K.val(c, t) < 10; });
      return this.dearest(noTop.length ? noTop : legal);
    }

    if (winning.length) {
      var cheapWin = winning.reduce(function (a, b) {
        return K.ord(a, t) <= K.ord(b, t) ? a : b;
      });
      var ruff = cheapWin.s === t && g.cur[0].c.s !== t;
      var cost = ruffCost(cheapWin, t);

      // резать козырем — только если взятка того стоит
      if (ruff && losing.length && this.lvl >= 2) {
        var need = 3 + cost;
        if (value < need) return this.junk(losing);
      }
      if (lastToSpeak) return cheapWin;
      // говорим не последними: берём, если взятка дорогая или карта верная
      if (value >= 10 || this.isMaster(cheapWin)) return cheapWin;
      if (this.lvl >= 2 && value < 4 && losing.length) return this.junk(losing);
      return cheapWin;
    }

    return this.junk(legal);
  };

  // напарник взял намертво? — тогда можно сваливать дорогое
  Brain.prototype.mateSure = function () {
    var g = this.g, t = g.trump, self = this;
    if (!g.o.pairs) return false;
    var w = K.trickWinner(g.cur, t), top = null;
    g.cur.forEach(function (x) { if (x.p === w) top = x.c; });
    if (!top) return false;
    var after = g.N - g.cur.length - 1;                  // сколько соперников ещё скажут
    if (after <= 0) return true;
    var lead = g.cur[0].c.s;
    var risk = 0;
    this.unseen().forEach(function (u) {
      var beats;
      if (top.s === t) beats = (u.s === t && K.ORD_TRUMP[u.r] > K.ORD_TRUMP[top.r]);
      else beats = (u.s === t) || (u.s === lead && K.ORD_PLAIN[u.r] > K.ORD_PLAIN[top.r]);
      if (!beats) return;
      self.others().forEach(function (q) {
        if (self.isMate(q) || q === self.me) return;
        risk += self.pHas(q, u);
      });
    });
    return risk < 0.25;
  };

  // снос: отдаём то, что меньше всего жалко
  Brain.prototype.junk = function (list) {
    var g = this.g, me = this.me, t = g.trump, self = this;
    if (this.lvl < 2) return this.cheapest(list);
    var best = null, bv = -Infinity;
    list.forEach(function (c) {
      var v = -K.val(c, t) * 1.6;                          // очки соперникам не дарим
      if (c.s === t) v -= 10 + ruffCost(c, t);             // козырь бережём
      if (self.isMaster(c)) v -= 12;                       // верную карту не сносим
      var same = g.hands[me].filter(function (x) { return x.s === c.s; });
      if (c.r === 'A') v -= 10;
      if (c.r === '10' && same.length > 1) v += 2;         // прикрытая десятка не так страшна

    c.bot = false;
    if (UI && UI.toast) UI.toast((c.name || 'Игрок') + ' без связи — ждём его, партия на паузе');
    lobbyPush(); onState && onState();
    awayPush();
  }
  function dropConn(conn, onState) {
    var i = seatOfConn(conn);
    if (i < 0) return;
    markAway(i, onState);
  }

  /* Кого ждут и сколько осталось. Список один на всех — и хозяину в
     плашку, и гостям: им тоже надо понимать, почему стол замер.
     Везём остаток, а не срок: часы у всех свои. */
  function awayList() {
    var out = [], now = Date.now();
    for (var i = 0; i < S.conns.length; i++) {
      var c = S.conns[i];
      if (c && c.away)
        out.push({
          seat: i, name: c.name || ('Место ' + (i + 1)),
          left: Math.max(0, c.away - now)
        });
    }
    return out;
  }
  function awayPush() {
    if (!S.host) return;
    var list = awayList();
    toGuests({ t: 'away', list: list });
    if (UI && UI.netAway) UI.netAway(list);
  }
  /* Ждать больше нечего: место забирает бот. Сюда приходят двумя
     путями — вышло время или хозяин нажал кнопку. Бота сажаем ПОСЛЕ
     того, как снята пауза: иначе его первый ход упрётся в неё же. */
  function seatBot(i) {
    if (!S.host) return false;
    var c = S.conns[i];
    if (!c || !c.away) return false;
    c.away = 0; c.bot = true;
    if (S.game) S.game.names[i] = (c.name || ('Место ' + (i + 1))) + ' (бот)';
    if (UI && UI.toast) UI.toast((c.name || 'Игрок') + ' не вернулся — место ведёт бот');
    lobbyPush(); awayPush();
    if (UI && UI.netFillBot) UI.netFillBot(i);
    if (S.game) broadcast(S.game);
    return true;
  }

  /* ---------- высадить со стола ----------
     «Вдруг зашёл не тот, что надо». Хозяин освобождает место, а ключ
     высаженного отправляется в бан на минуту: иначе он вернётся тем же
     ключом через секунду и сядет обратно. Ключ — единственное, чем гость
     себя опознаёт (адрес соединения у него каждый раз новый), так что это
     не крепость, а вежливое «не сейчас». */
  var BAN_MS = 60000;

  function kick(seat) {
    if (!S.host || seat <= 0 || seat >= S.conns.length) return false;
    var c = S.conns[seat];
    if (!c.conn) return false;
    var key = c.key;
    S.bans[key] = Date.now() + BAN_MS;
    send(c.conn, { t: 'bye', why: 'Хозяин убрал вас со стола. Вернуться можно через минуту.' });
    try { c.conn.close(); } catch (e) { }
    c.conn = null; c.bot = true; c.name = ''; c.face = -1; c.stats = null; c.sent = 0;
    if (S.game) { S.game.names[seat] = 'Место ' + (seat + 1); }
    lobbyPush();
    return true;
  }

  function banLeft(key) {
    var t = S.bans[key];
    if (!t) return 0;
    var left = t - Date.now();
    if (left <= 0) { delete S.bans[key]; return 0; }
    return left;
  }

  function onHostMsg(conn, m, onState) {
    var g = S.game;
    if (m.t === 'hello') {
      var seat = -1, i;
      var left = m.key ? banLeft(m.key) : 0;
      if (left > 0) {
        send(conn, { t: 'bye', why: 'Вас убрали со стола. Попробуйте через ' +
          Math.ceil(left / 1000) + ' сек.' });
        try { conn.close(); } catch (e) { }
        return;
      }
      /* Свой номер игрока — старше ключа: он опознаёт ЧЕЛОВЕКА, а ключ
         только место. Место с тем же номером забираем всегда, даже если
         прежнее соединение числится живым: живым оно числится и у
         призрака, и именно на этом стол ломался. */
      if (m.uid) {
        if (S.conns[0] && S.conns[0].uid === m.uid) {
          send(conn, { t: 'bye', why: 'Этот стол вы уже держите — вы за ним хозяин.' });
          try { conn.close(); } catch (e) { }
          return;
        }
        for (i = 1; i < S.conns.length; i++)
          if (S.conns[i].uid && S.conns[i].uid === m.uid) { seat = i; break; }
        if (seat > 0 && S.conns[seat].conn && S.conns[seat].conn !== conn) {
          /* Либо призрак, либо человек открыл игру во втором окне. И в
             том и в другом случае за столом остаётся последний пришедший,
             а прежнему говорим, почему его высадили. */
          try { send(S.conns[seat].conn, { t: 'bye', why: 'Вы вошли за этот стол из другого окна.' }); } catch (e) { }
          try { S.conns[seat].conn.close(); } catch (e) { }
          S.conns[seat].conn = null;
        }
      }
      // возврат по ключу — но занятое живое место не отбираем (двое за одним браузером)
      if (seat < 0 && m.key)
        for (i = 1; i < S.conns.length; i++)
          if (S.conns[i].key === m.key && !(S.conns[i].conn && S.conns[i].conn.open)) { seat = i; break; }
      /* Пустые места раздаём новичкам — но место, которое СЕЙЧАС держат
         за вылетевшим, не трогаем ни в какую: иначе он вернётся, а за
         его картами уже сидит чужой человек. */
      if (seat < 0)
        for (i = 1; i < S.conns.length; i++)
          if (!S.conns[i].conn && !S.conns[i].away && S.conns[i].bot && !S.conns[i].name) { seat = i; break; }
      if (seat < 0)
        for (i = 1; i < S.conns.length; i++) if (!S.conns[i].conn && !S.conns[i].away) { seat = i; break; }
      if (seat < 0) {
        var held = awayList().length;
        send(conn, { t: 'bye', why: held
          ? 'Все места заняты: одно держат за игроком, который вот-вот вернётся.'
          : 'Стол уже полон' });
        return;
      }
      S.conns[seat].conn = conn; S.conns[seat].bot = false;
      S.conns[seat].conn._seen = Date.now();
      /* Вернулся — ждать больше нечего. Пауза снимется в `awayPush`
         ниже, когда список опустеет. */
      S.conns[seat].away = 0;
      S.conns[seat].uid = m.uid || null;
      /* Если этот же человек уже сидел где-то ещё (стол сломался до
         починки — так и бывало), освобождаем то место здесь и сейчас. */
      for (i = 1; i < S.conns.length; i++)
        if (i !== seat && m.uid && S.conns[i].uid === m.uid) {
          try { if (S.conns[i].conn) S.conns[i].conn.close(); } catch (e) { }
          S.conns[i].conn = null; S.conns[i].uid = null; S.conns[i].bot = true;
        }
      /* Место снова живое — снимаем с него бота, которого посадил
         обрыв связи. Иначе хозяин продолжает ходить за вернувшегося, и
         перехватить управление он не может ничем, кроме нового стола. */
      if (UI && UI.netFreeSeat) UI.netFreeSeat(seat);
      S.conns[seat].name = (m.name || 'Игрок').slice(0, 14);
      // портрет гостя: если такой уже занят — хозяин подберёт свободный того же пола
      var want = (typeof m.face === 'number' && m.face >= 0) ? m.face : -1;
      var busy = [];
      for (i = 0; i < S.conns.length; i++) if (i !== seat && S.conns[i].face >= 0) busy.push(S.conns[i].face);
      if (want < 0 || busy.indexOf(want) >= 0) {
        var free = ART.facesOf(want >= 0 ? ART.FACE_SEX[want] : 'm', busy);
        if (!free.length) free = ART.facesOf(want >= 0 && ART.FACE_SEX[want] === 'm' ? 'f' : 'm', busy);
        want = free.length ? free[0] : -1;
      }
      S.conns[seat].face = want;
      S.conns[seat].stats = m.stats || null;         // профиль гостя — его увидят соперники
      if (g) {
        if (!g.stats) g.stats = [];
        g.stats[seat] = S.conns[seat].stats;
      }
      if (g && g.faces) { g.faces[seat] = want; broadcast(g); }
      S.conns[seat].sent = 0;
      if (g) g.names[seat] = S.conns[seat].name;
      send(conn, {
        t: 'welcome', seat: seat, key: S.conns[seat].key, code: S.code,
        cfg: { N: S.cfg.N, o: S.cfg.o, names: names() }, started: !!S.ready
      });
      lobbyPush(); awayPush(); onState && onState();
      if (S.ready && g) { S.conns[seat].sent = 0; broadcast(g); }
      return;
    }
    if (m.t === 'me') {                              // гость поменял имя или портрет
      var st2 = seatOfConn(conn);
      if (st2 < 0) return;
      if (m.name) S.conns[st2].name = String(m.name).slice(0, 14);
      if (m.stats) {
        S.conns[st2].stats = m.stats;
        if (g) { if (!g.stats) g.stats = []; g.stats[st2] = m.stats; }
      }
      if (typeof m.face === 'number' && m.face >= 0) {
        var taken = [];
        for (i = 0; i < S.conns.length; i++) if (i !== st2 && S.conns[i].face >= 0) taken.push(S.conns[i].face);
        if (taken.indexOf(m.face) < 0) S.conns[st2].face = m.face;
      }
      if (g) {
        if (g.names) g.names[st2] = S.conns[st2].name;
        if (g.faces) g.faces[st2] = S.conns[st2].face;
        broadcast(g);
      }
      lobbyPush();
      return;
    }
    if (m.t === 'chat') {
      var cs = seatOfConn(conn);
      if (cs < 0) return;
      chatOut(S.conns[cs].name || ('Место ' + (cs + 1)), String(m.text || '').slice(0, 200), cs);
      return;
    }
    if (m.t === 'act') {
      if (!g || !g.pending) return;
      var st = seatOfConn(conn);
      if (st !== m.seat) return;
      if (g.pending.p !== st && g.pending.type !== 'next') return;
      UI.applyRemote(m.a);
    }
  }

  function toGuests(msg) {
    for (var i = 1; i < S.conns.length; i++)
      if (S.conns[i] && S.conns[i].conn) send(S.conns[i].conn, msg);
  }

  /* ---------- разговор за столом ----------
     Живой чат в сетевой партии. Хозяин — почтальон: принимает реплику,
     показывает у себя и раздаёт остальным. Историю нигде не храним. */
  // место отправителя едет вместе с репликой: по имени «свой-чужой» не отличить,
  // два игрока могут назваться одинаково
  function chatOut(from, text, seat) {
    if (!text) return;
    if (UI && UI.chatIn) UI.chatIn(from, text, seat);
    toGuests({ t: 'chat', from: from, text: text, seat: seat });
  }
  function chat(text) {
    text = String(text || '').trim().slice(0, 200);
    if (!text || !S.on) return;
    if (S.host) chatOut(S.conns[0].name || 'Хозяин', text, 0);
    else send(S.conns[0], { t: 'chat', text: text });
  }

  function names() { return S.conns.map(function (c, i) { return c.name || ('Место ' + (i + 1)); }); }

  // хозяин пересаживает двух игроков местами. Команды в клаборе — это места
  // (0+2 против 1+3), так что пересадка и есть выбор команды.
  function swapSeats(i, j) {
    if (!S.host || S.ready) return false;
    if (i === j || i < 0 || j < 0 || i >= S.conns.length || j >= S.conns.length) return false;
    var a = S.conns[i], b = S.conns[j];
    var keep = ['name', 'key', 'conn', 'sent', 'bot', 'face', 'stats'];
    keep.forEach(function (k) { var t = a[k]; a[k] = b[k]; b[k] = t; });
    a.seat = i; b.seat = j;
    // живым игрокам сообщаем их новое место, иначе они будут ждать чужих карт
    if (a.conn) send(a.conn, { t: 'seat', seat: i, key: a.key });
    if (b.conn) send(b.conn, { t: 'seat', seat: j, key: b.key });
    lobbyPush();
    return true;
  }
  function lobbyPush() {
    if (!S.host) return;
    var list = S.conns.map(function (c, i) { return { seat: i, name: c.name, online: !!c.conn || i === 0, bot: c.bot, face: c.face }; });
    for (var i = 1; i < S.conns.length; i++) send(S.conns[i].conn, { t: 'lobby', players: list, code: S.code });
    if (UI && UI.lobbyRefresh) UI.lobbyRefresh(list);
  }

  /* ---------- гость ---------- */
  function joinRoom(code, myName, key, face) {
    return loadPeer().then(function (ok) {
      if (!ok) throw new Error('нет связи с брокером');
      S.host = false; S.on = true; S.code = code.toUpperCase();
      LS('klabor-room', S.code); LS('klabor-name', myName);
      return new Promise(function (res, rej) {
        var done = false, tries = 0;
        function ok2(v) { done = true; res(v); }
        S._resolve = ok2;
        (function attempt() {
          tries++;
          var p = newPeer(null);
          S.peer = p;
          p.on('open', function () {
            keepAlive(p, 'гость');
            var conn = p.connect(PREFIX + S.code, { reliable: true });
            S.conns = [conn];
            conn.on('open', function () {
              S.lastHost = Date.now();
              send(conn, {
                t: 'hello', name: myName, face: face, uid: myUid(),
                key: key || LS('klabor-key-' + S.code) || '',
                stats: (window.Boot && Boot.statCard) ? Boot.statCard() : null
              });
            });
            conn.on('data', function (m) {
              S.lastHost = Date.now();
              if (m && m.t === 'pong') return;
              onGuestMsg(m, res);
            });
            conn.on('close', function () { onLost(); });
            conn.on('error', function () { if (!done) { done = true; rej(new Error('стол не отвечает')); } });
          });
          p.on('error', function (e) {
            if (done) return;
            var t = (e && e.type) || '';
            if (TRANSIENT[t] && tries < 3) {
              try { p.destroy(); } catch (e2) { }
              return setTimeout(attempt, 500 * tries);
            }
            done = true;
            try { p.destroy(); } catch (e2) { }
            S.on = false; S.peer = null;
            rej(new Error(netErr(e)));
          });
        })();
        setTimeout(function () { if (!done) { done = true; rej(new Error('стол не отвечает')); } }, 14000);
      });
    });
  }

  function onGuestMsg(m, res) {
    if (m.t === 'welcome') {
      S.seat = m.seat; S.key = m.key;
      LS('klabor-key-' + S.code, m.key);
      /* Куда возвращаться, если вылетел. Код стола и ключ места и так
         лежали в хранилище, но добраться до них можно было только через
         «Присоединиться» с ручным вводом. Теперь это одна запись, и меню
         делает из неё кнопку «Вернуться за стол». */
      try {
        LS('klabor-back', JSON.stringify({
          code: S.code, key: m.key, seat: m.seat, at: Date.now()
        }));
      } catch (e) { }
      S.cfg = m.cfg;
      S.game = new NetGame(m.cfg, m.seat);
      S.lost = false;
      if (S._resolve) S._resolve(m);
      return;
    }
    if (m.t === 'lobby') { S.lobby = m.players; if (UI && UI.lobbyRefresh) UI.lobbyRefresh(m.players); return; }
    if (m.t === 'away') {                            // стол ждёт вылетевшего — и мы ждём вместе с ним
      S.away = m.list || [];
      if (UI && UI.netAway) UI.netAway(S.away);
      return;
    }
    if (m.t === 'seat') {                            // хозяин пересадил — запоминаем новое место
      S.seat = m.seat;
      if (m.key) { S.key = m.key; LS('klabor-key-' + S.code, m.key); }
      if (S.game) S.game.seat = m.seat;
      if (UI && UI.toast) UI.toast('Хозяин пересадил вас на место ' + (m.seat + 1));
      if (window.Boot && Boot.lobbySeat) Boot.lobbySeat();
      return;
    }
    if (m.t === 'chat') {
      if (UI && UI.chatIn) UI.chatIn(m.from, String(m.text || '').slice(0, 200), m.seat);
      return;
    }
    if (m.t === 'bye') {
      S.on = false; UI.toast(m.why || 'Стол закрыт');
      // высаженного гостя не оставляем перед мёртвым списком мест
      try { if (window.Boot && Boot.mainMenu) { UI.closeModal(); Boot.mainMenu(); } } catch (e) { }
      return;
    }
    if (m.t === 'sync') {
      var g = S.game; if (!g) return;
      if (!S.ready) {
        S.ready = true;
        g.applySync(m.pub, m.priv);
        g.pendHold = m.priv.pending || null;
        UI.attach(g, [], g.seat);
        UI.closeModal();
        UI.closeSplash();                         // партия началась — убираем лобби со стола
        if (window.Hall) Hall.where('table');     // из комнаты не уходим — только помечаемся
      } else {
        g.applySync(m.pub, m.priv);
        g.pendHold = m.priv.pending || null;
      }
      UI.netEvents(m.ev || []);
    }
  }

  function updateMe(name, face) {
    if (!S.on) return;
    if (S.host) {                                   // хозяин меняет себе сам
      if (name) S.conns[0].name = String(name).slice(0, 14);
      if (typeof face === 'number' && face >= 0) S.conns[0].face = face;
      if (window.Boot && Boot.statCard) S.conns[0].stats = Boot.statCard();
      if (S.game) {
        if (name) S.game.names[0] = S.conns[0].name;
        if (S.game.faces) S.game.faces[0] = S.conns[0].face;
        if (!S.game.stats) S.game.stats = [];
        S.game.stats[0] = S.conns[0].stats;
        broadcast(S.game);
      }
      lobbyPush();
      return;
    }
    send(S.conns[0], {
      t: 'me', name: name || undefined, face: face,
      stats: (window.Boot && Boot.statCard) ? Boot.statCard() : null
    });
  }

  function onLost() {
    if (!S.on || S.host) return;
    S.lost = true;
    if (UI && UI.netLost) UI.netLost();
  }

  function reconnect() {
    /* Прежний пир после обрыва новых соединений не принимает и сам ни
       к кому не подключится — его надо гасить целиком, а не «чинить». */
    S.conns = [];
    try { if (S.peer) S.peer.destroy(); } catch (e) { }
    S.peer = null; S.ready = false;
    return joinRoom(S.code, LS('klabor-name') || 'Игрок', LS('klabor-key-' + S.code) || '', S.myFace);
  }

  /* ---------- возврат за стол ----------

     Ник: «при обрыве игрок вылетает и не может вернуться назад в той же
     сессии — он не может сесть за своё старое место».

     Место ему вернуть умел уже номер игрока. Вернуться было НЕЧЕМ:
     `reconnect` в игре не вызывал никто. Гость видел красную кнопку
     «Связь!» — и дальше только главное меню и новый стол.

     Теперь гость стучится сам, с растущей паузой, пока хозяин не
     отзовётся. Пир каждый раз новый, а `hello` идёт с тем же номером и
     ключом — и хозяин отдаёт ему его место. */
  var looping = null, backT = null, loopStop = false;
  function reconnectLoop(onTry, limit) {
    if (looping) return looping;
    clearTimeout(backT); loopStop = false;
    var n = 0, code = S.code;
    looping = new Promise(function (res, rej) {
      (function once() {
        if (loopStop || S.host || S.code !== code) { looping = null; return rej(new Error('стол уже не тот')); }
        n++;
        if (onTry) onTry(n);
        /* Неудачный вход гасит признак «мы за столом» — для входа с нуля
           это правда, для возврата нет: место за нами держат, и стучаться
           мы собираемся до конца. Поэтому поднимаем признак сами, иначе
           цикл обрывался на первой же неудачной попытке. */
        S.on = true;
        reconnect().then(function (w) {
          S.lost = false; looping = null; res(w);
        }, function () {
          if (n >= (limit || 40)) { looping = null; return rej(new Error('стол не отозвался')); }
          backT = setTimeout(once, Math.min(6000, 1200 + n * 400));
        });
      })();
    });
    return looping;
  }
  function stopLoop() { loopStop = true; clearTimeout(backT); looping = null; }

  /* ---------- закрыть стол ----------

     Ник: «когда заканчивается игра с сетевыми игроками, кнопка „ещё
     партию“ баганутая — запускается для одного игрока. Просто оставь
     кнопку выйти в лобби, где игроки выходят в главное меню, а текущий
     стол закрывается».

     Так и делаем: хозяин говорит всем «стол закрыт» (у гостя это уже
     разобрано — он получает `bye`, видит причину и уходит в меню),
     убирает сохранённый стол и гасит связь. Гость просто уходит сам. */
  function closeTable(why) {
    if (!S.on) return;
    if (S.host) {
      for (var i = 1; i < S.conns.length; i++) {
        var c = S.conns[i];
        if (!c || !c.conn) continue;
        try { send(c.conn, { t: 'bye', why: why || 'Партия окончена, стол закрыт.' }); } catch (e) { }
        try { c.conn.close(); } catch (e) { }
        c.conn = null;
      }
      dropSaved();
    }
    leave();
  }

  function leave() {
    stopLoop();
    try { if (S.peer) S.peer.destroy(); } catch (e) { }
    S.on = false; S.host = false; S.ready = false; S.peer = null; S.conns = []; S.game = null;
    S.away = []; S.lost = false; S.lastHost = 0;
    if (UI && UI.netAway) UI.netAway([]);
  }

  /* ---------- часовой ----------
     Один на всё: он и пульс стучит, и терпение считает. Тикаем чаще,
     чем стучим: шаг в полсекунды нужен, чтобы сроки не округлялись до
     четырёх секунд — это видно и на столе, и в проверках. */
  var lastPing = 0;
  setInterval(function () {
    if (!S.on) return;
    var now = Date.now(), i, c;
    if (S.host) {
      for (i = 1; i < S.conns.length; i++) {
        c = S.conns[i];
        if (!c || !c.conn) continue;
        if (now - (c.conn._seen || now) > T.dead) {
          var dead = c.conn;
          try { dead.close(); } catch (e) { }
          dropConn(dead);                            // молчит слишком долго — считаем, что ушёл
        }
      }
      for (i = 1; i < S.conns.length; i++) {
        c = S.conns[i];
        if (c && c.away && now >= c.away) seatBot(i);
      }
      return;
    }
    var h = S.conns && S.conns[0];
    if (!h) return;
    if (h.open && now - lastPing >= T.beat) { lastPing = now; send(h, { t: 'ping' }); }
    if (!S.lost && S.lastHost && now - S.lastHost > T.dead) {
      try { h.close(); } catch (e) { }
      onLost();
    }
  }, 500);

  function startGame(game) {
    S.game = game; S.ready = true;
    for (var i = 0; i < S.conns.length; i++) if (S.conns[i]) S.conns[i].sent = 0;
    broadcast(game);
  }

  return {
    S: S, createRoom: createRoom, joinRoom: joinRoom, broadcast: broadcast,
    startGame: startGame, leave: leave, reconnect: reconnect, loadPeer: loadPeer,
    T: T, reconnectLoop: reconnectLoop, seatBot: seatBot, awayList: awayList,
    newPeer: newPeer, brokerText: brokerText, brokerCfg: brokerCfg,
    setBroker: setBroker, testBroker: testBroker,
    myUid: myUid, setUid: setUid, newUid: newUid,
    saveHost: saveHost, savedHost: savedHost, dropSaved: dropSaved, updateMe: updateMe,
    closeTable: closeTable,
    savedBack: savedBack, dropBack: dropBack,
    chat: chat,
    loadPeer: loadPeer, PREFIX: PREFIX, send: send,
    names: names, lobbyPush: lobbyPush, swapSeats: swapSeats, kick: kick, lobbyList: function () { return S.lobby || []; }, NetGame: NetGame, rndKey: rndKey, LS: LS
  };
})();

/* ============================================================
   КЛАБОР — холл: кто сейчас в меню и о чём говорят

   Своего сервера у игры нет, поэтому холл держит браузер одного из игроков.
   Все занимают один и тот же известный адрес у брокера; кому он достался —
   тот и «главный в комнате»: он ведёт список и пересылает сообщения.
   Ушёл главный — оставшиеся через случайную паузу переизбирают нового.

   Истории нет и не задумано: зашёл — видишь то, что говорят сейчас.
   ============================================================ */
var Hall = (function () {
  'use strict';

  var HALL = 'HALL';                 // адрес комнаты у брокера: PREFIX + HALL
  var PING = 20000;                  // как часто напоминаем о себе
  var CLAIM_WAIT = 2600;             // сколько ждём, пока займётся адрес

  var H = {
    on: false, host: false, ready: false,
    peer: null, hostConn: null, conns: [],
    me: { id: '', name: '', face: -1, table: null, where: 'room' },
    members: [], msgs: [], hostName: '',
    onChange: null, err: ''
  };

  // счётчик попыток: старые таймеры и события от прошлого соединения
  // не должны рушить уже поднятую комнату
  var gen = 0;
  function now() { return Date.now(); }
  function hallId() { return Net.PREFIX + HALL; }
  function fire() { if (H.onChange) try { H.onChange(); } catch (e) { } }

  /* Звуки комнаты. Наружу отдаём только повод — играть или молчать,
     решает оболочка (за столом молчим всегда).
     Про свои же действия не сигналим: вошёл кто-то другой, сказал кто-то другой,
     стол поднял кто-то другой. */
  function snd(k) { if (H.onSound) try { H.onSound(k); } catch (e) { } }
  var seenIds = null;
  function noteMembers() {
    var ids = H.members.map(function (m) { return m.id; });
    if (seenIds === null) { seenIds = ids; return; }     // первый список — молчим
    var me = H.me.id, fresh = ids.filter(function (id) {
      return id !== me && seenIds.indexOf(id) < 0;
    });
    seenIds = ids;
    if (fresh.length) snd('join');
  }

  function line(kind, text, from, code, N) {
    H.msgs.push({ k: kind, t: text, from: from || '', code: code || null, N: N || 0, ts: now() });
    if (H.msgs.length > 60) H.msgs.splice(0, H.msgs.length - 60);
    fire();
  }

  /* ---------- вход ---------- */

  /* Вместе с именем и портретом человек несёт в комнату визитку: сколько
     портретов открыл, сколько секретов выбил, пара лучших достижений.
     Это несколько чисел, а не вся статистика — список рассылается всем
     при каждом изменении, и тяжёлую поклажу туда класть нельзя. */
  function enter(name, face, onChange, card) {
    if (H.on) { H.onChange = onChange; if (card) H.me.card = card; fire(); return; }
    H.on = true; H.err = ''; H.onChange = onChange;
    H.me.name = (name || 'Игрок').slice(0, 14);
    H.me.face = (face == null ? -1 : face);
    H.me.card = card || null;
    H.me.table = null;
    H.me.where = 'room';
    H.members = []; H.msgs = []; seenIds = null;
    Net.loadPeer().then(function (ok) {
      if (!ok) { H.err = 'нет связи с брокером'; H.on = false; fire(); return; }
      claim();
    }).catch(function () { H.err = 'нет связи с брокером'; H.on = false; fire(); });
  }

  // сперва пробуем стать главным; адрес занят — значит холл уже есть, идём гостем
  function claim() {
    if (!H.on) return;
    var my = ++gen, p, done = false;
    try { p = Net.newPeer(hallId()); } catch (e) { return guest(my); }
    p.on('open', function () {
      if (done || my !== gen || !H.on) { try { p.destroy(); } catch (e) { } return; }
      done = true;
      H.peer = p; H.host = true; H.ready = true;
      H.me.id = 'host';
      H.hostName = H.me.name;
      H.members = [{ id: 'host', name: H.me.name, face: H.me.face,
        card: H.me.card, table: null, where: H.me.where, host: true }];
      seenIds = ['host'];        // подняли комнату: мы в ней одни, дальше всякий новый — со звуком
      p.on('connection', onGuest);
      line('sys', 'Комната поднята. Пока главный тут — вы.');
      fire();
    });
    p.on('error', function () {
      if (done || my !== gen || !H.on) return;
      done = true;
      try { p.destroy(); } catch (e) { }
      guest(my);
    });
    setTimeout(function () {
      if (done || my !== gen || !H.on) return;
      done = true;
      try { p.destroy(); } catch (e) { }
      guest(my);
    }, CLAIM_WAIT);
  }

  function guest(my) {
    if (!H.on || my !== gen) return;
    var p, done = false;
    try { p = Net.newPeer(null); } catch (e) { H.err = 'нет связи'; fire(); return; }
    H.peer = p; H.host = false;
    p.on('open', function () {
      if (my !== gen) { try { p.destroy(); } catch (e) { } return; }
      var c = p.connect(hallId(), { reliable: true });
      H.hostConn = c;
      c.on('open', function () {
        if (my !== gen) return;
        H.lastHost = now();
        done = true; H.ready = true;
        Net.send(c, { t: 'hi', name: H.me.name, face: H.me.face, card: H.me.card, w: H.me.where });
        fire();
      });
      c.on('data', function (m) { H.lastHost = now(); if (my === gen) onHostMsg(m); });
      c.on('close', function () { if (my === gen) lostHost(); });
      c.on('error', function () { if (!done && my === gen) retry(); });
    });
    p.on('error', function () { if (!done && my === gen) retry(); });
    setTimeout(function () { if (!done && H.on && my === gen) retry(); }, CLAIM_WAIT);
  }

  // главный ушёл — ждём вразнобой и пробуем занять его место
  function retry() {
    if (!H.on) return;
    gen++;                                    // всё, что было до этого, больше не наше
    H.ready = false; H.host = false; H.hostConn = null; H.members = [];
    try { if (H.peer) H.peer.destroy(); } catch (e) { }
    H.peer = null;
    fire();
    setTimeout(claim, 200 + Math.floor(Math.random() * 900));
  }

  function lostHost() {
    if (!H.on || H.host) return;
    line('sys', 'Главный вышел из комнаты, ищем нового…');
    retry();
  }

  function leave() {
    H.on = false; H.ready = false; H.host = false; gen++;
    if (H.hostConn) { try { Net.send(H.hostConn, { t: 'bye' }); } catch (e) { } }
    try { if (H.peer) H.peer.destroy(); } catch (e) { }
    H.peer = null; H.hostConn = null; H.conns = []; H.members = []; H.msgs = [];
    fire();
  }

  /* ---------- главный ---------- */

  function onGuest(conn) {
    conn._seen = now();
    H.conns.push(conn);
    conn.on('data', function (m) { conn._seen = now(); fromGuest(conn, m); });
    conn.on('close', function () { dropGuest(conn); });
    conn.on('error', function () { dropGuest(conn); });
  }

  function dropGuest(conn) {
    var i = H.conns.indexOf(conn);
    if (i >= 0) H.conns.splice(i, 1);
    var m = memberOf(conn);
    if (m) {
      H.members = H.members.filter(function (x) { return x.id !== m.id; });
      line('sys', m.name + ' вышел из комнаты.');
      pushList();
    }
  }

  function memberOf(conn) {
    for (var i = 0; i < H.members.length; i++) if (H.members[i].conn === conn) return H.members[i];
    return null;
  }

  function fromGuest(conn, m) {
    if (!m || !m.t) return;
    if (m.t === 'hi') {
      var was = memberOf(conn);
      if (was) {                                 // это не новый игрок, а тот же сменил имя
        was.name = String(m.name || was.name).slice(0, 14);
        if (typeof m.face === 'number' && m.face >= 0) was.face = m.face;
        if (m.card) was.card = m.card;
        pushList();
        return;
      }
      var id = 'p' + (++seq);
      var mem = { id: id, name: String(m.name || 'Игрок').slice(0, 14),
        face: (typeof m.face === 'number' ? m.face : -1), card: m.card || null,
        table: null, where: (m.w === 'table' || m.w === 'bots') ? m.w : 'room',
        conn: conn };
      H.members.push(mem);
      Net.send(conn, { t: 'you', id: id });
      line('sys', mem.name + ' вошёл в комнату.');
      pushList();
      return;
    }
    var who = memberOf(conn);
    if (!who) return;
    if (m.t === 'msg') return broadcastMsg(who.name, String(m.text || '').slice(0, 200), who.id);
    if (m.t === 'table') {
      who.table = m.code ? { code: String(m.code).slice(0, 6), N: m.N || 3 } : null;
      if (who.table) tableLine(who.name, who.table.code, who.table.N, who.id);
      else line('sys', who.name + ' закрыл стол.');
      pushList();
      return;
    }
    if (m.t === 'note') {                       // «сели играть» — разносим от имени комнаты
      var tx = String(m.text || '').slice(0, 120);
      if (tx) { line('sys', tx); toAll({ t: 'sys', text: tx }); }
      return;
    }
    /* Раньше тут был `gone`: сел играть — и мы вычёркивали человека из
       комнаты совсем. Ник: «можешь показывать тех, кто онлайн, но условно
       в игре?» Может, и это честнее: человек никуда не делся, он просто
       занят. Теперь вместо вычёркивания — пометка, где он. */
    if (m.t === 'where') {
      var w = (m.w === 'table' || m.w === 'bots') ? m.w : 'room';
      if (who.where !== w) { who.where = w; whereLine(who.name, w, who.id); }
      pushList();
      return;
    }
    if (m.t === 'bye') return dropGuest(conn);
  }
  var seq = 0;

  function pubList() {
    return H.members.map(function (m) {
      return { id: m.id, name: m.name, face: m.face, card: m.card || null,
        table: m.table, where: m.where || 'room', host: !!m.host };
    });
  }
  function pushList() {
    // соединение могло тихо отвалиться — такие места в списке не держим
    H.members = H.members.filter(function (m) { return m.host || (m.conn && m.conn.open !== false); });
    H.conns = H.conns.filter(function (c) { return c && c.open !== false; });
    var l = pubList();
    H.conns.forEach(function (c) { Net.send(c, { t: 'list', members: l, hostName: H.me.name }); });
    noteMembers();
    fire();
  }
  function toAll(msg) {
    H.conns.forEach(function (c) { Net.send(c, msg); });
  }
  // id отправителя едет вместе с репликой: по имени «свой-чужой» не отличить,
  // двое могут назваться одинаково
  function broadcastMsg(from, text, sid) {
    if (!text) return;
    line('msg', text, from);
    if (sid !== H.me.id) snd('msg');
    toAll({ t: 'msg', from: from, text: text, sid: sid });
  }
  function tableLine(name, code, N, sid) {
    line('table', name + ' создал стол' + (N ? ' на ' + N : ''), name, code, N);
    if (sid !== H.me.id) snd('table');
    toAll({ t: 'table', from: name, code: code, N: N, sid: sid });
  }

  /* Короткая строка в разговор: человек сел играть или вернулся. Это не
     болтовня, а повод не гадать, куда он делся посреди разговора. */
  function whereLine(name, w, sid) {
    var t = w === 'table' ? name + ' сел за стол.'
      : w === 'bots' ? name + ' сел играть с ботами.'
        : name + ' вернулся в комнату.';
    line('sys', t);
    toAll({ t: 'sys', text: t });
    if (sid !== H.me.id && w === 'table') snd('table');
  }

  /* Сколько людей где. Ровно то, что Ник просил показывать: сколько в
     комнате, сколько за сетевым столом, сколько играет с ботами. */
  function counts() {
    var c = { all: 0, room: 0, table: 0, bots: 0 };
    for (var i = 0; i < H.members.length; i++) {
      var w = H.members[i].where || 'room';
      c.all++;
      c[w === 'table' ? 'table' : (w === 'bots' ? 'bots' : 'room')]++;
    }
    return c;
  }

  /* ---------- гость ---------- */

  function onHostMsg(m) {
    if (!m || !m.t) return;
    if (m.t === 'you') { H.me.id = m.id; return; }
    if (m.t === 'list') {
      H.members = m.members || [];
      noteMembers();
      if (m.hostName && m.hostName !== H.hostName) {
        var first = !H.hostName;
        H.hostName = m.hostName;
        if (!first) line('sys', 'Теперь главный в комнате — ' + m.hostName + '.');
      }
      fire(); return;
    }
    if (m.t === 'msg') {
      if (m.sid !== H.me.id) snd('msg');
      return line('msg', m.text, m.from);
    }
    if (m.t === 'sys') return line('sys', m.text);
    if (m.t === 'table') {
      if (m.sid !== H.me.id) snd('table');
      return line('table', m.from + ' создал стол' + (m.N ? ' на ' + m.N : ''), m.from, m.code, m.N);
    }
  }

  /* ---------- что делает игрок ---------- */

  function say(text) {
    text = String(text || '').trim().slice(0, 200);
    if (!text || !H.ready) return;
    if (H.host) broadcastMsg(H.me.name, text, H.me.id);
    else Net.send(H.hostConn, { t: 'msg', text: text });
  }

  // объявить, что я поднял стол (или закрыл его)
  function table(code, N) {
    if (!H.ready) return;
    H.me.table = code ? { code: code, N: N } : null;
    if (H.host) {
      var m = H.members.filter(function (x) { return x.id === 'host'; })[0];
      if (m) m.table = H.me.table;
      if (code) tableLine(H.me.name, code, N, H.me.id);
      else line('sys', 'Вы закрыли стол.');
      pushList();
    } else Net.send(H.hostConn, { t: 'table', code: code || null, N: N || 0 });
  }

  /* ---------- где человек сейчас ----------

     Ник: «можешь показывать тех, кто онлайн, но условно в игре? В сетевой
     или просто с ботами?»

     Раньше на этом месте стоял выход из комнаты: сел играть — и тебя в
     ней больше нет. Поэтому комната всегда показывала «Люди 1», даже
     когда за тремя столами шла игра: все играющие из неё вычёркивались.

     Так сделано в «Колдовстве», и оттуда же взята цена: связь с комнатой
     во время партии НЕ рвём, только меняем отметку. Это второе
     соединение рядом с игровым — лёгкое (раз в двадцать секунд), но
     помнить о нём надо, и звуки комнаты за столом обязаны молчать. */
  function where(w) {
    w = (w === 'table' || w === 'bots') ? w : 'room';
    if (H.me.where === w) return;
    H.me.where = w;
    if (!H.on || !H.ready) return;
    if (H.host) {
      var m = null, i;
      for (i = 0; i < H.members.length; i++) if (H.members[i].id === 'host') m = H.members[i];
      if (m) m.where = w;
      whereLine(H.me.name, w, H.me.id);
      pushList();
    } else Net.send(H.hostConn, { t: 'where', w: w });
  }

  // сменил имя или портрет — заново представиться
  function updateMe(name, face, card) {
    if (name) H.me.name = String(name).slice(0, 14);
    if (typeof face === 'number' && face >= 0) H.me.face = face;
    if (card) H.me.card = card;
    if (!H.ready) return;
    if (H.host) {
      H.hostName = H.me.name;
      var m = H.members.filter(function (x) { return x.id === 'host'; })[0];
      if (m) { m.name = H.me.name; m.face = H.me.face; m.card = H.me.card; }
      pushList();
    } else Net.send(H.hostConn, { t: 'hi', name: H.me.name, face: H.me.face, card: H.me.card });
  }

  /* Объявить на всю комнату, что стол сел играть. Говорит хозяин стола
     перед тем, как выйти: иначе комната видит только «такой-то вышел»
     и не понимает, партия началась или человек закрыл вкладку. */
  function announce(text) {
    text = String(text || '').trim().slice(0, 120);
    if (!text || !H.ready) return;
    if (H.host) { line('sys', text); toAll({ t: 'sys', text: text }); }
    else Net.send(H.hostConn, { t: 'note', text: text });
  }

  /* ---------- пульс комнаты ----------

     Пока играющие вычёркивались, список жил сам собой: вышел — убрали.
     Теперь люди остаются в нём часами, и молчаливый обрыв (а он молчит
     всегда — см. платформа/01-СЕТЬ-СТОЛА) оставил бы в комнате призраков:
     «5 в сети», а их двое. Поэтому главный считает, когда в последний раз
     слышал каждого, а гость — когда в последний раз слышал главного. */
  var DEAD = 70000;          // три пропущенных круга — значит человека нет

  setInterval(function () {
    if (!H.on || !H.ready) return;
    if (H.host) {
      var t = now(), i, c;
      for (i = H.conns.length - 1; i >= 0; i--) {
        c = H.conns[i];
        if (c && t - (c._seen || t) > DEAD) { try { c.close(); } catch (e) { } dropGuest(c); }
      }
      pushList();
      return;
    }
    Net.send(H.hostConn, { t: 'ping' });
    if (H.lastHost && now() - H.lastHost > DEAD) lostHost();
  }, PING);

  return {
    S: H, enter: enter, leave: leave, say: say, table: table,
    sound: function (f) { H.onSound = f; },
    where: where, counts: counts, updateMe: updateMe, announce: announce,
    list: function () { return H.members.slice(); },
    log: function () { return H.msgs.slice(); }
  };
})();

/* ============================================================
   КЛАБОР — стол, анимация, ввод
   ============================================================ */
var UI = (function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var g = null, brains = [], ME = 0, evIdx = 0, busy = false, gen = 0;
  var SEATIDS = ['seatL', 'seatT', 'seatR'];
  var speed = 1;

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function wait(ms, cb) { var my = gen; setTimeout(function () { if (my === gen) cb(); }, ms / speed); }

  /* ---------- места ---------- */
  function seatEl(p) {
    if (p === ME) return null;
    var off = (p - ME + g.N) % g.N;               // 1,2,3 по часовой
    var idx = (g.N === 2) ? 1 : ((g.N === 3) ? (off === 1 ? 0 : 2) : (off - 1));
    return document.getElementById(SEATIDS[idx]);
  }

  function faceOf(p) { return (g.faces && g.faces[p] != null) ? g.faces[p] : -1; }
  function letterOf(p) { return (g.names[p] || '?').charAt(0).toUpperCase(); }

  var bubbles = {};
  function badge(full, short) {
    return '<span class="badge" data-s="' + short + '">' + full + '</span>';
  }

  function drawSeats() {
    ['seatL', 'seatT', 'seatR'].forEach(function (id) {
      var e = document.getElementById(id); e.style.display = 'none'; e.innerHTML = '';
    });
    for (var p = 0; p < g.N; p++) {
      if (p === ME) continue;
      var s = seatEl(p); if (!s) continue;
      s.style.display = '';
      // у меток есть короткий вариант: на узком экране CSS показывает его
      var b = '';
      if (p === g.dealer) b += badge('сдаёт', 'сд.');
      if (p === g.declarer) b += badge('играет', 'игр.');
      if (g.o.pairs && p === (ME + 2) % 4) b += badge('ваш партнёр', 'пара');
      var fan = '';
      var n = (dealing || !g.hands) ? 0 : g.hands[p].length;
      for (var i = 0; i < n; i++) fan += '<i></i>';
      var bub = bubbles[p];
      s.innerHTML = '<div class="pl" data-prof="' + p + '">' + ART.ava(faceOf(p), letterOf(p), 'sm') +
        '<span class="nm">' + g.names[p] + '</span>' + b +
        (g.o.pairs ? '' : '<span class="sc">' + g.score[p] + '</span>') +
        '</div><div class="fan">' + fan + '</div>' +
        '<div class="bubble ' + (bub ? bub.c + ' on' : '') + '" id="bub' + p + '">' +
        (bub ? bub.t : '') + '</div>';
      s.classList.toggle('act', !!(g.pending && g.pending.p === p));
    }
    // своё место — портрет, счёт и метки
    var me = $('#seatMe');
    if (me) {
      var mb = '';
      if (ME === g.dealer) mb += badge('сдаёте', 'сд.');
      if (ME === g.declarer) mb += badge('играете', 'игр.');
      if (g.o.pairs) mb += badge('с ' + g.names[(ME + 2) % 4], 'с ' + g.names[(ME + 2) % 4]);
      me.innerHTML = '<span data-prof="' + ME + '">' + ART.ava(faceOf(ME), letterOf(ME), 'sm') + '</span>' +
        '<span class="nm">' + g.names[ME] + '</span>' + mb +
        (g.o.pairs ? '' : '<span class="sc">' + g.score[ME] + '</span>');
      me.classList.toggle('act', !!(g.pending && g.pending.p === ME));
    }
  }

  function bubble(p, txt, cls, ms, realTime) {
    var now = Date.now(), cur = bubbles[p];
    // короткая отметка хода («Пас») не должна сбивать реплику на полуслове
    if (cur && cur.c === 'talk' && cls !== 'talk' && now < (cur.until || 0) - 300) return;
    bubbles[p] = { t: txt, c: cls || '', until: now + (ms || 1500) };
    if (p === ME) drawMyBubble(); else drawSeats();
    var my = ++bubSeq[p] || (bubSeq[p] = 1), myGen = gen;
    function off() {
      if (bubSeq[p] !== my || myGen !== gen) return;
      delete bubbles[p];
      if (p === ME) drawMyBubble(); else drawSeats();
    }
    // реплики висят по настоящим часам: на скорости ×3 их иначе не успеть прочесть
    if (realTime) setTimeout(off, ms || 1500);
    else wait(ms || 1500, off);
  }

  // над своей рукой всплывает и реплика, и обычная отметка хода («Пас», «Беру ♠»)
  function drawMyBubble() {
    var e = $('#bubMe'); if (!e) return;
    var b = bubbles[ME];
    e.textContent = b ? b.t : '';
    e.className = 'bubble ' + (b && b.c ? b.c : '') + (b ? ' on' : '');
  }
  var bubSeq = {};

  /* ---------- одесский базар ---------- */
  // за столом говорят все — и боты, и живые игроки, включая вас
  function charOfSeat(p) {
    if (g.chars && g.chars[p]) return g.chars[p];
    if (p === ME && window.Boot) {
      var c = Boot.CFG.myChar || 'auto';
      if (c === 'off') return null;
      if (c !== 'auto') return c;
    }
    var f = faceOf(p);
    return (f >= 0 && ART.FACE_CH) ? ART.FACE_CH[f % ART.FACE_CH.length] : 'b';
  }

  // пол берём из портрета: «Взял» из уст мадам Двойры звучало бы дико
  function sexOfSeat(p) {
    var f = faceOf(p);
    if (f < 0 && p === ME && window.Boot) f = Boot.CFG.face;
    return (f >= 0 && ART.FACE_SEX) ? ART.FACE_SEX[f % ART.FACE_SEX.length] : '';
  }

  function talk(p, key, ctx, force) {
