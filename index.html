    var isNet = !!(g.isNet || (typeof Net !== 'undefined' && Net.S && Net.S.on));
    var buttons = isNet
      ? '<div class="row"><button class="btn pri wide" data-r="3">Выйти в лобби</button></div>' +
        '<div class="hint">Стол закроется у всех. Новую партию поднимите из лобби.</div>'
      : '<div class="row"><button class="btn pri wide" data-r="1">Ещё партию</button>' +
        '<button class="btn wide" data-r="2">В меню</button></div>';
    modal('<h3>' + (mine ? 'Вы выиграли партию!' : 'Партию выиграл ' + win) + '</h3>' +
      '<div class="sub">Счёт: ' + rows + '</div>' + gift +
      '<div class="sub">' + (window.Boot ? Boot.statsLine() : '') + '</div>' + buttons,
      function (m) {
        m.onclick = function (ev) {
          var b = ev.target.closest('[data-r]'); if (!b) return;
          closeModal();
          if (b.dataset.r === '3') {
            try { Net.closeTable('Партия окончена — стол закрыт.'); } catch (e) { }
            return Boot.mainMenu();
          }
          if (b.dataset.r === '2') return Boot.dlgMenu();
          Boot.start();
        };
      }, { light: true });
  }


  /* ---------- копирование в буфер ---------- */
  function copyText(t) {
    return new Promise(function (res) {
      var done = function (ok) { res(ok); };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext)
          return navigator.clipboard.writeText(t).then(function () { done(true); }, function () { done(fallback(t)); });
      } catch (e) { }
      done(fallback(t));
    });
    // itch крутит игру в iframe, где clipboard API часто запрещён — уходим в textarea
    function fallback(txt) {
      try {
        var a = document.createElement('textarea');
        a.value = txt;
        a.setAttribute('readonly', '');
        a.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
        document.body.appendChild(a);
        a.select(); a.setSelectionRange(0, txt.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(a);
        return ok;
      } catch (e) { return false; }
    }
  }

  // одна кнопка на все экраны: где угодно в разметке достаточно data-cpy="ЧТО КОПИРОВАТЬ"
  function copyHTML(val, cls) {
    return '<button class="cpy' + (cls ? ' ' + cls : '') + '" data-cpy="' + val +
      '" title="Скопировать" aria-label="Скопировать">' + (cls === 'inline' ? 'копировать' : '⧉') + '</button>';
  }

  function onCopyClick(ev) {
    var el = ev.target.closest('[data-cpy]');
    if (!el) return;
    ev.preventDefault(); ev.stopPropagation();
    var val = el.dataset.cpy;
    copyText(val).then(function (ok) {
      toast(ok ? 'Скопировано: ' + val : 'Не вышло скопировать — выделите и нажмите Ctrl+C');
      if (!ok || el.tagName !== 'BUTTON') return;
      var was = el.innerHTML;
      el.classList.add('done'); el.innerHTML = el.classList.contains('inline') ? 'готово' : '✓';
      setTimeout(function () { el.classList.remove('done'); el.innerHTML = was; }, 1200);
    });
  }

  var tt = null;
  function toast(t) {
    var e = $('#toast'); e.textContent = t; e.classList.add('on');
    clearTimeout(tt); tt = setTimeout(function () { e.classList.remove('on'); }, 1300);
  }

  /* ---------- панели ---------- */
  // всего бейтов за партию — по сторонам, чтобы пара не считалась дважды
  function bt2() {
    var t = 0, sides = g.sideList();
    for (var i = 0; i < sides.length; i++) t += (g.sideBeits ? g.sideBeits(i) : g.beits[sides[i][0]]);
    return t;
  }

  // Последняя взятка целиком: чем ходили, кто забрал и сколько это стоило.
  // Держать это в голове — работа каталы, а панель просто не даёт соврать памяти.
  function lastTrickHTML() {
    var t = (g.tricks && g.tricks.length) ? g.tricks[g.tricks.length - 1] : (g.lastTrick || null);
    if (!t || !t.plays || !t.plays.length)
      return '<div class="ltr empty">Взяток ещё не было.</div>';
    var cards = t.plays.map(function (pl) {
      return '<div class="ltc' + (pl.p === t.w ? ' win' : '') + '">' +
        '<div class="card">' + ART.faceHTML(pl.c) + '</div>' +
        '<span>' + (pl.p === ME ? 'вы' : shortName(g.names[pl.p])) + '</span></div>';
    }).join('');
    var pts = t.v + (g.hands && g.hands[t.w] && !g.hands[t.w].length ? K.POSLED : 0);
    return '<div class="ltr"><div class="ltcards">' + cards + '</div>' +
      '<div class="ltwho">' + (t.w === ME ? 'забрали вы'
        : 'забрал' + (g.sex && g.sex[t.w] === 'f' ? 'а ' : ' ') + g.names[t.w]) + ' <b>+' + pts + '</b>' +
      (pts !== t.v ? ' <i>(с последом)</i>' : '') + '</div></div>';
  }
  function shortName(n) {
    n = String(n || '');
    var i = n.indexOf(' ');
    return i > 0 ? n.slice(0, i) : n;
  }

  function drawScore() {
    var i, cards = '';

    // счёт — карточками, а не строчками таблицы: аватарки крупно, имена под ними
    function teamCard(list, pts, bt, tk, mine, sideIdx) {
      var avas = list.map(function (p) {
        return '<span data-prof="' + p + '" title="' + g.names[p] + '">' +
          ART.ava(faceOf(p), letterOf(p), 'md') + '</span>';
      }).join('');
      var names = list.map(function (p) {
        return '<span class="who' + (p === ME ? ' you' : '') + '">' + g.names[p] + '</span>';
      }).join('<i class="amp">+</i>');
      var lead = g.pending && list.indexOf(g.pending.p) >= 0;
      var decl = list.indexOf(g.declarer) >= 0;
      return '<div class="tcard' + (mine ? ' me' : '') + (lead ? ' act' : '') + '">' +
        '<div class="tava">' + avas + '</div>' +
        '<div class="tbody"><div class="tnames">' + names +
        (decl ? '<b class="tflag">играет</b>' : '') + '</div>' +
        '<div class="tsub">бейты <b>' + bt + '</b> · взятки <b>' + tk + '</b></div></div>' +
        '<div class="tpts">' + pts + '</div></div>';
    }

    if (g.o.pairs) {
      var sides = g.sideList();
      for (i = 0; i < sides.length; i++) {
        var tk = 0;
        sides[i].forEach(function (p) { tk += (g.taken ? g.taken[p] : 0); });
        // бейт у пары общий — не складываем напарников, иначе на карточке 3, а штрафа нет
        cards += teamCard(sides[i], g.sideScore(i), g.sideBeits ? g.sideBeits(i) : g.beits[sides[i][0]],
          tk, sides[i].indexOf(ME) >= 0, i);
      }
    } else {
      for (i = 0; i < g.N; i++)
        cards += teamCard([i], g.score[i], g.beits[i], (g.taken ? g.taken[i] : 0), i === ME, i);
    }

    /* Сыгранные раунды — списком под плиткой, по клику.

       Ник: «когда заканчивается любой раунд, нигде не виден счёт
       прошлого — он обнуляется и пропадает; надо, чтобы по клику на
       раунды можно было развернуть счёт прошлых». Табло и правда
       обнуляется: это правило матча, а не беда. Беда была в том, что
       числа после обнуления не оставались нигде. */
    function roundLogHTML() {
      var l = (g.roundLog || []);
      if (!l.length) return '';
      if (!roundsOpen) return '';
      return '<div class="rlog">' + l.map(function (r) {
        var sc = (r.score || []).map(function (v, k) {
          return '<b' + (k === r.win ? ' class="won"' : '') + '>' + v + '</b>';
        }).join('<span>:</span>');
        return '<div class="rlogrow"><span class="rl-n">Раунд ' + r.n + '</span>' +
          '<span class="rl-s">' + sc + '</span>' +
          '<span class="rl-w">' + esc(g.sideName(r.win)) + '</span></div>';
      }).join('') + '</div>';
    }
    function roundsTip() {
      var n = (g.roundLog || []).length;
      if (!n) return 'счёт по раундам';
      return '<span class="rl-more">' + (roundsOpen ? 'свернуть' : 'сыграно ' + n +
        (n === 1 ? ' раунд' : ' раунда') + ' — показать счёт') + '</span>';
    }

    // шапка: до скольки играем и — в матче — крупный счёт по раундам
    var head;
    var canOpen = !!(g.roundLog && g.roundLog.length);
    if (g.o.pairs && g.o.match2 && g.finalLeft > 0) {
      head = '<div class="rbar final' + (canOpen ? ' tap' : '') + '"' +
        (canOpen ? ' data-rounds="1"' : '') + '><div class="rb-t">Финал</div>' +
        '<div class="rb-x">осталось раздач <b>' + g.finalLeft + '</b>' +
        (canOpen ? ' · ' + roundsTip() : '') + '</div></div>' + roundLogHTML();
    } else if (g.o.pairs && g.o.match2) {
      head = '<div class="rbar' + (canOpen ? ' tap' : '') + '"' +
        (canOpen ? ' data-rounds="1"' : '') + '>' +
        '<div class="rb-t">Раунд ' + g.round + ' · до ' + g.o.target + '</div>' +
        '<div class="rb-score"><b>' + g.roundWins[0] + '</b><span>:</span><b>' + g.roundWins[1] + '</b></div>' +
        '<div class="rb-x">' + roundsTip() + '</div></div>' + roundLogHTML();
    } else {
      head = '<div class="rbar"><div class="rb-t">Партия</div>' +
        '<div class="rb-score one">до <b>' + g.o.target + '</b></div></div>';
    }

    function line(k, v, hot) {

      line('Комбинации', g.comboWinner >= 0 ? g.names[g.comboWinner] + ' +' + g.comboPts
        : (g.cDecl && g.cDecl.length

  /* Развёрнут ли список раундов. Панель перерисовывается целиком, так
     что помнить это надо снаружи разметки. */
  var roundsOpen = false;

  function drawAll() { drawSeats(); drawTrick(); drawDeck(); drawHand(); drawScore(); drawInfo(); }

  /* ---------- запуск ---------- */
  function attach(game, bs, me) {
    gen++; g = game; brains = bs; ME = me; evIdx = 0; closeModal(); hint(''); selected = null;
    try { window.__g = game; } catch (e) { }   // для тестов: видно состояние стола

    $('#logpane').innerHTML = '';

  function begin() { g.newHand(); pump(); }

  /* ---------- чат за столом ----------
     Только в сетевой партии: с ботами разговаривать не с кем, и вкладка «Чат»
     там не показывается — на её месте остаются «Правила».
     Историю не храним: закрыл вкладку — и всё, как в комнате. */
  var chatLog = [];
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function chatOn() { return !!(window.Net && Net.S.on); }

  function chatHTML() {
    var snd = !!(window.Boot && Boot.CFG && Boot.CFG.snd);
    var body = chatLog.length
      ? chatLog.map(function (x) {
        if (x.sys) return '<div class="cmsg sys">' + esc(x.t) + '</div>';
        return '<div class="cmsg' + (x.me ? ' me' : '') + '"><b>' + esc(x.from) + '</b> ' + esc(x.t) + '</div>';
      }).join('')
      : '<div class="cempty">Разговор за столом. Слышат все живые игроки, ' +
        'боты молчат. Историю не храним — только то, что говорят сейчас.</div>';
    return '<div class="chead"><h4 class="hd">Разговор</h4>' +
      '<button class="btn tiny hsnd' + (snd ? '' : ' off') + '" data-csnd="1" title="' +
      (snd ? 'Звук сообщений включён. Нажмите — замолчит' : 'Звук сообщений выключен. Нажмите — заговорит') +
      '">\u266b ' + (snd ? 'Звук' : 'Тихо') + '</button></div>' +
      '<div class="clog" id="cLog">' + body + '</div>' +
      '<div class="csay"><input class="fld" id="cSay" maxlength="200" placeholder="Сказать за столом…">' +
      '<button class="btn" data-csend="1">Сказать</button></div>';
  }

  function chatDraw() {
    var box = $('#chatpane');
    if (!box) return;
    var f = $('#cSay'), keep = f ? f.value : '', focus = (document.activeElement === f);
    box.innerHTML = chatHTML();
    var f2 = $('#cSay');
    if (f2) { f2.value = keep; if (focus) f2.focus(); }
    var lg = $('#cLog'); if (lg) lg.scrollTop = 1e6;
  }

  function chatSend() {
    var f = $('#cSay'); if (!f) return;
    var t = (f.value || '').trim();
    if (!t) return;
    f.value = '';
    if (window.Net && Net.chat) Net.chat(t);
    // Жванецкий: триста сообщений за столом
    try { if (netLive() && window.Boot) Boot.bumpStats({ nChat: 1 }); } catch (e) { }
  }

  // пришла реплика — своя вернулась от хозяина, чужая пришла впервые
  function chatIn(from, text, seat) {
    if (!text) return;
    var mine = (seat != null && seat === ME);
    chatLog.push({ from: from, t: text, me: mine });
    if (chatLog.length > 60) chatLog.splice(0, chatLog.length - 60);
    chatDraw();
    if (mine) return;
    try { if (window.ART && ART.play) ART.play('msg'); } catch (e) { }
    // вкладка закрыта — коротко подсказываем, что сказали
    var pane = $('#chatpane');
    if (!pane || !pane.classList.contains('on')) toast(from + ': ' + text);
  }

  // вкладка «Чат» есть только в сети, «Правила» — только вне её
  function chatTabs() {
    var on = chatOn();
    $$('#tabs button').forEach(function (b) {
      if (b.dataset.p === 'chatpane') b.hidden = !on;
      if (b.dataset.p === 'rulepane') b.hidden = on;
    });
    $$('#mtabs button').forEach(function (b) {
      if (b.dataset.m === 'chatpane') b.hidden = !on;
      if (b.dataset.m === 'rulepane') b.hidden = on;
    });
    // спрятанная вкладка не должна остаться открытой
    var cur = $('#tabs button.on');
    if (!cur || cur.hidden) showPane('scpane');
    if (on) chatDraw();
  }

  function showPane(id) {
    $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x.dataset.p === id); });
    $$('.pane').forEach(function (x) { x.classList.toggle('on', x.id === id); });
    $$('#mtabs button').forEach(function (x) { x.classList.toggle('on', x.dataset.m === id); });
    if (matchMedia('(max-width:900px)').matches) $('#side').classList.add('on');
  }

  function bindOnce() {
    document.addEventListener('click', onCopyClick, true);
    /* «Посадить бота» в плашке ожидания: хозяин решил не ждать. */
    document.addEventListener('click', function (ev) {
      var ab = ev.target.closest('[data-awbot]');
      if (!ab) return;
      ev.preventDefault(); ev.stopPropagation();
      if (typeof Net !== 'undefined' && Net.seatBot) Net.seatBot(+ab.dataset.awbot);
    }, true);
    document.addEventListener('click', function (ev) {
      if (!ev.target.closest('[data-rounds]')) return;
      roundsOpen = !roundsOpen;
      if (g) drawScore();
    }, true);
    document.addEventListener('click', function (ev) {
      var el = ev.target.closest('[data-prof]');
      if (!el || !g || !window.Boot || !Boot.showProfile) return;
      ev.preventDefault(); ev.stopPropagation();
      Boot.showProfile(+el.dataset.prof);
    }, true);
    var h = $('#hand');
    h.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    window.addEventListener('resize', function () { if (g) drawAll(); });
    window.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      e.preventDefault();
      if ($('#modal').classList.contains('on') && $('#modal').classList.contains('over')) {
        closeModal();                                 // окно поверх меню — просто закрыть
        if (!$('#splash').classList.contains('on')) setPaused(false);
        return;
      }
      /* Escape закрывает экран — но только если есть куда возвращаться.
         Ник: «если нажать ESC случайно, лобби исчезает; лобби — это экран
         вне игры, вступительный». За лобби ничего нет, и закрывать его
         значит оставить человека на пустом столе. Пока партия не идёт,
         Escape тут просто ничего не делает. */
      if ($('#splash').classList.contains('on')) {
        if (g && !g.over) closeSplash();
        return;
      }
      if (window.Boot) Boot.pauseMenu();
    });
    var cp = $('#chatpane');
    if (cp) {
      cp.addEventListener('click', function (ev) {
        if (ev.target.closest('[data-csend]')) return chatSend();
        if (ev.target.closest('[data-csnd]')) {
          if (window.Boot && Boot.toggleSnd) Boot.toggleSnd();
          chatDraw();
        }
      });
      cp.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' && ev.target.id === 'cSay') { ev.preventDefault(); chatSend(); }
      });
    }
    $$('#tabs button').forEach(function (b) {
      b.onclick = function () {
        $$('#tabs button').forEach(function (x) { x.classList.remove('on'); });
        $$('.pane').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on'); document.getElementById(b.dataset.p).classList.add('on');
      };
    });
    $$('#mtabs button').forEach(function (b) {
      b.onclick = function () {
        $$('#mtabs button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        if (b.dataset.m === 'table') { $('#side').classList.remove('on'); return; }
        $('#side').classList.add('on');
        $$('#tabs button').forEach(function (x) { x.classList.toggle('on', x.dataset.p === b.dataset.m); });
        $$('.pane').forEach(function (x) { x.classList.toggle('on', x.id === b.dataset.m); });
      };
    });
  }

  /* ---------- сеть ---------- */
  function netEvents(list) {
    for (var i = 0; i < list.length; i++) g.ev.push(list[i]);
    pump();
  }
  function applyRemote(a) {
    if (!g.pending) return;
    act(a);
  }
  function netFillBot(seat) {
    if (!brains) return;
    brains[seat] = new Bots.Brain(g, seat, Boot.CFG.level);
    if (!pumping && g.pending && g.pending.p === seat) ready();
  }

  /* ---------- человек вернулся за стол ----------

     Ник: «если я вылетел и захожу в игру — бот продолжает держать
     управление и играет за меня, перехватить нельзя, приходится
     пересоздавать стол».

     Причина ровно в том, что у `netFillBot` не было обратной стороны.
     При обрыве связи хозяин заводил на это место мозг бота, и `ready`
     дальше ходил за него: там стоит `if (!brains[p.p]) return` — «за
     это место играет живой, ждём его». Мозг никто не убирал, значит
     после возвращения место навсегда оставалось ботовым, сколько бы
     человек ни жал по картам.

     Убираем мозг — и место снова ждёт живого. Если вопрос уже стоит за
     этим местом, перерисовываем: у вернувшегося должны появиться
     кнопки, а у остальных — пропасть пометка «(бот)». */
  function netFreeSeat(seat) {
    if (!brains || !brains[seat]) return;
    brains[seat] = null;
    drawSeats();
    if (g && g.pending && g.pending.p === seat) hint('Ход: ' + g.names[seat]);
  }
  /* ---------- стол ждёт игрока ----------

     Плашка поверх стола: кого ждём и сколько осталось. Секунды тикают
     на месте — хозяин присылает список только когда он меняется, гонять
     отсчёт по сети незачем. Пустой список значит «все на месте»: тогда
     плашка уходит и пауза снимается. */
  var awayT = null, awayTill = {}, awayWho = [];
  function netAway(list) {
    awayWho = list || [];
    var box = document.getElementById('await');
    clearInterval(awayT); awayT = null;
    if (!awayWho.length) {
      awayTill = {};
      if (box) { box.className = ''; box.innerHTML = ''; }
      netHoldOn(false);
      return;
    }
    var now = Date.now(), i;
    awayTill = {};
    for (i = 0; i < awayWho.length; i++)
      awayTill[awayWho[i].seat] = now + Math.max(0, awayWho[i].left || 0);
    netHoldOn(true);
    var host = !!(typeof Net !== 'undefined' && Net.S && Net.S.host);
    function draw() {
      if (!box) return;
      var t = Date.now(), rows = [];
      for (var k = 0; k < awayWho.length; k++) {
        var st = awayWho[k].seat;
        var left = Math.max(0, Math.ceil((awayTill[st] - t) / 1000));
        rows.push('<b>' + esc(awayWho[k].name) + '</b> — ' + left + ' сек' +
          (host ? ' <button class="btn tiny" data-awbot="' + st + '">Посадить бота</button>' : ''));
      }
      box.className = 'on';
      box.innerHTML = '<div class="awin"><span class="awh">Партия на паузе: ждём игрока</span>' +
        rows.join(' · ') + '</div>';
    }
    draw();
    awayT = setInterval(draw, 500);
  }

  /* ---------- связь со столом оборвалась ----------

     Ник: «при обрыве игрок вылетает и не может вернуться назад в той же
     сессии — он не может сесть за своё старое место».

     Раньше тут был только красный огонёк на кнопке «Сеть» — и человек
     оставался с ним один. Теперь игра возвращается за стол сама, а
     человек видит, что происходит, и может уйти в меню, если надоест. */
  function netLost() {
    var b = document.getElementById('bNet');
    if (b) { b.style.borderColor = '#e06a5a'; b.style.color = '#ffb3a7'; b.textContent = 'Связь!'; }
    if (typeof Net === 'undefined' || !Net.reconnectLoop) { toast('Связь со столом потеряна'); return; }
    var say = function (t) { var el = document.getElementById('lostT'); if (el) el.textContent = t; };
    modal('<h3>Связь прервалась</h3>' +
      '<p id="lostT">Возвращаем вас за стол — место держат за вами. Попытка 1…</p>' +
      '<div class="row"><button class="btn wide" data-lost="1">Выйти в меню</button></div>',
      function (m) {
        var x = m.querySelector('[data-lost]');
        if (x) x.onclick = function () {
          try { Net.leave(); } catch (e) { }
          closeModal();
          if (window.Boot && Boot.mainMenu) Boot.mainMenu();
        };
      }, { light: true });
    Net.reconnectLoop(function (n) {
      say('Возвращаем вас за стол — место держат за вами. Попытка ' + n + '…');
    }).then(function () {
      closeModal();
      if (b) { b.style.borderColor = ''; b.style.color = ''; b.textContent = 'Сеть'; }
      toast('Вы снова за столом');
    }, function () {
      say('Стол не отзывается. Когда хозяин снова его поднимет, вернитесь через «Вернуться за стол» в меню.');
    });
  }
  function isBusy() { return pumping; }

  return {
    attach: attach, begin: begin, bindOnce: bindOnce, toast: toast, modal: modal,
    closeModal: closeModal, splash: splash, closeSplash: closeSplash, drawAll: drawAll, setSpeed: function (v) { speed = v; },
    netEvents: netEvents, applyRemote: applyRemote, netFillBot: netFillBot,
    /* Ведёт ли место бот. Наружу вынесено ради проверки возврата за
       стол: «сидит ли там ещё бот» — единственный вопрос, который эта
       беда и задаёт, а по экрану его не прочитать. */
    netFreeSeat: netFreeSeat, seatBot: function (i) { return !!(brains && brains[i]); },
    netLost: netLost, isBusy: isBusy, showPane: showPane, setPaused: setPaused, me: me,
    netAway: netAway, netHold: function () { return netHold; },
    copyText: copyText, copyHTML: copyHTML, achGold: achGold,
    chatIn: chatIn, chatTabs: chatTabs, chatDraw: chatDraw,
    lobbyRefresh: function (l) { if (Boot.lobbyRefresh) Boot.lobbyRefresh(l); }
  };
})();

  var SURNAMES = ['Рабинович', 'Кац', 'Шапиро', 'Гуревич', 'Хаит', 'Фельдман',

  // имя тянет за собой род, род — портрет, портрет — характер и манеру говорить
  // сначала выбираем свободный портрет, потом имя ему по полу —

  function rollBots(N, level) {

    for (i = 1; i < N; i++) {
      var sex = Math.random() < 0.6 ? 'm' : 'f';
      var free = ART.facesOf(sex, busy);
      if (!free.length) {                        // портреты этого пола кончились — берём другой
        sex = sex === 'm' ? 'f' : 'm';

      }
      var face = free.length ? free[Math.floor(Math.random() * free.length)] : -1;
      if (face >= 0) { busy.push(face); sex = ART.FACE_SEX[face]; }
      var cand = [];
      for (t = 0; t < pool.length; t++) if (pool[t][1] === sex) cand.push(t);
      var idx = cand.length ? cand[Math.floor(Math.random() * cand.length)] : 0;
      var nm = pool.splice(idx, 1)[0];
      var name = nm[0];
      // легенда садится под своим именем: Беня Крик не бывает Цилей
      var leg = (face >= GOLD0) ? achOfFace(face) : null;
      if (leg) name = leg[1];
      else {
        var r = Math.random();
        if (r < 0.34) name += ' ' + PLACES[Math.floor(Math.random() * PLACES.length)];
        else if (r < 0.58) {
          var fam = SURNAMES[Math.floor(Math.random() * SURNAMES.length)];
          if (name.length + fam.length + 1 <= 14) name += ' ' + fam;
        }
      }
      out.push({ name: name, sex: nm[1], face: face, ch: face >= 0 ? ART.FACE_CH[face] : 'b' });
    }
    return out;
  }

  function opts(N, names) {
    return {
      players: N, pairs: N === 4, human: 0, names: names, target: CFG.target,
      autoBella: CFG.autoBella, strogach: CFG.strogach, bellaAny: CFG.bellaAny,
      redeal4sevens: CFG.redeal4sevens,
      redealLow: CFG.redealLow, klabor: CFG.klabor, obyaz: CFG.obyaz, swap7: CFG.swap7,
      match2: CFG.match2, terz: CFG.terz, polt: CFG.polt, odessa: CFG.odessa
    };
  }

  // на медленном канале ждём, пока докачается колода: одна секунда ожидания
  // лучше, чем белые прямоугольники вместо карт
  function withDeck(fn) {
    var done = false, tm = null;
    ART.warm(function () {
      if (done) return; done = true;
      clearTimeout(tm); fn();
    });
    tm = setTimeout(function () { if (!done) { done = true; fn(); } }, 6000);
  }

  function start() {
    if (Net.S.on) Net.leave();
    var N = CFG.players, i;
    if (N === 2 && CFG.target === 1001) CFG.target = 501;
    if (N !== 2 && CFG.target === 301) CFG.target = 501;
    var bots = rollBots(N, CFG.level);
    var mySex = ART.FACE_SEX[CFG.face] || 'm';
    var names = ['Вы'], sex = [mySex], faces = [CFG.face], chars = [''];
    bots.forEach(function (b) { names.push(b.name); sex.push(b.sex); faces.push(b.face); chars.push(b.ch); });
    var o = opts(N, names); o.sex = sex;
    leftTable = false;
    game = new Engine.Game(o);
    game.faces = faces; game.chars = chars; game.lvl = CFG.level;
    brains = [];
    for (i = 0; i < game.N; i++) brains.push(new Bots.Brain(game, i, CFG.level));
    Talk.reset();
    UI.setSpeed(CFG.speed);
    UI.attach(game, brains, 0);
    Hall.where('bots');                   // из комнаты не уходим — только помечаемся
    withDeck(function () { UI.begin(); });
    netBtn(); talkBtn();
  }

  // хозяин начинает сетевую партию: свободные места добираются ботами
  function startNet() {
    var N = Net.S.cfg.N, i;
    var names = Net.names().slice(0, N);
    var o = opts(N, names);
    o.human = -1;              // в сети журнал общий, поэтому по именам, а не «вы»
    var bots = rollBots(N, CFG.level);
    o.sex = [ART.FACE_SEX[CFG.face] || 'm'];
    for (i = 1; i < N; i++) o.sex.push(bots[i - 1].sex);
    leftTable = false;
    game = new Engine.Game(o);
    game.faces = [Net.S.conns[0].face != null && Net.S.conns[0].face >= 0 ? Net.S.conns[0].face : CFG.face];
    game.chars = ['']; game.lvl = CFG.level;
    game.stats = [statCard()];                       // профили за столом: свой и гостей
    for (i = 1; i < N; i++) {
      var live = !!Net.S.conns[i].conn;
      if (live) {                                  // живой игрок — его имя, портрет и профиль
        game.faces.push(Net.S.conns[i].face != null ? Net.S.conns[i].face : -1);
        game.chars.push('');
        game.stats[i] = Net.S.conns[i].stats || null;
      } else {
        game.faces.push(bots[i - 1].face);
        game.chars.push(bots[i - 1].ch);
        game.names[i] = bots[i - 1].name; game.sex[i] = bots[i - 1].sex;
      }
    }
    Talk.reset();
    brains = [];
    for (i = 0; i < N; i++)
      brains.push((i === 0 || Net.S.conns[i].conn) ? null : new Bots.Brain(game, i, CFG.level));
    UI.setSpeed(CFG.speed);
    UI.attach(game, brains, 0);
    Net.startGame(game);
    game.newHand();
    Net.broadcast(game);
    UI.closeModal();
    UI.netEvents([]);
    netBtn();
    Hall.where('table');       // из комнаты не уходим — помечаемся, что мы за столом
  }

  /* ============================================================
     ЭКРАНЫ
     Всё до партии живёт в стартовом слое #splash и ходит по стеку:
     у каждого экрана есть «назад», а у тех, что открыты поверх идущей
     партии, — ещё и крестик. Пока слой открыт, партия стоит на паузе,
     поэтому окно торга не может затереть настройки.
     ============================================================ */
  var stack = [];

  function go(fn, reset) {
    if (reset) stack = [];
    stack.push(fn);
    fn();
  }
  function back() {
    stack.pop();
    var f = stack[stack.length - 1];
    if (f) f(); else closeAll();
  }
  function closeAll() {
    stack = [];
    UI.closeSplash();
  }
  // Вышли в меню из партии — за столом нас больше нет, даже если объект партии цел.
  // Без этого главное меню считало, что игра идёт, и прятало комнату до перезагрузки.
  var leftTable = false;
  function running() { return !!(game && !game.over) && !leftTable; }
  // за столом ли мы сейчас — своя партия или сетевая, где партию ведёт хозяин
  function atTable() {
    if (running()) return true;
    var ng = Net.S && Net.S.game;
    return !!(Net.S && Net.S.on && Net.S.ready && ng && !ng.over && !leftTable);
  }

  // Холл висит рядом с любым экраном меню: игрок ждёт партнёров и видит разговор.
  // Прячем его только во время партии — на паузе комната не нужна.
  function screen(o) {
    var hall = (o.hall !== false) && !atTable();
    var h = '<div class="nav">' +
      (stack.length > 1 ? '<button class="navb word" data-nav="back" title="Назад">‹<span>Готово</span></button>'
        : '<span class="navb ghost"></span>') +
      '<div class="navt">' + o.title + '</div>' +
      ((o.close !== false && running()) ? '<button class="navb" data-nav="close" title="Закрыть">✕</button>'
        : '<span class="navb ghost"></span>') +
      '</div>' +
      (o.sub ? '<div class="sub">' + o.sub + '</div>' : '') +
      (hall ? '<div class="mainwrap"><div class="mcol">' + o.body + '</div>' + hallHTML() + '</div>'
        : o.body);
    if (hall || o.wide) h = '<!--WIDE-->' + h;
    UI.splash(h, function (m) {
      m.onclick = function (ev) {
        var n = ev.target.closest('[data-nav]');
        if (n) { if (n.dataset.nav === 'back') back(); else closeAll(); return; }
        if (hall && hallWire(ev, m)) return;
        if (o.wire) o.wire(ev, m);
      };
      if (hall) hallStart(m);
      if (o.after) o.after(m);
    }, o.title);
  }

  /* ---------- кусочки, которые нужны нескольким экранам ---------- */
  function segHTML(id, cur, items, cls) {
    return '<div class="seg' + (cls ? ' ' + cls : '') + '" id="' + id + '">' + items.map(function (it) {
      return '<button data-v="' + it[0] + '" class="' + (String(cur) === String(it[0]) ? 'on' : '') +
        '">' + it[1] + '</button>';
    }).join('') + '</div>';
  }


  /* ============================================================
     ПРОФИЛЬ ФАЙЛОМ
     Один файл .klabor уносит с собой всё: имя, портрет, характер,
     открытые портреты, выбитые секреты и статистику.
     Содержимое перемешано и подписано контрольной суммой — руками цифры
     не подправить. Настоящей защитой это не является и не притворяется:
     ключ лежит в коде игры, как и в любой браузерной игре.
     ============================================================ */
  var PF_HEAD = 'KLABOR1';

  function profilePack() {
    return {
      v: 1, ts: Date.now(),
      name: myName(), face: CFG.face, ch: CFG.myChar, uid: Net.myUid(),
      faces: myFaces(), ach: achList(), stats: stats()
    };
  }

  function scramble(bytes) {
    var out = new Uint8Array(bytes.length), st = (0x9e3779b9 ^ bytes.length) >>> 0;
    for (var i = 0; i < bytes.length; i++) {
      st = (Math.imul(st, 1103515245) + 12345) >>> 0;
      out[i] = bytes[i] ^ ((st >>> 16) & 255);
    }
    return out;
  }
  function sumOf(bytes) {
    var s = 0;
    for (var i = 0; i < bytes.length; i++) s = (Math.imul(s, 31) + bytes[i]) >>> 0;
    return s;
  }
  function b64(bytes) {
    var str = '', CH = 8000;
    for (var i = 0; i < bytes.length; i += CH)
      str += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(str);
  }
  function unb64(t) {
    var raw = atob(t), a = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
    return a;
  }
  function utf8(sIn) {
    if (window.TextEncoder) return new TextEncoder().encode(sIn);
    var esc = unescape(encodeURIComponent(sIn)), a = new Uint8Array(esc.length);
    for (var i = 0; i < esc.length; i++) a[i] = esc.charCodeAt(i);
    return a;
  }
  function unutf8(bytes) {
    if (window.TextDecoder) return new TextDecoder().decode(bytes);
    var st = '';
    for (var i = 0; i < bytes.length; i++) st += String.fromCharCode(bytes[i]);
    return decodeURIComponent(escape(st));
  }

  function profileText() {
    var raw = utf8(JSON.stringify(profilePack()));
    return PF_HEAD + '.' + sumOf(raw).toString(36) + '.' + b64(scramble(raw));
  }

  function profileParse(text) {
    var parts = String(text || '').trim().split('.');
    if (parts.length !== 3 || parts[0] !== PF_HEAD) throw new Error('это не файл профиля клабора');
    var raw = scramble(unb64(parts[2]));          // перемешивание своё же и разбирает
    if (sumOf(raw).toString(36) !== parts[1]) throw new Error('файл повреждён');
    var o = JSON.parse(unutf8(raw));
    if (!o || o.v !== 1) throw new Error('версия файла не подходит');
    return o;
  }

  function profileSave() {
    var nm = myName().replace(/[^0-9A-Za-zА-Яа-яЁё]+/g, '-').slice(0, 20) || 'profile';
    var blob = new Blob([profileText()], { type: 'application/octet-stream' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'klabor-' + nm + '.klabor';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    UI.toast('Профиль сохранён в файл ' + a.download);
  }

  // Сливаем, а не затираем: портреты и секреты складываются, статистика
  // берётся та, где партий больше. Так перенос со старого файла ничего не отнимет.
  function profileLoad(text) {
    var o = profileParse(text), i;
    /* Номер игрока — часть профиля: перенёс профиль на другое
       устройство — это по-прежнему ты, и за стол ты садишься одним
       человеком, а не двумя. Если хочется сидеть с двух устройств
       ОДНОВРЕМЕННО (например, самому себя проверить), в профиле есть
       «Сменить номер». */
    if (o.uid) Net.setUid(o.uid);
    if (o.name) setMyName(o.name);
    if (typeof o.face === 'number') CFG.face = o.face;
    if (o.ch) CFG.myChar = o.ch;
    save();
    var f = myFaces().slice();
    (o.faces || []).forEach(function (n) { if (f.indexOf(n) < 0) f.push(n); });
    f.sort(function (a, b) { return a - b; }); saveFaces(f);
    var a = achList().slice();
    (o.ach || []).forEach(function (id) { if (a.indexOf(id) < 0 && achDef(id)) a.push(id); });
    try { localStorage.setItem('klabor-ach', JSON.stringify(a)); } catch (e) { }
    var mine = stats();
    if (o.stats && (o.stats.games || 0) > (mine.games || 0)) {
      var st = {};
      for (var k in ST0) st[k] = (o.stats[k] != null) ? o.stats[k] : ST0[k];
      try { localStorage.setItem('klabor-stats', JSON.stringify(st)); } catch (e) { }
    }
    if (Net.S.on) Net.updateMe(myName(), CFG.face);
    Hall.updateMe(myName(), CFG.face, hallCard());
    ach('loadFile');
    return { faces: f.length, ach: a.length, name: myName() };
  }

  // с какого номера начинается золото — граница одна и та же в игре и в художке
  var GOLD0 = ART.GOLD0;
  // те же портреты одним списком — чтобы случайная выдача их не трогала
  var RARE = ACH.map(function (a) { return a[3]; });

  function achList() {
    var l = null;
    try { l = JSON.parse(localStorage.getItem('klabor-ach') || 'null'); } catch (e) { }
    return l && l.length ? l : [];
  }
  function achHas(id) { return achList().indexOf(id) >= 0; }
  function achDef(id) {
    for (var i = 0; i < ACH.length; i++) if (ACH[i][0] === id) return ACH[i];
    return null;
  }

  // выбить достижение; вернёт {name, why, face}, если оно новое
  var achFresh = [];
  function ach(id) {
    var d = achDef(id);
    if (!d || achHas(id)) return null;
    var l = achList(); l.push(id);
    try { localStorage.setItem('klabor-ach', JSON.stringify(l)); } catch (e) { }
    var mine = myFaces();
    if (mine.indexOf(d[3]) < 0) { mine.push(d[3]); mine.sort(function (a, b) { return a - b; }); saveFaces(mine); }
    var got = { id: id, name: d[1], why: d[2], face: d[3] };
    achFresh.push(got);
    // сразу коротко, без спойлера: что именно выбито — раскроется в конце партии
    try { UI.toast('Секрет открыт! Портрет ждёт в профиле.'); } catch (e) { }
    return got;
  }
  function achTake() { var l = achFresh; achFresh = []; return l; }

  // Простыни из достижений в профиле нет: в сетке портретов просто стоит
  // одна пустая клетка с вопросиком — клик по ней и есть вся подсказка.
  function achLeft() {
    var mine = myFaces(), n = 0;
    for (var i = 0; i < RARE.length; i++) if (mine.indexOf(RARE[i]) < 0) n++;
    return n;
  }
  // какое достижение дало этот портрет (нужно для подсказки в сетке)
  function achOfFace(n) {
    for (var i = 0; i < ACH.length; i++) if (ACH[i][3] === n) return ACH[i];
    return null;
  }
  function rareGot() { return RARE.length - achLeft(); }
  // портрет выбран руками: считаем смены и подсказываем, за что он дан
  function pickedFace(n) {
    bumpStats({ faceSwaps: 1 });
    if (stats().faceSwaps >= 10) ach('faces10');
    faceHint(n);
  }
  // клик по редкому портрету — говорим, за что он достался
  function faceHint(n) {
    var d = achOfFace(n);
    if (!d) {
      // обычный портрет — расскажем хотя бы, кто это
      if (ART.FACE_BIO && ART.FACE_BIO[n]) UI.toast(ART.FACE_BIO[n]);
      return;
    }
    try { UI.toast('«' + d[1] + '» — ' + d[2] + '.'); } catch (e) { }
  }

  /* ---------- портреты: свои открытые и общий пул ----------
     Портретов много, и все сразу отдавать неинтересно: игрок начинает
     с двух дюжин, а за каждую доигранную партию открывается ещё один.
     Ботам это не мешает — они берут кого угодно из всего набора. */
  var FREE_M = 12, FREE_W = 12;

  function defaultFaces() {
    var all = ART.have(), m = [], w = [], i;
    for (i = 0; i < all.length; i++) {
      var n = all[i];
      if (RARE.indexOf(n) >= 0) continue;             // редкие — только за достижения
      if (ART.FACE_SEX[n] === 'f') { if (w.length < FREE_W) w.push(n); }
      else if (m.length < FREE_M) m.push(n);
    }
    return m.concat(w).sort(function (a, b) { return a - b; });
  }

  function myFaces() {
    var all = ART.have(), l = null;
    try { l = JSON.parse(localStorage.getItem('klabor-faces') || 'null'); } catch (e) { }
    if (!l || !l.length) { l = defaultFaces(); saveFaces(l); }
    return l.filter(function (n) { return all.indexOf(n) >= 0; });
  }
  function saveFaces(l) {
    try { localStorage.setItem('klabor-faces', JSON.stringify(l)); } catch (e) { }
    if (l.length >= 100) ach('coll100');
  }

  /* Сколько портретов падает просто за доигранную партию. Дальше лотерея
     работает только на победы: первые два десятка добираются сами собой,
     а за остальными уже надо выигрывать. */
  var FREEPLAY = 44;                                 // 24 стартовых + 20 «за участие»

  // открыть один случайный ещё закрытый портрет; вернёт его номер или -1
  // редкие (за достижения) в эту лотерею не попадают
  function unlockFace(won) {
    var all = ART.have(), mine = myFaces(), left = [];
    if (mine.length >= FREEPLAY && !won) return -1;   // дальше портреты только за победу
    for (var i = 0; i < all.length; i++)
      if (mine.indexOf(all[i]) < 0 && RARE.indexOf(all[i]) < 0) left.push(all[i]);
    if (!left.length) return -1;
    var n = left[Math.floor(Math.random() * left.length)];
    mine.push(n); mine.sort(function (a, b) { return a - b; });
    saveFaces(mine);
    return n;
  }
  // 1 портрет, 2 портрета, 5 портретов — иначе «а 91 портретов» режет глаз
  function plural(n, one, few, many) {
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }
  function facesLine() {
    var mine = myFaces().length, all = ART.have().length;
    var goldAll = 0, goldGot = 0, my = myFaces();
    for (var gi = 0; gi < RARE.length; gi++) if (RARE[gi] >= GOLD0) {
      goldAll++; if (my.indexOf(RARE[gi]) >= 0) goldGot++;
    }
    var rare = 'Редких, за секреты: <b>' + rareGot() + '</b> из ' + RARE.length +
      ' — они с синим ободком, клацните по такому, и он скажет, за что достался.' +
      '<br>Золотых легенд: <b>' + goldGot + '</b> из ' + goldAll +
      ' — эти берутся только за живым столом, с ботами ни одна не выбивается.';
    if (mine >= all) return 'Открыты все ' + all + ' портретов — коллекция собрана. ' + rare;
    var how = (mine >= FREEPLAY)
      ? '. Дальше новый портрет открывается за <b>каждую выигранную</b> партию, а '
      : '. За каждую доигранную партию открывается ещё один — так до ' + FREEPLAY +
        ', дальше только за победы. А ';
    return 'Открыто портретов: <b>' + mine + '</b> из ' + all + how +
      RARE.length + ' ' +
      plural(RARE.length, 'портрет', 'портрета', 'портретов') + ' случайно не ' +
      plural(RARE.length, 'выпадает', 'выпадают', 'выпадают') + ' вовсе.<br>' + rare;
  }

  function faceRow(cur) {
    var l = myFaces();
    if (!l.length) return '<div class="sub">Портреты не найдены в img/faces — играем кружками с буквой.</div>';
    if (l.indexOf(cur) < 0 && cur >= 0) l = l.concat([cur]).sort(function (a, b) { return a - b; });
    var cells = l.map(function (i) {
      var d = achOfFace(i);
      return '<div class="fc' + (cur === i ? ' on' : '') +
        (d ? (i >= GOLD0 ? ' gold' : ' rare') : '') +
        '" data-face="' + i + '"' + (d ? ' title="' + esc(d[1] + ' — ' + d[2]) + '"' : '') +
        '>' + ART.ava(i, 'Я', 'big') + '</div>';
    }).join('');
    if (achLeft()) cells += '<div class="fc q" data-q="1" title="Секрет"><span>?</span></div>';
    var bio = (cur >= 0 && ART.FACE_BIO && ART.FACE_BIO[cur])
      ? '<div class="bio">' + esc(ART.FACE_BIO[cur]) + '</div>' : '';
    return '<div class="facerow">' + cells + '</div>' + bio +
      '<div class="sub" style="margin:6px 0 0">' + facesLine() + '</div>';
  }
  function modeName(n) { return n === 2 ? 'дуэль вдвоём' : n === 4 ? 'напару вчетвером' : 'втроём'; }
  function lvlName(l) { return l === 1 ? 'новичок' : l === 3 ? 'катала' : 'дворовый'; }

  // как устроен стол — этот текст видит гость, он же идёт в паузе
  function rulesSummary(o, lvl) {
    var l = [];
    l.push('Играем <b>' + modeName(o.players) + '</b>, партия до <b>' + o.target + '</b>.');
    if (lvl) l.push('Свободные места ведут боты уровня <b>' + lvlName(lvl) + '</b>.');
    var v = [];
    if (o.swap7) v.push('обмен козырной семёрки');
    if (o.strogach) v.push('строгач на беллу');
    if (o.obyaz) v.push('обяз во втором круге');
    if (o.klabor) v.push('комбинация «клабор»');
    if (o.redeal4sevens) v.push('пересдача при четырёх семёрках');
    if (o.redealLow) v.push('пересдача на бедной руке');
    if (o.pairs && o.match2) v.push('матч из двух раундов');
    l.push('Терц ' + o.terz + ', полтина ' + o.polt +
      '. Белла ' + (o.bellaAny ? 'турнирная — назвать можно любой из двух карт'
        : 'одесская — только первой из двух') + '.');
    l.push(v.length ? 'Включено: ' + v.join(', ') + '.' : 'Дополнительные правила выключены.');
    return l.join(' ');
  }

  /* ---------- настройки ----------
     kind = 'game' — что за стол (только хозяин), 'me' — что про себя (всегда) */
  /* ---------- настройки: экран в меню, окошко за столом ----------
     Пока партия не запущена, любая кнопка меню должна оставаться тем же
     широким экраном с комнатой сбоку — окошко поверх прячет чат. */
  function splashOn() {
    var el = document.getElementById('splash');

  }

       опции один раз, при создании игры: переключатель во время партии ничего
       бы не изменил в текущей раздаче, зато молча поменял бы правила следующей.

      opt('odessa', 'Одесский клабор', 'терц и полтину называют первой картой, а не после торга; ' +

        : 'Одесская: только первой из двух. Положили молча — очки сгорели, второго шанса нет.') +

      opt('obyaz', 'Обяз во втором круге', 'сдающий не может спасовать на своей раздаче — пересдач на пасах не бывает') +

  // клик по вопросику в сетке портретов — единственная подсказка про секреты
  function qHint(ev) {
    if (!ev.target.closest('[data-q]')) return false;
    var left = achLeft();
    UI.toast('Выполните секретные задания, чтобы разблокировать портреты! Закрытых осталось ' + left + '.');
    return true;
  }

  // общий разбор кликов: redraw — перерисовать то же самое, done — «Готово»
  function settingsClick(kind, ev, redraw, done) {
    var t = ev.target, seg;
    if (qHint(ev)) return;
    // страховка к тому же: в идущей партии правила не трогаем даже с клавиатуры
    if (kind === 'game' && running() && !t.closest('[data-x]')) return;
    var fc = t.closest('[data-face]');
    if (fc) {
      CFG.face = +fc.dataset.face; save(); pickedFace(CFG.face);
      if (game && game.faces) { game.faces[UI.me()] = CFG.face; UI.drawAll(); }
      if (Net.S.on) Net.updateMe(null, CFG.face);
      Hall.updateMe(myName(), CFG.face, hallCard());
      return redraw();
    }
    var sk = t.closest('[data-skin]');
    if (sk) { CFG.skin = sk.dataset.skin; save(); ART.applySkin(CFG.skin); return redraw(); }
    seg = t.closest('#segP button');
    if (seg) {
      CFG.players = +seg.dataset.v;
      if (CFG.players === 2 && CFG.target === 1001) CFG.target = 501;
      if (CFG.players !== 2 && CFG.target === 301) CFG.target = 501;
      save(); return redraw();
    }
    seg = t.closest('#segT button'); if (seg) { CFG.target = +seg.dataset.v; save(); return redraw(); }
    seg = t.closest('#segL button'); if (seg) { CFG.level = +seg.dataset.v; save(); return redraw(); }
    seg = t.closest('#segB button'); if (seg) { CFG.bellaAny = seg.dataset.v === '1'; save(); return redraw(); }
    seg = t.closest('#segS button'); if (seg) { CFG.speed = +seg.dataset.v; UI.setSpeed(CFG.speed); save(); return redraw(); }
    var o = t.closest('.opt');
    if (o) {
      var k = o.dataset.t;
      if (k === 'redealLow') CFG.redealLow = CFG.redealLow ? 0 : 13;
      else CFG[k] = !CFG[k];
      save(); talkBtn(); return redraw();
    }
    if (t.closest('[data-brk]')) {
      var f = document.getElementById('brk'), out = document.getElementById('brkOut');
      if (f) saveBroker(f.value);
      if (out) out.textContent = 'Проверяю…';
      Net.testBroker().then(function (v) {
        if (out) out.textContent = (Net.brokerText() || 'общий брокер') + ' — ' + v;
      });
      return;
    }
    if (t.closest('[data-x]')) return done();
  }

  /* Сменили брокер — комната висит на старом адресе, её надо переселить. */
  function saveBroker(v) {
    if (Net.brokerText() === (v || '').trim()) return;
    Net.setBroker(v);
    try { Hall.leave(); hallEnter(); } catch (e) { }
  }

  /* Поле брокера сохраняем по уходу из него, а не только по кнопке:
     человек впишет адрес и нажмёт «Готово», кнопку не тронув. */
  function bindBroker(m) {
    var f = m.querySelector('#brk');
    if (f) f.onchange = f.onblur = function () { saveBroker(f.value); };
  }

  function bindBgFile(m, redraw) {
    var f = m.querySelector('#bgFile');
    if (!f) return;
    f.onchange = function (e) {
      var fl = e.target.files[0]; if (!fl) return;
      var r = new FileReader();
      r.onload = function () {
        try { localStorage.klaborBg = r.result; } catch (err) { UI.toast('Картинка слишком большая'); return; }
        CFG.skin = 'custom'; save(); ART.applySkin('custom'); redraw();
      };
      r.readAsDataURL(fl);
    };
  }

  function scrSettings(kind) {
    screen({
      title: kind === 'game' ? (running() ? 'Правила этой партии' : 'Настройки партии') : 'Мои настройки',
      body: settingsBody(kind) +
        '<div class="row"><button class="btn pri wide" data-x="1">Готово</button></div>',
      wire: function (ev) { settingsClick(kind, ev, function () { scrSettings(kind); }, back); },
      after: function (m) { bindBgFile(m, function () { scrSettings(kind); }); bindBroker(m); }
    });
  }
  function scrSetGame() { scrSettings('game'); }
  function scrSetMe() { scrSettings('me'); }

  function dlgSettings(kind, onClose) {
    kind = kind || 'me';
    if (splashOn()) return go(kind === 'game' ? scrSetGame : scrSetMe);   // мы в меню — обычный экран
    UI.setPaused(true);                                                   // мы за столом — окошко
    UI.modal(
      '<h3>' + (kind === 'game' ? (running() ? 'Правила этой партии' : 'Настройки партии') : 'Мои настройки') + '</h3>' + settingsBody(kind) +
      '<div class="row"><button class="btn pri wide" data-x="1">Готово</button></div>',
      function (m) {
        function reopen() { UI.closeModal(); dlgSettings(kind, onClose); }
        bindBgFile(m, reopen); bindBroker(m);
        m.onclick = function (ev) {
          settingsClick(kind, ev, reopen, function () {
            UI.closeModal();
            if (!splashOn()) UI.setPaused(false);
            if (onClose) onClose();
          });
        };
      });
  }

  function scrRules() {
    ach('reader');
    screen({
      title: 'Правила клабора',
      body: rulesHTML() + '<div class="row"><button class="btn pri wide" data-r="1">Понятно</button></div>',
      wire: function (ev) { if (ev.target.closest('[data-r]')) back(); }
    });
  }

  function dlgRules() {
    if (splashOn()) return go(scrRules);
    ach('reader');
    UI.setPaused(true);
    UI.modal('<h3>Правила клабора</h3>' + rulesHTML() +
      '<div class="row"><button class="btn pri wide" data-r="1">Понятно</button></div>',
      function (m) {
        m.onclick = function (ev) {
          if (!ev.target.closest('[data-r]')) return;
          UI.closeModal();
          if (!document.getElementById('splash').classList.contains('on')) UI.setPaused(false);
        };
      });
  }

  /* ---------- сохранение партии и статистика ---------- */
  function saveSolo() {
    if (!game || Net.S.on || game.over) return;
    try {
      localStorage.setItem('klabor-solo', JSON.stringify({
        ts: Date.now(), players: game.N, lvl: CFG.level,
        faces: game.faces || null, chars: game.chars || null,
        game: Engine.snapshot(game)
      }));
    } catch (e) { }
  }
  function savedSolo() {
    try {
      var d = JSON.parse(localStorage.getItem('klabor-solo') || 'null');
      if (!d || !d.game || d.game.over) return null;
      return d;
    } catch (e) { return null; }
  }
  function dropSolo() { try { localStorage.removeItem('klabor-solo'); } catch (e) { } }

  function resumeSolo() {
    var d = savedSolo(); if (!d) return start();
    if (Net.S.on) Net.leave();
    leftTable = false;
    game = Engine.restore(d.game);
    game.faces = d.faces || []; game.chars = d.chars || []; game.lvl = d.lvl || CFG.level;
    brains = [];
    for (var i = 0; i < game.N; i++) brains.push(new Bots.Brain(game, i, d.lvl || CFG.level));
    Talk.reset();
    UI.setSpeed(CFG.speed);
    UI.attach(game, brains, 0);
    closeAll();
    UI.netEvents([]);
    netBtn(); talkBtn();
    Hall.where('bots');        // продолженная партия — такая же партия
    UI.toast('Партия продолжена, раздача ' + game.handNo);
  }

  var ST0 = {
    games: 0, wins: 0, hands: 0, beitsGot: 0, beitsGave: 0, lyzhi: 0, best: 0, bestGame: 0,
    tricks: 0, combos: 0, comboPts: 0, bella: 0, declared: 0, declWon: 0,
    g2: 0, w2: 0, g3: 0, w3: 0, g4: 0, w4: 0, since: 0,
    netAll: 0, netOne: 0, streak: 0,
    // партия 3: старые сохранения этих ключей не знают — stats() подставит им нули
    hosted: 0, joined: 0, mateWins: 0, talkGames: 0, hallMsgs: 0, faceSwaps: 0,
    lvl1: 0, lvl2: 0, lvl3: 0,
    // партия 4: сколько разных дней садились за стол и когда это было в последний раз
    days: 0, lastDay: 0,
    /* партия 5: то же самое, но считается только за столом с живыми людьми.
       Игра с ботами сюда не попадает вовсе — на то и «по сети». */
    nGames: 0, nWins: 0, nHands: 0, nStreak: 0, nDays: 0, nLastDay: 0,
    /* золотые (партия 6): своя копилка на каждую легенду. Старые сохранения
       этих ключей не знают — stats() подставит им нули. */
    nDeclWon: 0, nNoWord: 0, nSpy: 0, nBeitOpp: 0, nDefWon: 0, nCombos: 0,
    nChat: 0, nPosled: 0, nTricks: 0, nNoBeit: 0, nDry: 0,
    nW2: 0, nW3: 0, nW4: 0
  };
  function stats() {
    try {
      var d = JSON.parse(localStorage.getItem('klabor-stats') || '{}'), o = {};
      for (var k in ST0) o[k] = (k in d) ? d[k] : ST0[k];
      return o;
    } catch (e) { return JSON.parse(JSON.stringify(ST0)); }
  }
  function bumpStats(patch) {
    var st = stats();
    for (var k in patch) st[k] = (st[k] || 0) + patch[k];
    try { localStorage.setItem('klabor-stats', JSON.stringify(st)); } catch (e) { }
  }
  function setBest(v) { setMax('best', v); }
  function setMax(key, v) {
    var st = stats();
    if (v > (st[key] || 0)) { st[key] = v; try { localStorage.setItem('klabor-stats', JSON.stringify(st)); } catch (e) { } }
  }
  function resetStats() {
    var st = JSON.parse(JSON.stringify(ST0));
    st.since = Date.now();
    try { localStorage.setItem('klabor-stats', JSON.stringify(st)); } catch (e) { }
  }
  // короткая карточка для чужих глаз: её видят соперники по сети
  function statCard() {
    var st = stats();
    return {
      games: st.games, wins: st.wins, hands: st.hands, best: st.best, bestGame: st.bestGame,
      beitsGot: st.beitsGot, beitsGave: st.beitsGave, lyzhi: st.lyzhi,
      tricks: st.tricks, combos: st.combos, declared: st.declared, declWon: st.declWon,
      g2: st.g2, w2: st.w2, g3: st.g3, w3: st.w3, g4: st.g4, w4: st.w4
    };
  }
  function myName() { return (Net.LS('klabor-name') || '').trim() || 'Вы'; }

  /* Первый заход: имя и портрет выдаём случайные из нашего же набора,
     и сразу показываем профиль. Иначе за сетевым столом сидели три «Вы». */
  function firstRun() { return !(Net.LS('klabor-name') || '').trim(); }

  function rollMe() {
    var mine = myFaces();
    var face = mine.length ? mine[Math.floor(Math.random() * mine.length)] : CFG.face;
    var sex = ART.FACE_SEX[face] || 'm';
    var cand = BOTNAMES.filter(function (n) { return n[1] === sex; });
    if (!cand.length) cand = BOTNAMES;
    var nm = cand[Math.floor(Math.random() * cand.length)][0];
    var pl = PLACES[Math.floor(Math.random() * PLACES.length)];
    // имя игрока режется до 14 знаков — прозвище лепим, только если влезает целиком
    if (Math.random() < 0.3 && (nm + ' ' + pl).length <= 14) nm += ' ' + pl;
    setMyName(nm);
    CFG.face = face; save();
    return nm;
  }
  function setMyName(v) { Net.LS('klabor-name', (v || '').trim().slice(0, 14)); }
  function statsLine() {
    var st = stats(), a = [];
    if (!st.games && !st.hands) return 'Всего: пока ничего не сыграно.';
    a.push(st.games ? 'партий ' + st.games + ' (побед ' + st.wins + ')' : 'партий пока нет');
    if (st.hands) a.push('раздач ' + st.hands);
    if (st.beitsGot || st.beitsGave) a.push('бейтов: получено ' + st.beitsGot + ', поставлено ' + st.beitsGave);
    if (st.lyzhi) a.push('лыжи ' + st.lyzhi);
    if (st.best) a.push('лучшая раздача ' + st.best);
    return 'Всего: ' + a.join(' · ') + '.';
  }

  /* ---------- болтовня ---------- */
  function talkBtn() {
    var b = $('#bTalk'); if (!b) return;
    b.textContent = CFG.talk ? 'Базар' : 'Тишина';
    b.style.color = CFG.talk ? 'var(--gold)' : '';

    CFG.talk = !CFG.talk; save(); talkBtn();
